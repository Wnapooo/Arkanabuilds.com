<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds — ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #f3f4f6;
    --border: #1a1c23;
    --card: #14161d;
    --card-border: #1f222c;
    --chip: #1c1e27;
    --chip-border: #2a2d38;
    --accent: #818cf8;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --muted: #5b5f6d;
    --heading: #1a1c23;
    --border: #e4e4ea;
    --card: #ffffff;
    --card-border: #e4e4ea;
    --chip: #ffffff;
    --chip-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-right a { color: var(--muted); text-decoration: none; font-size: 14px; }
  .nav-right a.active { color: var(--accent); }

  .toggle {
    width: 36px; height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left .2s ease;
  }
  body.light .toggle::after { left: 18px; }
  .social-icons { display: flex; align-items: center; gap: 14px; }
  .icon-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    opacity: .85;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity .15s ease, transform .15s ease;
  }
  .icon-circle:hover { opacity: 1; transform: translateY(-1px); }

  main { max-width: 1200px; padding: 80px 40px 80px; }
  h1 { margin: 0 0 6px; font-size: 32px; color: var(--heading); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  /* Título igual al del inicio */
  h1.hero-title { font-size: 48px; font-weight: 800; line-height: 1.1; margin: 0; }
  h1.hero-title.accent { color: var(--accent); }
  h1.hero-title.white { color: var(--heading); }
  .hero-sub { color: var(--muted); font-size: 17px; max-width: 480px; margin: 20px 0 28px; line-height: 1.5; }

  /* ===== Pestañas de juego ===== */
  .game-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .game-tab {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .game-tab:hover { color: var(--text); }
  .game-tab[aria-selected="true"] {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ===== Buscador ===== */
  .search {
    width: 100%;
    max-width: 420px;
    margin-bottom: 28px;
    padding: 11px 16px;
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, .card:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  /* ===== Galería ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    background: var(--chip);
  }
  .card span {
    display: block;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    border-top: 1px solid var(--card-border);
  }
  .card small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }

  /* ===== Detalle ===== */
  .back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    align-items: start;
  }
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    margin-bottom: 16px;
  }
  .shot {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .pending { color: var(--muted); font-size: 15px; margin: 0; }


  /* ============================================================
     HSR: página de personaje (retrato | armas y sets | equipos)
     ============================================================ */
  body.hsr-open {
    --bg:#0b0c10; --text:#e5e7eb; --muted:#a3a8b6; --heading:#f3f4f6;
    --border:#1a1c23; --card:#14161d; --card-border:#1f222c;
    --chip:#1c1e27; --chip-border:#2a2d38; --toggle-bg:#23252f; --toggle-knob:#6b7280;
  }
  main { isolation: isolate; position: relative; }
  main.wide { max-width: 1680px; }
  .navbar { position: relative; z-index: 2; }

  [data-el] { --e1:#2a2a33; --e2:#8a8a9a; --e3:#e6e6ee; }
  [data-el="physical"]  { --e1:#2b2a33; --e2:#a5a3b5; --e3:#f1f0f6; }
  [data-el="fire"]      { --e1:#3a0e0a; --e2:#f0592c; --e3:#ffd08a; }
  [data-el="ice"]       { --e1:#0a2236; --e2:#3fa6ea; --e3:#d6f3ff; }
  [data-el="lightning"] { --e1:#2a0c3d; --e2:#b858f2; --e3:#f0d6ff; }
  [data-el="wind"]      { --e1:#082e26; --e2:#2fcfa0; --e3:#d6fff0; }
  [data-el="quantum"]   { --e1:#14104a; --e2:#6657f5; --e3:#d3ceff; }
  [data-el="imaginary"] { --e1:#3b3005; --e2:#eacb30; --e3:#fff5b8; }

  /* fondo a pantalla completa */
  .hsr-bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(90% 70% at 18% 30%, color-mix(in srgb, var(--e2) 38%, transparent), transparent 60%),
      radial-gradient(70% 60% at 85% 100%, color-mix(in srgb, var(--e2) 30%, transparent), transparent 65%),
      linear-gradient(160deg, var(--e1), #07080d 75%);
  }
  /* el arte del personaje, muy difuminado, da el color propio de cada uno */
  .hsr-bg::before {
    content: ""; position: absolute; inset: -8%;
    background: var(--art) 25% 10% / cover no-repeat;
    filter: blur(70px) saturate(1.5);
    opacity: .3;
  }
  /* órbitas y estrellas */
  .hsr-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-radial-gradient(circle at 16% 34%, transparent 0 70px, color-mix(in srgb, var(--e3) 13%, transparent) 70px 71px),
      radial-gradient(circle, var(--e3) 0 1.2px, transparent 1.7px) 8% 12% / 170px 170px,
      radial-gradient(circle, var(--e3) 0 .9px, transparent 1.4px) 60% 70% / 120px 120px,
      radial-gradient(circle, #fff 0 .7px, transparent 1.2px) 35% 45% / 90px 90px;
    -webkit-mask-image: radial-gradient(120% 100% at 16% 34%, #000 20%, transparent 80%);
            mask-image: radial-gradient(120% 100% at 16% 34%, #000 20%, transparent 80%);
    opacity: .7;
  }

  .hsr-grid {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }
  /* paneles más grandes: armas y sets ancho/alto, equipos como columna alta */
  main.wide { max-width: 1840px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }
  .panel { display: flex; flex-direction: column; }
  .panel-main  { min-height: 725px; }
  .panel-teams { min-height: 740px; }
  .panel-body { flex: 1; display: flex; flex-direction: column; }
  .panel-body .shot { flex: none; }
  .panel-body .pending { flex: 1; min-height: 0; }
  .hsr-id h1 { font-size: 38px; line-height: 1.1; margin: 0 0 10px; color: var(--heading); text-shadow: 0 2px 18px color-mix(in srgb, var(--e2) 60%, transparent); }
  .el-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--e3); font-weight: 600; }
  .el-tag::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--e2); box-shadow: 0 0 10px var(--e2);
  }

  .portrait-stage {
    position: relative; overflow: hidden; isolation: isolate;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--e2) 55%, transparent);
    box-shadow: 0 18px 50px -18px var(--e2);
    margin-bottom: 18px;
    background:
      radial-gradient(120% 80% at 50% 108%, color-mix(in srgb, var(--e2) 75%, transparent), transparent 62%),
      radial-gradient(60% 50% at 50% 34%, color-mix(in srgb, var(--e3) 38%, transparent), transparent 70%),
      linear-gradient(165deg, var(--e1), #07080d 92%);
  }
  .portrait-stage::before {
    content: ""; position: absolute; inset: -20%; z-index: 0;
    background: repeating-radial-gradient(circle at 50% 42%, transparent 0 26px, color-mix(in srgb, var(--e3) 22%, transparent) 26px 27px);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
            mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
  }
  .portrait-stage .portrait {
    position: relative; z-index: 1; height: 100%;
    margin: 0; border: 0; border-radius: 0; background: transparent;
  }


  .el-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    width: 38px; height: 38px;
    padding: 5px;
    border-radius: 50%;
    background: rgba(8,9,14,.62);
    border: 1px solid color-mix(in srgb, var(--e2) 70%, transparent);
    box-shadow: 0 0 16px -2px var(--e2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .el-ico { width: 20px; height: 20px; object-fit: contain; }
  .el-tag:has(.el-ico)::before { display: none; }

  .panel {
    border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--e2) 38%, var(--card-border));
    background: linear-gradient(180deg, rgba(14,16,24,.72), rgba(8,9,14,.78));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px -30px #000;
    overflow: hidden;
  }
  .panel h2 {
    margin: 0; padding: 16px 20px 14px;
    font-size: 17px; font-weight: 700; color: var(--heading);
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid color-mix(in srgb, var(--e2) 25%, var(--card-border));
    background: linear-gradient(90deg, color-mix(in srgb, var(--e2) 22%, transparent), transparent 70%);
  }
  .panel h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--e2); box-shadow: 0 0 10px var(--e2); }
  .panel-body { padding: 16px; }
  .panel-body .shot { border: 0; border-radius: 10px; }
  .panel-body .pending {
    display: grid; place-items: center; text-align: center;
    min-height: 260px; padding: 24px;
    border: 1px dashed color-mix(in srgb, var(--e2) 45%, transparent);
    border-radius: 10px; color: var(--muted);
  }

  @media (max-width: 1100px) {
    .hsr-grid { grid-template-columns: 240px minmax(0, 1fr); }
    .hsr-grid .panel:last-child { grid-column: 1 / -1; }
    .panel-main { min-height: 520px; }
    .panel-teams { min-height: 420px; }
  }
  @media (max-width: 800px) {
    .panel-main, .panel-teams { min-height: 320px; }
    .hsr-grid { grid-template-columns: 1fr; }
    .hsr-id { max-width: 280px; }
  }


  /* ============================================================
     FONDOS EXCLUSIVOS POR PERSONAJE (HSR)
     Cada personaje tiene sus colores y composición en CHAR_BG (script)
     ============================================================ */
  .hsr-bg.fx {
    background:
      radial-gradient(60% 55% at var(--p1x) var(--p1y), color-mix(in srgb, var(--b2) 42%, transparent), transparent 66%),
      radial-gradient(45% 50% at var(--p2x) var(--p2y), color-mix(in srgb, var(--b3) 34%, transparent), transparent 68%),
      radial-gradient(40% 35% at var(--p3x) var(--p3y), color-mix(in srgb, var(--b2) 26%, transparent), transparent 70%),
      linear-gradient(var(--ang), var(--b1), color-mix(in srgb, var(--b1) 45%, #05050c) 48%, #05050c);
  }
  .hsr-bg.lay-0 { --p1x:14%; --p1y:38%; --p2x:92%; --p2y:96%; --p3x:70%; --p3y:8%;  --ang:162deg; }
  .hsr-bg.lay-1 { --p1x:86%; --p1y:30%; --p2x:8%;  --p2y:92%; --p3x:40%; --p3y:6%;  --ang:200deg; }
  .hsr-bg.lay-2 { --p1x:50%; --p1y:8%;  --p2x:10%; --p2y:70%; --p3x:92%; --p3y:80%; --ang:180deg; }
  .hsr-bg.lay-3 { --p1x:20%; --p1y:85%; --p2x:88%; --p2y:15%; --p3x:55%; --p3y:55%; --ang:135deg; }
  .hsr-bg.lay-4 { --p1x:80%; --p1y:75%; --p2x:12%; --p2y:18%; --p3x:60%; --p3y:30%; --ang:215deg; }
  .hsr-bg.lay-5 { --p1x:30%; --p1y:20%; --p2x:75%; --p2y:90%; --p3x:95%; --p3y:40%; --ang:150deg; }

  [hidden] { display: none !important; }

  @media (max-width: 800px) {
    .navbar { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
    .nav-right { gap: 16px; flex-wrap: wrap; }
    main { padding: 40px 20px 60px; }
    h1.hero-title { font-size: 36px; }
    .detail { grid-template-columns: 1fr; }
    .portrait { max-width: 280px; }
  }


  /* ===== Ajustes extra para móvil ===== */
  @media (hover: none) {
    .card:hover { transform: none; border-color: var(--card-border); }
  }
  @media (max-width: 800px) {
    .navbar { padding: 14px 16px; }
    .nav-right { width: 100%; justify-content: space-between; gap: 12px; }
    .nav-right > a { padding: 6px 2px; }
    .social-icons { gap: 10px; }
    .icon-circle { width: 34px; height: 34px; }

    /* main.wide (páginas de HSR) tenía sus propios márgenes laterales de escritorio */
    main, main.wide { padding: 28px 16px 48px; }
    h1.hero-title { font-size: 34px; word-break: break-word; }
    .hero-sub { font-size: 16px; margin: 14px 0 20px; }

    .game-tabs { padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .game-tab { padding: 10px 16px; }
    .search { max-width: 100%; font-size: 16px; margin-bottom: 20px; } /* 16px evita el zoom automático en iPhone */

    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .card span { padding: 9px 10px; font-size: 13px; }

    .back { padding: 8px 0; margin-bottom: 12px; font-size: 15px; }
    .hsr-grid { gap: 16px; }
    .hsr-id { max-width: 340px; }
    .hsr-id h1 { font-size: 30px; }
    .panel-main, .panel-teams { min-height: 0; }
    .panel h2 { padding: 14px 16px 12px; font-size: 16px; }
    .panel-body { padding: 12px; }
    .panel-body .pending { min-height: 180px; padding: 18px; }

    /* efectos pesados más ligeros en celulares */
    .hsr-bg::before { filter: blur(40px) saturate(1.5); }
    .panel { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  }
</style>
</head>

    },
    wuwa: {

      // Nombre real de cada archivo (las imágenes nuevas tienen nombres distintos)

  function findChar(slug) {
    for (const key in GAMES) {

    return null;

  function img(gameKey, slug) {

              <h2>Armas y sets</h2>
              <div class="panel-body">
                <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}" onerror="${buildErr(slug)}">
              </div>
            </section>
            <section class="panel panel-teams">
              <h2>Equipos</h2>
              <div class="panel-body">
                <img class="shot" src="${teamsImg(slug)}" alt="Equipos de ${c[1]}" onerror="${pendingImg('Equipos pendientes.')}">
              </div>
            </section>
          </div>
        </div>`;
      return true;
    }

    $('detail').innerHTML = `
      <a class="back" href="#">← Todos los personajes</a>
      <div class="detail">
        <div>
          <img class="portrait" src="${img(game, slug)}" alt="${c[1]}">
          <h1>${c[1]}</h1>
          <p class="sub">${c[2]}</p>
        </div>
        <div>
          <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}" onerror="${buildErr(slug)}">
        </div>
      </div>`;
    return true;
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const showDetail = slug && renderDetail(slug);
    if (showDetail) {
      // al volver a la galería, queda en la pestaña del juego del personaje
      const f = findChar(slug);
      if (f && f.game !== currentGame) { currentGame = f.game; renderTabs(); renderGrid(); }
    }
    const f2 = showDetail && findChar(slug);
    const isHsr = !!(f2 && elOf(f2.game, slug));
    document.body.classList.toggle('hsr-open', isHsr);
    document.querySelector('main').classList.toggle('wide', isHsr);
    $('detail').hidden = !showDetail;
    $('gallery').hidden = !!showDetail;
    window.scrollTo(0, 0);
  }

  $('search').addEventListener('input', renderGrid);

  window.addEventListener('hashchange', route);
  renderTabs();
  renderGrid();
  route();

</script>
</body>
</html>
