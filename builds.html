<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds — ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #f3f4f6;
    --border: #1a1c23;
    --card: #14161d;
    --card-border: #1f222c;
    --chip: #1c1e27;
    --chip-border: #2a2d38;
    --accent: #818cf8;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --muted: #5b5f6d;
    --heading: #1a1c23;
    --border: #e4e4ea;
    --card: #ffffff;
    --card-border: #e4e4ea;
    --chip: #ffffff;
    --chip-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-right a { color: var(--muted); text-decoration: none; font-size: 14px; }
  .nav-right a.active { color: var(--accent); }

  .toggle {
    width: 36px; height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left .2s ease;
  }
  body.light .toggle::after { left: 18px; }
  .social-icons { display: flex; align-items: center; gap: 14px; }
  .icon-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    opacity: .85;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity .15s ease, transform .15s ease;
  }
  .icon-circle:hover { opacity: 1; transform: translateY(-1px); }

  main { max-width: 1200px; padding: 80px 40px 80px; }
  h1 { margin: 0 0 6px; font-size: 32px; color: var(--heading); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  /* Título igual al del inicio */
  h1.hero-title { font-size: 48px; font-weight: 800; line-height: 1.1; margin: 0; }
  h1.hero-title.accent { color: var(--accent); }
  h1.hero-title.white { color: var(--heading); }
  .hero-sub { color: var(--muted); font-size: 17px; max-width: 480px; margin: 20px 0 28px; line-height: 1.5; }

  /* ===== Pestañas de juego ===== */
  .game-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .game-tab {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .game-tab:hover { color: var(--text); }
  .game-tab[aria-selected="true"] {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ===== Buscador ===== */
  .search {
    width: 100%;
    max-width: 420px;
    margin-bottom: 28px;
    padding: 11px 16px;
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, .card:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  /* ===== Galería ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    background: var(--chip);
  }
  .card span {
    display: block;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    border-top: 1px solid var(--card-border);
  }
  .card small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }

  /* ===== Detalle ===== */
  .back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    align-items: start;
  }
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    margin-bottom: 16px;
  }
  .shot {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .pending { color: var(--muted); font-size: 15px; margin: 0; }

  [hidden] { display: none !important; }

  @media (max-width: 800px) {
    .navbar { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
    .nav-right { gap: 16px; flex-wrap: wrap; }
    main { padding: 40px 20px 60px; }
    h1.hero-title { font-size: 36px; }
    .detail { grid-template-columns: 1fr; }
    .portrait { max-width: 280px; }
  }
</style>
</head>
<body>

  <div class="navbar">

      <div class="social-icons">
        <a class="icon-circle" href="https://discord.gg/HgEqZERZ97" target="_blank" rel="noopener" title="Discord">💬</a>

  <main>

<script>

        ['roxy','Roxy','Support'], ['sunna','Sunna','Support'], ['ukinami-yuzuha','Ukinami Yuzuha','Support'],
        ['astra-yao','Astra Yao','Support'], ['koleda','Koleda','Support'], ['nicole-demara','Nicole Demara','Support'],

    },
    wuwa: {
      label: 'Wuthering Waves',
      suffix: '_card.webp',
      // Nombre real de cada archivo (las imágenes nuevas tienen nombres distintos)
      files: {
        'aug':'aug_card2.webp', 'brant':'card_brant2.webp', 'buling':'buling_card2.webp',
        'canta':'card_canta2.webp', 'carlotta':'card_carlotta2.webp', 'cart':'cart_card2.webp',
        'changli':'card_changli2.webp', 'chisa':'chisa_card2.webp', 'cia':'cia_card2.webp',
        'denia':'denia_card2.webp', 'gal':'gal_card2.webp', 'hiyuki':'hiyuki_card2.webp',
        'hsin':'hsin_card2.webp', 'iuno':'iuno_card2.webp', 'jingran':'jingran_card2.webp',
        'jihni':'jihni_card2.webp', 'jiyan':'jiyan_card2.webp', 'lucilla':'Lucilla_card2.webp',
        'lucy':'lucy_card2.webp', 'lupa':'lupa_card2.webp', 'luuk-herssen':'Luuk Herssen_card2.webp',
        'lynae':'Lynae_card2.webp', 'math':'math_card2.webp', 'mornye':'Mornye_card2.webp',
        'mortefi':'mortefi_card2.webp', 'phoebe':'card_phoebe2.webp', 'phr':'phr_card2.webp',
        'qingxiao':'qingxiao_card2.webp', 'qiu':'qiu_card2.webp', 'rebecca':'rebecca_card2.webp',
        'rover-aero':'roveraero_card2.webp', 'rover-electro':'roverelectro_card2.webp', 'rover-spectro':'roverspectro_card2.webp',
        'senhua':'senhua_card2.webp', 'keeper':'card_keeper2.webp', 'sigrika':'Sigrika_card2.webp',
        'suisui':'suisui_card2.webp', 'suoming':'suoming_card2.webp', 'verina':'verina_card2.webp',
        'yangyang-xuanling':'yangyang-xuanling_card2.webp', 'zani':'card_zani2.webp'
      },
      chars: [
        ['aug','Augusta',''], ['brant','Brant',''], ['buling','Buling',''], ['canta','Cantarella',''],
        ['carlotta','Carlotta',''], ['cart','Cartethyia',''], ['changli','Changli',''], ['chisa','Chisa',''],
        ['cia','Ciaccona',''], ['denia','Denia',''], ['gal','Galbrena',''], ['hiyuki','Hiyuki',''],
        ['hsin','Hsin',''], ['iuno','Iuno',''], ['jingran','Jingran',''], ['jihni','Jinhsi',''],
        ['jiyan','Jiyan',''], ['lucilla','Lucilla',''], ['lucy','Lucy',''], ['lupa','Lupa',''],
        ['luuk-herssen','Luuk Herssen',''], ['lynae','Lynae',''], ['math','Math',''], ['mornye','Mornye',''],
        ['mortefi','Mortefi',''], ['phoebe','Phoebe',''], ['phr','Phrolova',''], ['qingxiao','Qingxiao',''],
        ['qiu','Qiuyuan',''], ['rebecca','Rebecca',''], ['rover-aero','Rover Aero',''], ['rover-electro','Rover Electro',''],
        ['rover-spectro','Rover Spectro',''], ['senhua','Senhua',''], ['keeper','Shorekeeper',''], ['sigrika','Sigrika',''],
        ['suisui','Suisui',''], ['suoming','Suoming',''], ['verina','Verina',''], ['yangyang-xuanling','Yangyang Xuanling',''],

      ]
    },
    hsr: {

        ['tingyun','Tingyun',''], ['tingyun-fugue','Tingyun Fugue',''], ['topaz','Topaz',''],
        ['trailblazer-elation','Trailblazer Elation',''], ['trailblazer-harmony','Trailblazer Harmony',''],
        ['trailblazer-remembrance','Trailblazer Remembrance',''], ['tribbie','Tribbie',''], ['welt','Welt',''],
        ['yao-guang','Yao Guang',''], ['yunli','Yunli','']
      ]
    }
  };

  /* ============================================================
     2) SCREENSHOT DE LA BUILD
     Guarda la captura de cada personaje en la carpeta "builds"
     con el nombre del slug, por ejemplo: builds/claret.png
     ============================================================ */
  const buildImg = slug => `./builds/${slug}.png`;

  /* ============================================================ */
  const $ = id => document.getElementById(id);
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

  let currentGame = 'zzz';

  function findChar(slug) {
    for (const key in GAMES) {
      const c = GAMES[key].chars.find(x => x[0] === slug);
      if (c) return { game: key, char: c };
    }
    return null;
  }

  function img(gameKey, slug) {
    const g = GAMES[gameKey];
    const file = (g.files && g.files[slug]) || (slug + g.suffix);
    return './' + encodeURI(file);
  }

  function renderTabs() {
    $('game-tabs').innerHTML = Object.keys(GAMES).map(key => `
      <button class="game-tab" role="tab" aria-selected="${key === currentGame}" data-game="${key}">${GAMES[key].label}</button>
    `).join('');
    $('game-tabs').querySelectorAll('.game-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentGame = btn.dataset.game;
        renderTabs();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const q = norm($('search').value);
    const list = GAMES[currentGame].chars
      .filter(c => norm(c[1]).includes(q) || norm(c[0]).includes(q))
      .map(([slug, name, role]) => `
        <a class="card" href="#${slug}">
          <img src="${img(currentGame, slug)}" alt="${name}" loading="lazy">
          <span>${name}${role ? `<small>${role}</small>` : ''}</span>
        </a>`).join('');
    $('grid').innerHTML = list;
    $('empty').hidden = list !== '';
  }

  function renderDetail(slug) {
    const found = findChar(slug);
    if (!found) return false;
    const { game, char: c } = found;
    $('detail').innerHTML = `
      <a class="back" href="#">← Todos los personajes</a>
      <div class="detail">
        <div>
          <img class="portrait" src="${img(game, slug)}" alt="${c[1]}">
          <h1>${c[1]}</h1>
          <p class="sub">${c[2]}</p>
        </div>
        <div>
          <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}"
               onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'pending',textContent:'Build pendiente.'}))">
        </div>
      </div>`;
    return true;
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const showDetail = slug && renderDetail(slug);
    $('detail').hidden = !showDetail;
    $('gallery').hidden = !!showDetail;
    window.scrollTo(0, 0);
  }

  $('search').addEventListener('input', renderGrid);

  window.addEventListener('hashchange', route);
  renderTabs();
  renderGrid();
  route();

  try { if (localStorage.getItem('arkana-theme') === 'light') document.body.classList.add('light'); } catch (e) {}
  $('theme-toggle').addEventListener('click', () => {
    document.body.classList.toggle('light');
    try { localStorage.setItem('arkana-theme', document.body.classList.contains('light') ? 'light' : 'dark'); } catch (e) {}
  });
</script>
</body>
