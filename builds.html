<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds — ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #f3f4f6;
    --border: #1a1c23;
    --card: #14161d;
    --card-border: #1f222c;
    --chip: #1c1e27;
    --chip-border: #2a2d38;
    --accent: #818cf8;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --muted: #5b5f6d;
    --heading: #1a1c23;
    --border: #e4e4ea;
    --card: #ffffff;
    --card-border: #e4e4ea;
    --chip: #ffffff;
    --chip-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-right a { color: var(--muted); text-decoration: none; font-size: 14px; }
  .nav-right a.active { color: var(--accent); }

  .toggle {
    width: 36px; height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left .2s ease;
  }
  body.light .toggle::after { left: 18px; }
  .social-icons { display: flex; align-items: center; gap: 14px; }
  .icon-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    opacity: .85;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity .15s ease, transform .15s ease;
  }
  .icon-circle:hover { opacity: 1; transform: translateY(-1px); }

  main { max-width: 1200px; padding: 80px 40px 80px; }
  h1 { margin: 0 0 6px; font-size: 32px; color: var(--heading); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  /* Título igual al del inicio */
  h1.hero-title { font-size: 48px; font-weight: 800; line-height: 1.1; margin: 0; }
  h1.hero-title.accent { color: var(--accent); }
  h1.hero-title.white { color: var(--heading); }
  .hero-sub { color: var(--muted); font-size: 17px; max-width: 480px; margin: 20px 0 28px; line-height: 1.5; }

  /* ===== Pestañas de juego ===== */
  .game-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .game-tab {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .game-tab:hover { color: var(--text); }
  .game-tab[aria-selected="true"] {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ===== Buscador ===== */
  .search {
    width: 100%;
    max-width: 420px;
    margin-bottom: 28px;
    padding: 11px 16px;
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, .card:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  /* ===== Galería ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    background: var(--chip);
  }
  .card span {
    display: block;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    border-top: 1px solid var(--card-border);
  }
  .card small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  /* ZZZ: iconos de elemento y especialidad en la card */
  .card .mini { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-style: normal; }
  .card .mini img { display: inline-block; width: 20px; height: 20px; aspect-ratio: auto; object-fit: contain; background: none; }

  /* ===== Detalle ===== */
  .back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    align-items: start;
  }
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    margin-bottom: 16px;
  }
  .shot {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .pending { color: var(--muted); font-size: 15px; margin: 0; }


  /* ============================================================
     HSR: página de personaje (retrato | armas y sets | equipos)
     ============================================================ */
  body.hsr-open {
    --bg:#0b0c10; --text:#e5e7eb; --muted:#a3a8b6; --heading:#f3f4f6;
    --border:#1a1c23; --card:#14161d; --card-border:#1f222c;
    --chip:#1c1e27; --chip-border:#2a2d38; --toggle-bg:#23252f; --toggle-knob:#6b7280;
  }
  main { isolation: isolate; position: relative; }
  main.wide { max-width: 1680px; }
  .navbar { position: relative; z-index: 2; }

  [data-el] { --e1:#2a2a33; --e2:#8a8a9a; --e3:#e6e6ee; }
  [data-el="physical"]  { --e1:#2b2a33; --e2:#a5a3b5; --e3:#f1f0f6; }
  [data-el="fire"]      { --e1:#3a0e0a; --e2:#f0592c; --e3:#ffd08a; }
  [data-el="ice"]       { --e1:#0a2236; --e2:#3fa6ea; --e3:#d6f3ff; }
  [data-el="lightning"] { --e1:#2a0c3d; --e2:#b858f2; --e3:#f0d6ff; }
  [data-el="wind"]      { --e1:#082e26; --e2:#2fcfa0; --e3:#d6fff0; }
  [data-el="quantum"]   { --e1:#14104a; --e2:#6657f5; --e3:#d3ceff; }
  [data-el="imaginary"] { --e1:#3b3005; --e2:#eacb30; --e3:#fff5b8; }

  /* fondo a pantalla completa */
  .hsr-bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(90% 70% at 18% 30%, color-mix(in srgb, var(--e2) 38%, transparent), transparent 60%),
      radial-gradient(70% 60% at 85% 100%, color-mix(in srgb, var(--e2) 30%, transparent), transparent 65%),
      linear-gradient(160deg, var(--e1), #07080d 75%);
  }
  /* el arte del personaje, muy difuminado, da el color propio de cada uno */
  .hsr-bg::before {
    content: ""; position: absolute; inset: -8%;
    background: var(--art) 25% 10% / cover no-repeat;
    filter: blur(70px) saturate(1.5);
    opacity: .3;
  }
  /* órbitas y estrellas */
  .hsr-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-radial-gradient(circle at 16% 34%, transparent 0 70px, color-mix(in srgb, var(--e3) 13%, transparent) 70px 71px),
      radial-gradient(circle, var(--e3) 0 1.2px, transparent 1.7px) 8% 12% / 170px 170px,
      radial-gradient(circle, var(--e3) 0 .9px, transparent 1.4px) 60% 70% / 120px 120px,
      radial-gradient(circle, #fff 0 .7px, transparent 1.2px) 35% 45% / 90px 90px;
    -webkit-mask-image: radial-gradient(120% 100% at 16% 34%, #000 20%, transparent 80%);
            mask-image: radial-gradient(120% 100% at 16% 34%, #000 20%, transparent 80%);
    opacity: .7;
  }

  .hsr-grid {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }
  /* paneles más grandes: armas y sets ancho/alto, equipos como columna alta */
  main.wide { max-width: 1840px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }
  .panel { display: flex; flex-direction: column; }
  .panel-main  { min-height: 725px; }
  .panel-teams { min-height: 740px; }
  .panel-body { flex: 1; display: flex; flex-direction: column; }
  .panel-body .shot { flex: none; }
  .panel-body .pending { flex: 1; min-height: 0; }
  .hsr-id h1 { font-size: 38px; line-height: 1.1; margin: 0 0 10px; color: var(--heading); text-shadow: 0 2px 18px color-mix(in srgb, var(--e2) 60%, transparent); }
  .el-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--e3); font-weight: 600; }
  .el-tag::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--e2); box-shadow: 0 0 10px var(--e2);
  }

  .portrait-stage {
    position: relative; overflow: hidden; isolation: isolate;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--e2) 55%, transparent);
    box-shadow: 0 18px 50px -18px var(--e2);
    margin-bottom: 18px;
    background:
      radial-gradient(120% 80% at 50% 108%, color-mix(in srgb, var(--e2) 75%, transparent), transparent 62%),
      radial-gradient(60% 50% at 50% 34%, color-mix(in srgb, var(--e3) 38%, transparent), transparent 70%),
      linear-gradient(165deg, var(--e1), #07080d 92%);
  }
  .portrait-stage::before {
    content: ""; position: absolute; inset: -20%; z-index: 0;
    background: repeating-radial-gradient(circle at 50% 42%, transparent 0 26px, color-mix(in srgb, var(--e3) 22%, transparent) 26px 27px);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
            mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
  }
  .portrait-stage .portrait {
    position: relative; z-index: 1; height: 100%;
    margin: 0; border: 0; border-radius: 0; background: transparent;
  }


  .el-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    width: 38px; height: 38px;
    padding: 5px;
    border-radius: 50%;
    background: rgba(8,9,14,.62);
    border: 1px solid color-mix(in srgb, var(--e2) 70%, transparent);
    box-shadow: 0 0 16px -2px var(--e2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .el-ico { width: 20px; height: 20px; object-fit: contain; }
  .el-tag:has(.el-ico)::before { display: none; }

  .panel {
    border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--e2) 38%, var(--card-border));
    background: linear-gradient(180deg, rgba(14,16,24,.72), rgba(8,9,14,.78));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px -30px #000;
    overflow: hidden;
  }
  .panel h2 {
    margin: 0; padding: 16px 20px 14px;
    font-size: 17px; font-weight: 700; color: var(--heading);
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid color-mix(in srgb, var(--e2) 25%, var(--card-border));
    background: linear-gradient(90deg, color-mix(in srgb, var(--e2) 22%, transparent), transparent 70%);
  }
  .panel h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--e2); box-shadow: 0 0 10px var(--e2); }
  .panel-body { padding: 16px; }
  .panel-body .shot { border: 0; border-radius: 10px; }
  /* build con fondo transparente: el negro de la imagen se funde con el panel */
  .panel-main .panel-body .shot { mix-blend-mode: screen; background: transparent; border-radius: 0; }
  .panel-body .pending {
    display: grid; place-items: center; text-align: center;
    min-height: 260px; padding: 24px;
    border: 1px dashed color-mix(in srgb, var(--e2) 45%, transparent);
    border-radius: 10px; color: var(--muted);
  }

  @media (max-width: 1100px) {
    .hsr-grid { grid-template-columns: 240px minmax(0, 1fr); }
    .hsr-grid .panel:last-child { grid-column: 1 / -1; }
    .panel-main { min-height: 520px; }
    .panel-teams { min-height: 420px; }
  }
  @media (max-width: 800px) {
    .panel-main, .panel-teams { min-height: 320px; }
    .hsr-grid { grid-template-columns: 1fr; }
    .hsr-id { max-width: 280px; }
  }


  /* ============================================================
     FONDOS EXCLUSIVOS POR PERSONAJE (HSR)
     Cada personaje tiene sus colores y composición en CHAR_BG (script)
     ============================================================ */
  .hsr-bg.fx {
    background:
      radial-gradient(60% 55% at var(--p1x) var(--p1y), color-mix(in srgb, var(--b2) 42%, transparent), transparent 66%),
      radial-gradient(45% 50% at var(--p2x) var(--p2y), color-mix(in srgb, var(--b3) 34%, transparent), transparent 68%),
      radial-gradient(40% 35% at var(--p3x) var(--p3y), color-mix(in srgb, var(--b2) 26%, transparent), transparent 70%),
      linear-gradient(var(--ang), var(--b1), color-mix(in srgb, var(--b1) 45%, #05050c) 48%, #05050c);
  }
  .hsr-bg.lay-0 { --p1x:14%; --p1y:38%; --p2x:92%; --p2y:96%; --p3x:70%; --p3y:8%;  --ang:162deg; }
  .hsr-bg.lay-1 { --p1x:86%; --p1y:30%; --p2x:8%;  --p2y:92%; --p3x:40%; --p3y:6%;  --ang:200deg; }
  .hsr-bg.lay-2 { --p1x:50%; --p1y:8%;  --p2x:10%; --p2y:70%; --p3x:92%; --p3y:80%; --ang:180deg; }
  .hsr-bg.lay-3 { --p1x:20%; --p1y:85%; --p2x:88%; --p2y:15%; --p3x:55%; --p3y:55%; --ang:135deg; }
  .hsr-bg.lay-4 { --p1x:80%; --p1y:75%; --p2x:12%; --p2y:18%; --p3x:60%; --p3y:30%; --ang:215deg; }
  .hsr-bg.lay-5 { --p1x:30%; --p1y:20%; --p2x:75%; --p2y:90%; --p3x:95%; --p3y:40%; --ang:150deg; }

  /* ============================================================
     FONDOS EXCLUSIVOS POR PERSONAJE (ZZZ)
     Estilo propio: rayas diagonales, trama de puntos, líneas de
     escaneo y el nombre del personaje gigante de fondo.
     Colores y composición de cada uno en ZZZ_BG (script)
     ============================================================ */
  .hsr-bg.zzz::before { opacity: .38; filter: blur(60px) saturate(1.7); }
  .hsr-bg.zzz::after {
    background:
      radial-gradient(circle, color-mix(in srgb, var(--b3) 38%, transparent) 0 1.3px, transparent 1.8px) 0 0 / 15px 15px,
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
    -webkit-mask-image: linear-gradient(var(--ang), #000 0%, rgba(0,0,0,.35) 45%, transparent 85%);
            mask-image: linear-gradient(var(--ang), #000 0%, rgba(0,0,0,.35) 45%, transparent 85%);
    opacity: .85;
  }
  .zzz-slash {
    position: absolute; left: -10%; right: -10%; height: 150px; top: var(--p1y);
    transform: rotate(-9deg) translateY(-50%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--b2) 24%, transparent) 30%, color-mix(in srgb, var(--b3) 18%, transparent) 70%, transparent);
    border-top: 2px solid color-mix(in srgb, var(--b2) 55%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--b3) 40%, transparent);
    filter: blur(.5px);
  }
  .zzz-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* Fondos de Wuthering Waves */
  .hsr-bg.wuwa::before { opacity: .34; filter: blur(64px) saturate(1.6); }
  .hsr-bg.wuwa::after {
    background: radial-gradient(circle, color-mix(in srgb, var(--b3) 30%, transparent) 0 1px, transparent 1.6px) 0 0 / 24px 24px;
    -webkit-mask-image: linear-gradient(var(--ang), #000 0%, rgba(0,0,0,.3) 45%, transparent 85%);
            mask-image: linear-gradient(var(--ang), #000 0%, rgba(0,0,0,.3) 45%, transparent 85%);
    opacity: .8;
  }
  .wuwa-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  [data-el="wuwa"] .panel { border-top: 2px solid var(--e2); border-radius: 20px 8px 20px 8px; }
  [data-el="wuwa"] .portrait-stage { border-radius: 20px 8px 20px 8px; }
  .zzz-word {
    position: absolute; left: 50%; bottom: -3%;
    transform: translateX(-50%) rotate(-6deg);
    font: 900 clamp(120px, 22vw, 360px)/0.85 Impact, "Arial Black", system-ui, sans-serif;
    letter-spacing: -.02em; text-transform: uppercase; white-space: nowrap;
    color: transparent;
    -webkit-text-stroke: 2px color-mix(in srgb, var(--b2) 34%, transparent);
    opacity: .55; user-select: none; pointer-events: none;
  }
  .hsr-bg.lay-1 .zzz-word, .hsr-bg.lay-4 .zzz-word { left: 42%; bottom: auto; top: 6%; transform: translateX(-50%) rotate(5deg); }
  .hsr-bg.lay-2 .zzz-word { left: 60%; }
  .hsr-bg.lay-3 .zzz-word { left: 38%; bottom: 2%; }
  [data-el="zzz"] .panel {
    border-top: 2px solid var(--e2);
    border-radius: 6px 22px 6px 22px;
  }
  [data-el="zzz"] .portrait-stage { border-radius: 6px 26px 6px 26px; }
  [data-el="zzz"] .panel h2 { text-transform: uppercase; letter-spacing: .06em; font-size: 15px; }
  [data-el="zzz"] .panel h2::before { width: 12px; height: 12px; border-radius: 0; transform: skewX(-20deg); }
  [data-el="zzz"] .panel-body .pending { border-style: solid; border-radius: 6px 16px 6px 16px; }
  @media (max-width: 800px) { .zzz-word { opacity: .35; } }

  /* Icono de Vía (HSR): insignia a la derecha del retrato y etiqueta junto al elemento */
  .path-badge {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    width: 38px; height: 38px; padding: 5px; object-fit: contain;
    border-radius: 50%;
    background: rgba(8,9,14,.62);
    border: 1px solid color-mix(in srgb, var(--e2) 70%, transparent);
    box-shadow: 0 0 16px -2px var(--e2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .hsr-id .el-tag { flex-wrap: wrap; row-gap: 6px; }
  .path-tag { display: inline-flex; align-items: center; gap: 6px; padding-left: 10px; margin-left: 2px; border-left: 1px solid color-mix(in srgb, var(--e2) 45%, transparent); }
  .path-ico { width: 20px; height: 20px; object-fit: contain; }

  /* ===== Equipos: buscador + iconos ===== */
  .team-search {
    flex: 1; min-width: 0; margin-left: 6px; padding: 7px 10px;
    font: inherit; font-size: 13px; font-weight: 500; color: var(--text);
    background: rgba(8,9,14,.6);
    border: 1px solid color-mix(in srgb, var(--e2) 45%, transparent);
    border-radius: 8px;
  }
  .team-search::placeholder { color: var(--muted); font-weight: 400; }
  .team-search:focus-visible { outline: 2px solid var(--e2); outline-offset: 1px; }
  .team-hint { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .team-picker {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px;
    max-height: 210px; overflow: auto; padding: 8px; margin-bottom: 14px;
    border: 1px dashed color-mix(in srgb, var(--e2) 45%, transparent); border-radius: 10px;
  }
  .pick {
    padding: 0; border: 1px solid var(--chip-border); border-radius: 8px; overflow: hidden;
    background: var(--chip); cursor: pointer; aspect-ratio: 1;
    transition: transform .12s, border-color .12s;
  }
  .pick img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .pick:hover { transform: translateY(-2px); border-color: var(--e2); }
  .pick.used { opacity: .35; }
  .pick-empty { grid-column: 1 / -1; margin: 6px; color: var(--muted); font-size: 13px; text-align: center; }

  .team-card {
    padding: 10px; margin-bottom: 12px; border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--e2) 25%, var(--card-border));
    background: rgba(8,9,14,.35);
  }
  .team-card.edit { cursor: pointer; }
  .team-card.edit.active { border-color: var(--e2); box-shadow: 0 0 14px -4px var(--e2); }
  .team-title { font-size: 13px; font-weight: 700; color: var(--e3); margin: 0 0 8px; letter-spacing: .02em; }
  .team-bar { display: flex; gap: 6px; margin-bottom: 8px; }
  .team-name {

    position: absolute; top: -6px; right: -6px; z-index: 1; width: 20px; height: 20px; padding: 0;

  const SRR = 'https://cdn.jsdelivr.net/gh/Mar-7th/StarRailRes@master/';

  };
  let wwP = null;
  function loadWuwa() {

      basic: true,

  let zzP = null;

    const nm = x => { const v = x && (x.en || x.zh || x.name); return typeof v === 'string' ? v : (v && v.name) || ''; };
    const lst = o => Object.entries(o || {}).map(([i, x]) => ({ i: String(i), n: nm(x), c: bare(x && x.icon) })).filter(x => x.n);
    const viaApi = () => fetch('/api/zzz-catalog').then(r => r.ok ? r.json() : Promise.reject());
    const direct = () => fetch(NK + '/manifest.json').then(r => r.json()).then(m => {
      const v = m.zzz.live;
      return Promise.all(['weapon', 'equipment'].map(f => fetch(NK + '/zzz/' + v + '/' + f + '.json').then(r => r.ok ? r.json() : Promise.reject())));
    }).then(([w, e]) => ({ cones: lst(w), sets: lst(e) }));
    zzP = viaApi().catch(direct)
      .then(c => (c && c.cones && c.cones.length && c.sets && c.sets.length) ? c : Promise.reject())

  }

    const flat = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();

    const fld = (f, ph, v) => EDIT ? `<input class="bd-in" data-f="${f}" maxlength="160" placeholder="${ph}" value="${esc(v || '')}">` : esc(v || '');

    const TAL_SVG = {
      ultimate: '<svg viewBox="0 0 24 24"><polygon points="12,1 14.5,9.5 23,12 14.5,14.5 12,23 9.5,14.5 1,12 9.5,9.5" fill="currentColor"/></svg>',
      skill: '<svg viewBox="0 0 24 24"><polygon points="13,1 4,14 11,14 9,23 20,9 13,9" fill="currentColor"/></svg>',
      talent: '<svg viewBox="0 0 24 24"><polygon points="12,2 14.9,8.5 22,9.3 16.8,14 18.2,21 12,17.3 5.8,21 7.2,14 2,9.3 9.1,8.5" fill="currentColor"/></svg>',
      basic: '<svg viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><rect x="11" y="2" width="2" height="14" rx="0.6" fill="currentColor"/><rect x="7.5" y="14" width="9" height="2.2" rx="0.6" fill="currentColor"/><rect x="11" y="16.2" width="2" height="5.8" rx="0.6" fill="currentColor"/></g></svg>',

    const talentKey = label => {
      const f = flat(label);
      if (f.includes('ultimate') || f.includes('definitiva')) return 'ultimate';

    const ZZZ_SVG_FALLBACK = { basic: 'basic', dodge: 'tech', assist: 'tech', chain: 'ultimate', special: 'skill', core: 'talent' };
    const zzzKey = label => {

    const SKILL_TYPE_SUFFIX = { basic: 'Normal', skill: 'BP', ultimate: 'Ultra', talent: 'Passive', tech: 'Maze' };
    // Alias para slugs cuyo nombre en esta web no coincide literal con el nombre oficial del juego

    const HSR_NAME_ALIAS = {
      'imbibitor-lunae': 'Dan Heng Imbibitor Lunae'

    // IDs manuales (para cuando el nombre no coincide solo): 'slug-de-tu-web': 1308
    // Himeko Nova = 1510 (la original Himeko es 1003: antes se usaban sus iconos por error).
    // IMPORTANTE: ya NO se usa el personaje base como reemplazo de las variantes; si no hay ID
    // correcto, se muestran los iconos genericos en vez de los de otro personaje.
    const HSR_ID_OVERRIDE = { 'acheron': 1308, 'himeko-nova': 1510, 'march-7th-swordmaster': 1224, 'imbibitor-lunae': 1213 };
    function findCharId(displayName) {
      if (HSR_ID_OVERRIDE[slug]) return Promise.resolve(String(HSR_ID_OVERRIDE[slug]));
      if (!displayName) return Promise.resolve(null);
      return loadHsrChars().then(chars => {
        const target = flat(HSR_NAME_ALIAS[slug] || displayName);
        const list = chars.filter(x => x && x.name);
        const c = list.find(x => flat(x.name) === target);
        if (!c) console.warn('[Talentos] Sin ID para "' + slug + '" (' + displayName + '). Agregalo en HSR_ID_OVERRIDE.');

    function upgradeTalentIcons() {
      if (Z || W || EDIT || !b.talents) return;
      const row = body.querySelector('.bd-tal-row');
      if (!row) return;
      const entry = (GAMES.hsr.chars || []).find(c => c[0] === slug);
      const dispName = entry && entry[1];
      if (!dispName) return;
      findCharId(dispName).then(id => {
        if (!id || token !== buildToken) return;
        const liveRow = body.querySelector('.bd-tal-row');
        if (!liveRow) return;
        liveRow.querySelectorAll('.bd-tal-chip[data-tk]').forEach(chip => {
          const suf = SKILL_TYPE_SUFFIX[chip.dataset.tk];

          img.onload = () => { ic.innerHTML = ''; ic.appendChild(img); ic.classList.add('bd-tal-ic-real'); };

      try { localStorage.setItem(lk, JSON.stringify(b)); } catch (e) {}
      clearTimeout(timer); timer = setTimeout(() => doSave(false), 800);

    fetch(api).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
      const sv = fix(d);

    }).catch(() => {});
    if (!EDIT) return;

    body.addEventListener('input', e => {

    body.addEventListener('error', e => {
      const im = e.target;
      if (im.tagName === 'IMG' && im.dataset.card && !im.dataset.f) { im.dataset.f = 1; im.src = im.dataset.card; }
    }, true);

    const clean = list => (Array.isArray(list) ? list : []).slice(0, MAX_TEAMS).map(t => ({
      n: t && typeof t.n === 'string' ? t.n.slice(0, 40) : '',
      m: (t && Array.isArray(t.m) ? t.m : []).filter(s => names[s]).slice(0, MAX_TEAM)
    }));

    /* ---------- vista para visitantes ---------- */
    function renderView() {
      const list = teams.filter(t => t.m.length);
      body.innerHTML = list.map((t, i) => `
        <div class="team-card">
          ${(t.n || list.length > 1) ? `<div class="team-title">${esc(t.n || 'Equipo ' + (i + 1))}</div>` : ''}
          <div class="team-row">${t.m.map(s => `
            <a class="tm${s === slug ? ' me' : ''}" href="#${encodeURIComponent(s)}" title="${esc(names[s])}">${iconHtml(game, s, names[s])}<small>${esc(names[s])}</small></a>`).join('')}
          </div>
        </div>`).join('');
    }

    /* ---------- modo editor ---------- */
    function payload() {
      return { teams: teams.filter(t => t.m.length).map(t => ({ n: t.n.trim(), m: t.m })) };
    }
    function doSave(retry) {
      const key = getKey(retry);
      if (!key) { toast('Sin clave: no se guardó'); return; }
      fetch(TEAMS_API(slug), {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload())
      }).then(r => {
        if (r.status === 401) {
          localStorage.removeItem(KEYSTORE);
          if (!retry) return doSave(true);
          toast('Clave incorrecta'); return;
        }
        toast(r.ok ? 'Guardado para todos ✓' : 'Error al guardar (' + r.status + ')');
      }).catch(() => toast('Error de red'));
    }
    function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => doSave(false), 400); }

    function renderPicker() {
      const search = document.getElementById('team-search');
      const q = norm(search ? search.value : '');
      const act = teams[active];
      const list = GAMES[game].chars.filter(c => !q || norm(c[1]).includes(q) || norm(c[0]).includes(q));
      document.getElementById('tp').innerHTML = list.length
        ? list.map(([s, n]) => `<button type="button" class="pick${act && act.m.includes(s) ? ' used' : ''}" data-s="${esc(s)}" title="${esc(n)}">${iconHtml(game, s, n)}</button>`).join('')
        : '<p class="pick-empty">Sin resultados.</p>';
    }
    function renderTeamsEdit() {
      document.getElementById('te').innerHTML = teams.map((t, i) => `
        <div class="team-card edit${i === active ? ' active' : ''}" data-i="${i}">
          <div class="team-bar">
            <input class="team-name" data-i="${i}" value="${esc(t.n)}" maxlength="40" placeholder="Equipo ${i + 1}" aria-label="Nombre del equipo ${i + 1}">
            <button type="button" class="team-del" data-del="${i}" title="Borrar equipo">🗑</button>
          </div>
          <div class="team-row">${t.m.map((s, j) => `
            <span class="tm"><button type="button" class="tm-x" data-rm="${i}:${j}" title="Quitar">✕</button>${iconHtml(game, s, names[s])}<small>${esc(names[s])}</small></span>`).join('')}
            ${Array.from({ length: MAX_TEAM - t.m.length }, () => '<span class="tm empty"></span>').join('')}
          </div>
        </div>`).join('') + (teams.length < MAX_TEAMS ? '<button type="button" class="team-add" id="team-add">+ Nuevo equipo</button>' : '');
    }
    function addMember(s) {
      if (!teams.length) { teams.push({ n: '', m: [] }); active = 0; }
      const t = teams[active];
      if (t.m.includes(s)) { toast('Ya está en el equipo'); return; }
      if (t.m.length >= MAX_TEAM) { toast('Equipo completo (máx. ' + MAX_TEAM + ')'); return; }
      t.m.push(s);
      renderTeamsEdit(); renderPicker(); save();
    }

    function startEdit() {
      body.innerHTML = '<p class="team-hint">Modo editor: elige un equipo y pulsa los iconos para añadirlos. Se publica para todos.</p><div class="team-picker" id="tp"></div><div id="te"></div>';
      if (!teams.length) teams.push({ n: '', m: [] });
      renderTeamsEdit(); renderPicker();
      document.getElementById('team-search').addEventListener('input', renderPicker);

      document.getElementById('tp').addEventListener('click', e => {
        const b = e.target.closest('.pick'); if (b) addMember(b.dataset.s);
      });
      const te = document.getElementById('te');
      te.addEventListener('input', e => {
        if (e.target.classList.contains('team-name')) { teams[+e.target.dataset.i].n = e.target.value; save(); }
      });
      te.addEventListener('click', e => {
        const rm = e.target.closest('[data-rm]');
        if (rm) {
          const [i, j] = rm.dataset.rm.split(':').map(Number);
          teams[i].m.splice(j, 1); active = i;
          renderTeamsEdit(); renderPicker(); save(); return;
        }
        const del = e.target.closest('[data-del]');
        if (del) {
          const i = +del.dataset.del;
          if (teams[i].m.length && !confirm('¿Borrar este equipo?')) return;
          teams.splice(i, 1);
          if (!teams.length) teams.push({ n: '', m: [] });
          active = Math.min(active, teams.length - 1);
          renderTeamsEdit(); renderPicker(); save(); return;
        }
        if (e.target.closest('#team-add')) {
          teams.push({ n: '', m: [] }); active = teams.length - 1;
          renderTeamsEdit(); renderPicker(); return;
        }
        const card = e.target.closest('.team-card');
        if (card && +card.dataset.i !== active) {
          active = +card.dataset.i;
          te.querySelectorAll('.team-card').forEach(c => c.classList.toggle('active', +c.dataset.i === active));
          renderPicker();
        }
      });
    }

    /* ---------- carga ---------- */
    fetch(TEAMS_API(slug), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(d => {
        if (token !== teamsToken || !document.body.contains(body)) return;
        teams = d ? clean(d.teams) : [];
        if (EDIT) startEdit();
        else if (teams.some(t => t.m.length)) renderView();   // si no hay, queda la captura antigua o "Equipos pendientes."
      });
  }

  /* ============================================================ */
  const $ = id => document.getElementById(id);
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

  let currentGame = 'zzz';

  function findChar(slug) {
    for (const key in GAMES) {
      const c = GAMES[key].chars.find(x => x[0] === slug);
      if (c) return { game: key, char: c };
    }
    return null;
  }

  function img(gameKey, slug) {
    const g = GAMES[gameKey];
    const file = (g.files && g.files[slug]) || (slug + g.suffix);
    return './' + encodeURI(file);
  }

  function renderTabs() {
    $('game-tabs').innerHTML = Object.keys(GAMES).map(key => `
      <button class="game-tab" role="tab" aria-selected="${key === currentGame}" data-game="${key}">${GAMES[key].label}</button>
    `).join('');
    $('game-tabs').querySelectorAll('.game-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentGame = btn.dataset.game;
        renderTabs();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const q = norm($('search').value);
    const list = GAMES[currentGame].chars
      .filter(c => norm(c[1]).includes(q) || norm(c[0]).includes(q))
      .map(([slug, name, role]) => `
        <a class="card" href="#${slug}">
          <img src="${img(currentGame, slug)}" alt="${name}" loading="lazy">
          <span>${name}${role ? `<small>${role}</small>` : ''}${zzzMini(currentGame, slug)}${hsrMini(currentGame, slug)}${wuwaMini(currentGame, slug)}</span>
        </a>`).join('');
    $('grid').innerHTML = list;
    $('empty').hidden = list !== '';
  }

  const pendingImg = text => "this.replaceWith(Object.assign(document.createElement('p'),{className:'pending',textContent:'" + text + "'}))";

  function renderDetail(slug) {
    const found = findChar(slug);
    if (!found) return false;
    const { game, char: c } = found;
    const el = elOf(game, slug);
    const isZzz = game === 'zzz';
    const isWw = game === 'wuwa';
    const wb = isWw ? wuwaBg(slug) : null;
    const pa = pathOf(game, slug);
    const zi = isZzz ? (ZZZ_INFO[slug] || null) : null;
    const zTag = zi ? `<img class="el-ico" src="${zzzElIcon(zi[0])}" alt="" onerror="this.remove()">${zzzElName(slug)}${c[2] ? ' · ' + c[2] : ''}<span class="path-tag"><img class="path-ico" src="${zzzSpecIcon(zi[1])}" alt="" onerror="this.remove()">${ZZZ_SPEC_LABEL[zi[1]]}</span>` : '';
    const bg = isZzz ? ZZZ_BG[slug] : isWw ? wb.bg : CHAR_BG[slug];

    if (el || ((isZzz || isWw) && bg)) {
      $('detail').innerHTML = `
        <div data-el="${el || (isWw ? 'wuwa' : 'zzz')}"${bg ? ` style="--e1:${bg[0]};--e2:${bg[1]};--e3:color-mix(in srgb, ${bg[1]} 45%, #fff)"` : ''}>
          <div class="hsr-bg${isZzz ? ' zzz' : ''}${isWw ? ' wuwa' : ''}${bg ? ' fx lay-' + bg[3] : ''}" style="${bg ? `--b1:${bg[0]};--b2:${bg[1]};--b3:${bg[2]};` : ''}--art:url('${img(game, slug)}')">${isZzz ? `${zzzFx(slug, bg)}<span class="zzz-word">${c[1]}</span>` : isWw ? wuwaFx(slug, bg, wb.el) : ''}</div>
          <a class="back" href="#">← Todos los personajes</a>
          <div class="hsr-grid">
            <aside class="hsr-id">
              <div class="portrait-stage">
                <img class="portrait" src="${img(game, slug)}" alt="${c[1]}">
                ${el ? `<img class="el-badge" src="${elIcon(el)}" alt="${EL_LABEL[el]}" onerror="this.remove()">` : isWw ? `<img class="el-badge" src="./element_${wb.el}.webp" alt="${WUWA_LABEL[wb.el]}" title="${WUWA_LABEL[wb.el]}" onerror="this.remove()">` : zi ? `<img class="el-badge" src="${zzzElIcon(zi[0])}" alt="${zzzElName(slug)}" title="${zzzElName(slug)}" onerror="this.remove()">` : ''}${pa ? `<img class="path-badge" src="${pathIcon(pa)}" alt="${PATH_LABEL[pa]}" title="${PATH_LABEL[pa]}" onerror="this.remove()">` : zi ? `<img class="path-badge" src="${zzzSpecIcon(zi[1])}" alt="${ZZZ_SPEC_LABEL[zi[1]]}" title="${ZZZ_SPEC_LABEL[zi[1]]}" onerror="this.remove()">` : ''}
              </div>
              <h1>${c[1]}</h1>
              <span class="el-tag">${el ? `<img class="el-ico" src="${elIcon(el)}" alt="" onerror="this.remove()">${EL_LABEL[el]}${c[2] ? ' · ' + c[2] : ''}` : zi ? zTag : (c[2] || (isWw ? `<img class="el-ico" src="./element_${wb.el}.webp" alt="" onerror="this.remove()">${WUWA_LABEL[wb.el]}` : ''))}${pa ? `<span class="path-tag"><img class="path-ico" src="${pathIcon(pa)}" alt="" onerror="this.remove()">${PATH_LABEL[pa]}</span>` : ''}</span>
              <div class="dupes" id="dupes" hidden>
                <h3>Dupes recomendados</h3>
                ${EDIT ? '<textarea id="dupes-edit" class="dupes-edit" maxlength="600" placeholder="Escribe aquí los dupes recomendados..."></textarea><p class="dupes-hint">Se guarda solo al escribir.</p>' : '<p class="dupes-view" id="dupes-view"></p>'}
              </div>
            </aside>
            <section class="panel panel-main">
              <h2>Armas y sets</h2>
              <div class="panel-body" id="build-body">
                <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}" onerror="${buildErr(slug)}">
              </div>
            </section>
            <section class="panel panel-teams">
              <h2>Equipos${EDIT ? '<input type="search" id="team-search" class="team-search" placeholder="Buscar personaje..." autocomplete="off" aria-label="Buscar personaje para el equipo">' : ''}</h2>
              <div class="panel-body" id="teams-body">
                <img class="shot" src="${teamsImg(slug)}" alt="Equipos de ${c[1]}" onerror="${pendingImg('Equipos pendientes.')}">
              </div>
            </section>
          </div>
        </div>`;
      return true;
    }

    $('detail').innerHTML = `
      <a class="back" href="#">← Todos los personajes</a>
      <div class="detail">
        <div>
          <img class="portrait" src="${img(game, slug)}" alt="${c[1]}">
          <h1>${c[1]}</h1>
          <p class="sub">${c[2]}</p>
        </div>
        <div>
          <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}" onerror="${buildErr(slug)}">
        </div>
      </div>`;
    return true;
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const showDetail = slug && renderDetail(slug);
    if (showDetail) {
      // al volver a la galería, queda en la pestaña del juego del personaje
      const f = findChar(slug);
      if (f && f.game !== currentGame) { currentGame = f.game; renderTabs(); renderGrid(); }
    }
    const f2 = showDetail && findChar(slug);
    const isHsr = !!(f2 && (elOf(f2.game, slug) || (f2.game === 'zzz' && ZZZ_BG[slug]) || f2.game === 'wuwa'));
    if (f2 && $('teams-body')) initTeams(slug, f2.game);
    if (f2 && $('dupes')) initDupes(slug, f2.game);
    if (f2 && $('build-body') && (f2.game === 'hsr' || f2.game === 'zzz' || f2.game === 'wuwa')) initBuild(slug, f2.game);
    document.body.classList.toggle('hsr-open', isHsr);
    document.querySelector('main').classList.toggle('wide', isHsr);
    $('detail').hidden = !showDetail;
    $('gallery').hidden = !!showDetail;
    window.scrollTo(0, 0);
  }

  $('search').addEventListener('input', renderGrid);

  window.addEventListener('hashchange', route);
  renderTabs();
  renderGrid();
  route();

</script>
</body>
</html>
