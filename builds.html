<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds — ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #f3f4f6;
    --border: #1a1c23;
    --card: #14161d;
    --card-border: #1f222c;
    --chip: #1c1e27;
    --chip-border: #2a2d38;
    --accent: #818cf8;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --muted: #5b5f6d;
    --heading: #1a1c23;
    --border: #e4e4ea;
    --card: #ffffff;
    --card-border: #e4e4ea;
    --chip: #ffffff;
    --chip-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-right a { color: var(--muted); text-decoration: none; font-size: 14px; }
  .nav-right a.active { color: var(--accent); }

  .toggle {
    width: 36px; height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left .2s ease;
  }
  body.light .toggle::after { left: 18px; }
  .social-icons { display: flex; align-items: center; gap: 14px; }
  .icon-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    opacity: .85;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity .15s ease, transform .15s ease;
  }
  .icon-circle:hover { opacity: 1; transform: translateY(-1px); }

  main { max-width: 1200px; padding: 80px 40px 80px; }
  h1 { margin: 0 0 6px; font-size: 32px; color: var(--heading); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  /* Título igual al del inicio */
  h1.hero-title { font-size: 48px; font-weight: 800; line-height: 1.1; margin: 0; }
  h1.hero-title.accent { color: var(--accent); }
  h1.hero-title.white { color: var(--heading); }
  .hero-sub { color: var(--muted); font-size: 17px; max-width: 480px; margin: 20px 0 28px; line-height: 1.5; }

  /* ===== Pestañas de juego ===== */
  .game-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .game-tab {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .game-tab:hover { color: var(--text); }
  .game-tab[aria-selected="true"] {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ===== Buscador ===== */
  .search {
    width: 100%;
    max-width: 420px;
    margin-bottom: 28px;
    padding: 11px 16px;
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, .card:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  /* ===== Galería ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card > img[data-pend] { opacity: 0; }
  .card > img { transition: opacity .25s ease; }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    background: var(--chip);
  }
  .card span {
    display: block;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    border-top: 1px solid var(--card-border);
  }
  .card small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  /* ZZZ: iconos de elemento y especialidad en la card */
  .card .mini { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-style: normal; }
  .card .mini img { display: inline-block; width: 20px; height: 20px; aspect-ratio: auto; object-fit: contain; background: none; }

  /* ===== Detalle ===== */
  .back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    align-items: start;
  }
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    margin-bottom: 16px;
  }
  .shot {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .pending { color: var(--muted); font-size: 15px; margin: 0; }


  /* ============================================================
     HSR: página de personaje (retrato | armas y sets | equipos)
     ============================================================ */
  body.hsr-open {
    --bg:#0b0c10; --text:#e5e7eb; --muted:#a3a8b6; --heading:#f3f4f6;
    --border:#1a1c23; --card:#14161d; --card-border:#1f222c;
    --chip:#1c1e27; --chip-border:#2a2d38; --toggle-bg:#23252f; --toggle-knob:#6b7280;
  }
  main { isolation: isolate; position: relative; }
  main.wide { max-width: 1680px; }
  .navbar { position: relative; z-index: 2; }

  [data-el] { --e1:#2a2a33; --e2:#8a8a9a; --e3:#e6e6ee; }
  [data-el="physical"]  { --e1:#2b2a33; --e2:#a5a3b5; --e3:#f1f0f6; }
  [data-el="fire"]      { --e1:#3a0e0a; --e2:#f0592c; --e3:#ffd08a; }
  [data-el="ice"]       { --e1:#0a2236; --e2:#3fa6ea; --e3:#d6f3ff; }
  [data-el="lightning"] { --e1:#2a0c3d; --e2:#b858f2; --e3:#f0d6ff; }
  [data-el="wind"]      { --e1:#082e26; --e2:#2fcfa0; --e3:#d6fff0; }
  [data-el="quantum"]   { --e1:#14104a; --e2:#6657f5; --e3:#d3ceff; }
  [data-el="imaginary"] { --e1:#3b3005; --e2:#eacb30; --e3:#fff5b8; }

  /* fondo a pantalla completa */
  .hsr-bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(90% 70% at 18% 30%, color-mix(in srgb, var(--e2) 38%, transparent), transparent 60%),
      radial-gradient(70% 60% at 85% 100%, color-mix(in srgb, var(--e2) 30%, transparent), transparent 65%),
      linear-gradient(160deg, var(--e1), #07080d 75%);
  }
  /* el arte del personaje, muy difuminado, da el color propio de cada uno */
  .hsr-bg::before {
    content: ""; position: absolute; inset: -8%;
    background: var(--art) 25% 10% / cover no-repeat;
    filter: blur(70px) saturate(1.5);
    opacity: .3;
  }
  /* órbitas y estrellas */
  .hsr-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-radial-gradient(circle at 16% 34%, transparent 0 70px, color-mix(in srgb, var(--e3) 13%, transparent) 70px 71px),
      radial-gradient(circle, var(--e3) 0 1.2px, transparent 1.7px) 8% 12% / 170px 170px,
      radial-gradient(circle, var(--e3) 0 .9px, transparent 1.4px) 60% 70% / 120px 120px,
      radial-gradient(circle, #fff 0 .7px, transparent 1.2px) 35% 45% / 90px 90px;
    -webkit-mask-image: radial-gradient(120% 100% at 16% 34%, #000 20%, transparent 80%);
            mask-image: radial-gradient(120% 100% at 16% 34%, #000 20%, transparent 80%);
    opacity: .7;
  }

  .hsr-grid {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }
  /* paneles más grandes: armas y sets ancho/alto, equipos como columna alta */
  main.wide { max-width: 1840px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }
  .panel { display: flex; flex-direction: column; }
  .panel-main  { min-height: 725px; }
  .panel-teams { min-height: 740px; }
  .panel-body { flex: 1; display: flex; flex-direction: column; }
  .panel-body .shot { flex: none; }
  .panel-body .pending { flex: 1; min-height: 0; }
  .hsr-id h1 { font-size: 38px; line-height: 1.1; margin: 0 0 10px; color: var(--heading); text-shadow: 0 2px 18px color-mix(in srgb, var(--e2) 60%, transparent); }
  .el-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--e3); font-weight: 600; }
  .el-tag::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--e2); box-shadow: 0 0 10px var(--e2);
  }

  .portrait-stage {
    position: relative; overflow: hidden; isolation: isolate;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--e2) 55%, transparent);
    box-shadow: 0 18px 50px -18px var(--e2);
    margin-bottom: 18px;
    background:
      radial-gradient(120% 80% at 50% 108%, color-mix(in srgb, var(--e2) 75%, transparent), transparent 62%),
      radial-gradient(60% 50% at 50% 34%, color-mix(in srgb, var(--e3) 38%, transparent), transparent 70%),
      linear-gradient(165deg, var(--e1), #07080d 92%);
  }
  .portrait-stage::before {
    content: ""; position: absolute; inset: -20%; z-index: 0;
    background: repeating-radial-gradient(circle at 50% 42%, transparent 0 26px, color-mix(in srgb, var(--e3) 22%, transparent) 26px 27px);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
            mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 62%);
  }
  .portrait-stage .portrait {
    position: relative; z-index: 1; height: 100%;
    margin: 0; border: 0; border-radius: 0; background: transparent;
  }
  /* Muestra la imagen del personaje completa (hasta las piernas), sin recortarla a un cuadrado */
  .portrait-stage { aspect-ratio: auto; }
  .portrait-stage .portrait { display: block; height: auto; aspect-ratio: auto; object-fit: contain; }
  /* WuWa: imagen libre (sin cuadro), alta, de arriba a abajo del bloque de paneles */
  :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free { position: relative; }
  :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage { background: none; border: 0; box-shadow: none; border-radius: 0; overflow: visible; isolation: auto; margin: 0 0 14px; }
  :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage::before { display: none; }
  :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage .portrait { width: 100%; height: auto; filter: drop-shadow(0 10px 26px rgba(0,0,0,.55)); }
  :is(div[data-el="wuwa"], div[data-el="zzz"]) .hsr-grid .panel { position: relative; z-index: 1; }
  @media (min-width: 1101px) {
    :is(div[data-el="wuwa"], div[data-el="zzz"]) .hsr-grid:has(> aside.free) { grid-template-columns: 280px minmax(0, 1fr) 340px; }
    /* la columna ocupa todo el alto y llega hasta el borde izquierdo de la pantalla */
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free { align-self: stretch; display: flex; flex-direction: column; margin-left: calc(-1 * (max(0px, (100vw - 1840px) / 2) + 28px)); }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage { flex: 1; min-height: 560px; margin: 0; position: relative; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage .portrait { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: contain; object-position: center bottom; }
    /* el nombre va abajo a la izquierda, sobre la imagen */
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free h1 { position: absolute; left: 28px; bottom: 96px; margin: 0; z-index: 3; font-size: 34px; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .el-tag { position: absolute; left: 28px; bottom: 64px; z-index: 3; }
  }
  @media (min-width: 1500px) {
    :is(div[data-el="wuwa"], div[data-el="zzz"]) .hsr-grid:has(> aside.free) { grid-template-columns: clamp(300px, 20vw, 400px) minmax(0, 1fr) 340px; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage .portrait { object-fit: cover; object-position: center top; }
  }
  /* la imagen espera a estar recortada y centrada antes de mostrarse (evita el salto al recargar) */
  :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage .portrait { opacity: 0; transition: opacity .25s ease; }
  :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage .portrait.ready { opacity: 1; }
  /* posición personalizada (guardada con ?edit): la imagen se ve entera y se mueve/escala con transform */
  @media (min-width: 1101px) {
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.custom .portrait-stage img.portrait { object-fit: contain !important; object-position: center center !important; transform: translate(var(--tx, 0%), var(--ty, 0%)) scale(var(--ts, 1)); transform-origin: center center; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage.art-edit { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free .portrait-stage.art-edit.dragging { cursor: grabbing; }
    .art-bar { position: absolute; top: 10px; right: 10px; z-index: 6; max-width: calc(100% - 64px); display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 999px; font-size: 11px; line-height: 1.3; color: #fff; background: rgba(8,9,14,.78); border: 1px solid var(--e2); cursor: default; }
    .art-bar button { flex: none; border: 0; border-radius: 999px; padding: 5px 10px; font: inherit; font-weight: 600; color: #fff; background: var(--e2); cursor: pointer; }
  }
  @media (max-width: 1100px) { .art-bar { display: none; } }
  /* WuWa (escritorio): el botón "← Todos los personajes" sube junto a la barra superior, sin mover el resto del diseño */
  @media (min-width: 1101px) { :is(div[data-el="wuwa"], div[data-el="zzz"]) > a.back { position: relative; top: -70px; z-index: 5; } }
  /* panel de build: oculto hasta que todo esté cargado, luego aparece con un fundido */
  #build-body { transition: opacity .35s ease; }
  #build-body.bd-hold { opacity: 0; }
  /* ZZZ: mantener siempre visible el retrato Portrait.webp completo, de cabeza a pies */
  @media (min-width: 1101px) {
    :is(div[data-el="zzz"]) aside.hsr-id.zzz-fullbody:not(.trimmed) .portrait-stage .portrait {
      object-fit: contain !important;
      object-position: center bottom !important;
    }
    :is(div[data-el="zzz"]) aside.hsr-id.zzz-fullbody h1 {
      top: auto;
      bottom: 96px;
    }
    :is(div[data-el="zzz"]) aside.hsr-id.zzz-fullbody .el-tag {
      top: auto;
      bottom: 64px;
    }
  }

  /* Rover (dos figuras): se ve entero y el nombre va arriba */
  @media (min-width: 1101px) {
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.wide-art.rover-art .portrait-stage .portrait { object-fit: contain; object-position: center bottom; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.wide-art.rover-art h1 { top: 24px; bottom: auto; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.wide-art.rover-art .el-tag { top: 74px; bottom: auto; }
  }
  /* card3 recortada: el personaje llena la columna de arriba a abajo, centrado, como Augusta */
  @media (min-width: 1101px) {
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.trimmed .portrait-stage .portrait { object-fit: cover; object-position: var(--fx, 50%) top; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.trimmed h1 { top: auto; bottom: 96px; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.trimmed .el-tag { top: auto; bottom: 64px; }
  }
  /* Resto de cards3 anchas (p. ej. Jiyan): figura entera, centrada en la columna y nombre abajo como en las altas */
  @media (min-width: 1101px) {
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.wide-art:not(.rover-art) .portrait-stage .portrait { object-fit: contain; object-position: center center; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.wide-art:not(.rover-art) h1 { top: auto; bottom: 96px; }
    :is(div[data-el="wuwa"], div[data-el="zzz"]) aside.hsr-id.free.wide-art:not(.rover-art) .el-tag { top: auto; bottom: 64px; }
  }


  .el-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    width: 38px; height: 38px;
    padding: 5px;
    border-radius: 50%;
    background: rgba(8,9,14,.62);
    border: 1px solid color-mix(in srgb, var(--e2) 70%, transparent);
    box-shadow: 0 0 16px -2px var(--e2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .el-ico { width: 20px; height: 20px; object-fit: contain; }
  .el-tag:has(.el-ico)::before { display: none; }

  .panel {
    border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--e2) 38%, var(--card-border));
    background: linear-gradient(180deg, rgba(14,16,24,.72), rgba(8,9,14,.78));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px -30px #000;
    overflow: hidden;
  }
  .panel h2 {
    margin: 0; padding: 16px 20px 14px;
    font-size: 17px; font-weight: 700; color: var(--heading);
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid color-mix(in srgb, var(--e2) 25%, var(--card-border));
    background: linear-gradient(90deg, color-mix(in srgb, var(--e2) 22%, transparent), transparent 70%);
  }
  .panel h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--e2); box-shadow: 0 0 10px var(--e2); }
  .panel-body { padding: 16px; }
  .panel-body .shot { border: 0; border-radius: 10px; }
  /* build con fondo transparente: el negro de la imagen se funde con el panel */
  .panel-main .panel-body .shot { mix-blend-mode: screen; background: transparent; border-radius: 0; }
  .panel-body .pending {
    display: grid; place-items: center; text-align: center;
    min-height: 260px; padding: 24px;
    border: 1px dashed color-mix(in srgb, var(--e2) 45%, transparent);
    border-radius: 10px; color: var(--muted);
  }

  @media (max-width: 1100px) {
    .hsr-grid { grid-template-columns: 240px minmax(0, 1fr); }
    .hsr-grid .panel:last-child { grid-column: 1 / -1; }
    .panel-main { min-height: 520px; }
    .panel-teams { min-height: 420px; }
  }
  @media (max-width: 800px) {
    .panel-main, .panel-teams { min-height: 320px; }
    .hsr-grid { grid-template-columns: 1fr; }
    .hsr-id { max-width: 280px; }
  }


  /* ============================================================
     FONDOS EXCLUSIVOS POR PERSONAJE (HSR)
     Cada personaje tiene sus colores y composición en CHAR_BG (script)
     ============================================================ */
  .hsr-bg.fx {
    background:
      radial-gradient(60% 55% at var(--p1x) var(--p1y), color-mix(in srgb, var(--b2) 42%, transparent), transparent 66%),
      radial-gradient(45% 50% at var(--p2x) var(--p2y), color-mix(in srgb, var(--b3) 34%, transparent), transparent 68%),
      radial-gradient(40% 35% at var(--p3x) var(--p3y), color-mix(in srgb, var(--b2) 26%, transparent), transparent 70%),
      linear-gradient(var(--ang), var(--b1), color-mix(in srgb, var(--b1) 45%, #05050c) 48%, #05050c);
  }

  /* ============================================================
     POSICIÓN DE LA IMAGEN (WuWa): con ?edit se arrastra / hace zoom y se guarda para todos.
     Se guarda como texto "x,y,zoom" en /api/dupes?g=wuwa&c=<slug>-pos (mismo sistema y clave que los dupes);
     si el servidor no lo acepta, queda solo en este navegador.
     ============================================================ */
  const ART_API = (slug, game = 'wuwa') => '/api/dupes?g=' + encodeURIComponent(game) + '&c=' + encodeURIComponent(slug + '-pos');
  const artLocal = (slug, game = 'wuwa') => 'artpos:' + game + ':' + slug;
  const artParse = t => { const a = String(t || '').split(',').map(Number); return a.length === 3 && a.every(Number.isFinite) && a[2] > 0 ? { x: a[0], y: a[1], s: a[2] } : null; };
  const artFmt = p => [p.x, p.y, p.s].map(v => Math.round(v * 100) / 100).join(',');
  window.getArtPos = function (slug, game = 'wuwa') {
    let local = null;
    try { local = artParse(localStorage.getItem(artLocal(slug, game))); } catch (e) {}
    const srv = new Promise(res => {
      const ac = new AbortController(), t = setTimeout(() => { ac.abort(); res(null); }, 1500);
      fetch(ART_API(slug, game), { cache: 'no-store', signal: ac.signal })
        .then(r => r.ok ? r.json() : null)
        .then(d => { clearTimeout(t); res(d && typeof d.text === 'string' ? artParse(d.text) : null); })
        .catch(() => { clearTimeout(t); res(null); });
    });
    return srv.then(p => p || local);
  };
  window.applyArtPos = function (aside, img) {
    const p = aside._pos;
    if (p) {
      img.style.setProperty('--tx', p.x + '%'); img.style.setProperty('--ty', p.y + '%'); img.style.setProperty('--ts', p.s);
      aside.classList.add('custom');
    } else {
      ['--tx', '--ty', '--ts'].forEach(k => img.style.removeProperty(k));
      aside.classList.remove('custom');
    }
  };
  window.initArtEdit = function (aside, img) {
    const stage = img.closest('.portrait-stage');
    if (!stage) return;
    const slug = aside.dataset.slug;
    const game = aside.closest('[data-el="zzz"]') ? 'zzz' : 'wuwa';
    stage.classList.add('art-edit');
    img.draggable = false;
    const bar = document.createElement('div');
    bar.className = 'art-bar';
    bar.innerHTML = '<span>Arrastra para mover · rueda = zoom · doble clic = automático</span><button type="button">Automático</button>';
    stage.appendChild(bar);
    let cur = null, timer = null, drag = null;
    const dims = () => ({ cw: img.clientWidth, ch: img.clientHeight });
    /* posición equivalente a la que se ve ahora en modo automático, para que no salte al empezar a editar */
    const auto = () => {
      const { cw, ch } = dims();
      const iw = +img.dataset.sw || img.naturalWidth, ih = +img.dataset.sh || img.naturalHeight;
      if (!cw || !ch || !iw || !ih || !aside.classList.contains('trimmed')) return { x: 0, y: 0, s: 1 };
      const cover = Math.max(cw / iw, ch / ih), contain = Math.min(cw / iw, ch / ih);
      const sw = iw * cover, sh = ih * cover;
      const fx = parseFloat(img.style.getPropertyValue('--fx')), pp = Number.isFinite(fx) ? fx / 100 : .5;
      return { x: sw > cw + 1 ? 100 * (pp - .5) * (cw - sw) / cw : 0, y: sh > ch + 1 ? 100 * ((sh - ch) / 2) / ch : 0, s: cover / contain };
    };
    const ensure = () => { if (!cur) cur = aside._pos ? { ...aside._pos } : auto(); };
    function save(retry) {
      const key = getKey(retry);
      if (!key) { toast('Sin clave: solo guardado en este navegador'); return; }
      fetch(ART_API(slug, game), {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cur ? artFmt(cur) : '' })
      }).then(r => {
        if (r.status === 401) { localStorage.removeItem(KEYSTORE); if (!retry) return save(true); toast('Clave incorrecta'); return; }
        toast(r.ok ? 'Posición guardada para todos ✓' : 'Guardado solo en este navegador (' + r.status + ')');
      }).catch(() => toast('Guardado solo en este navegador'));
    }
    function persist() {
      try { cur ? localStorage.setItem(artLocal(slug, game), artFmt(cur)) : localStorage.removeItem(artLocal(slug, game)); } catch (e) {}
      clearTimeout(timer); timer = setTimeout(() => save(false), 700);
    }
    const set = () => { aside._pos = { ...cur }; window.applyArtPos(aside, img); persist(); };
    const reset = () => { cur = null; aside._pos = null; window.applyArtPos(aside, img); persist(); };
    stage.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('.art-bar')) return;
      ensure(); drag = { x: e.clientX, y: e.clientY };
      try { stage.setPointerCapture(e.pointerId); } catch (er) {}
      stage.classList.add('dragging'); e.preventDefault();
    });
    stage.addEventListener('pointermove', e => {
      if (!drag) return;
      const { cw, ch } = dims();
      cur.x += 100 * (e.clientX - drag.x) / cw; cur.y += 100 * (e.clientY - drag.y) / ch;
      drag = { x: e.clientX, y: e.clientY }; set();
    });
    const end = () => { drag = null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
    stage.addEventListener('wheel', e => {
      e.preventDefault(); ensure();
      const { cw, ch } = dims(), r = stage.getBoundingClientRect();
      const qx = e.clientX - (r.left + r.width / 2), qy = e.clientY - (r.top + r.height / 2);
      const ns = Math.min(4, Math.max(.3, cur.s * Math.exp(-e.deltaY * .0015))), k = ns / cur.s;
      const tx = cur.x * cw / 100, ty = cur.y * ch / 100;
      cur.x = 100 * (qx - k * (qx - tx)) / cw; cur.y = 100 * (qy - k * (qy - ty)) / ch; cur.s = ns; set();
    }, { passive: false });
    stage.addEventListener('dblclick', e => { if (!e.target.closest('.art-bar')) reset(); });
    bar.querySelector('button').addEventListener('click', reset);
  };

  /* Desplaza horizontalmente la imagen recortada para que el centro de masa del personaje quede en el centro de la columna */
  window.focusArt = function (img) {
    const cxf = parseFloat(img.dataset.cx), iw = +img.dataset.sw, ih = +img.dataset.sh;
    const cw = img.clientWidth, ch = img.clientHeight;
    if (!(cxf >= 0) || !iw || !ih || !cw || !ch) return;
    const sw = iw * Math.max(cw / iw, ch / ih);
    if (sw <= cw + 1) { img.style.removeProperty('--fx'); return; }
    const p = Math.min(1, Math.max(0, (cw / 2 - cxf * sw) / (cw - sw)));
    img.style.setProperty('--fx', (p * 100).toFixed(1) + '%');
  };
  window.addEventListener('resize', () => document.querySelectorAll('aside.trimmed .portrait').forEach(window.focusArt));

  /* ZZZ: conservar Portrait.webp completo y habilitar el mismo ajuste de WuWa */
  window.initZzzArt = function (img) {
    const aside = img.closest('aside.hsr-id');

    const slug = aside.dataset.slug;

    });

  /* Recorta el espacio transparente de la card3 para que el personaje quede grande y centrado en la columna */
  window.trimArt = function (img) {
    const aside = img.closest('aside');
    const slug = aside && aside.dataset.slug;
    const gm = aside && aside.closest('[data-el="zzz"]') ? 'zzz' : 'wuwa';
    const posP = img._posP || (img._posP = slug ? window.getArtPos(slug, gm) : Promise.resolve(null));
    const done = () => posP.then(p => {
      img.classList.add('ready');
      if (!aside) return;
      if (!aside._artSet) { aside._artSet = true; aside._pos = p; }
      window.applyArtPos(aside, img);
      if (EDIT && !aside._artEdit) { aside._artEdit = true; window.initArtEdit(aside, img); }
    });
    if (!aside) { done(); return; }
    if (img.dataset.trim) { if (img.dataset.sw) window.focusArt(img); done(); return; }   // 2.ª carga: ya es la imagen recortada
    img.dataset.trim = '1';
    setTimeout(done, 3000);   // seguridad: nunca dejar la imagen oculta
    const w = img.naturalWidth, h = img.naturalHeight;
    if (w / h > .85) aside.classList.add('wide-art');           // respaldo si no se puede recortar
    if (!aside.classList.contains('free') || aside.classList.contains('rover-art')) { done(); return; }
    try {
      const k = Math.min(1, 600 / Math.max(w, h));
      const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const cx = c.getContext('2d'); cx.drawImage(img, 0, 0, cw, ch);
      const d = cx.getImageData(0, 0, cw, ch).data;
      let x0 = cw, y0 = ch, x1 = -1, y1 = -1; let sumA = 0, sumX = 0;
      for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
        const al = d[(y * cw + x) * 4 + 3]; if (al > 24) { sumA += al; sumX += al * x; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (x1 < 0) { done(); return; }
      const pad = 3;
      const sx = Math.max(0, Math.floor((x0 - pad) / k)), sy = Math.max(0, Math.floor((y0 - pad) / k));
      const sw = Math.min(w - sx, Math.ceil((x1 - x0 + 1 + pad * 2) / k)), sh = Math.min(h - sy, Math.ceil((y1 - y0 + 1 + pad * 2) / k));
      if (sw < 50 || sh < 50) { done(); return; }
      const o = document.createElement('canvas'); o.width = sw; o.height = sh;
      o.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      o.toBlob(b => {
        if (!b) { done(); return; }
        img.dataset.sw = sw; img.dataset.sh = sh;
        img.dataset.cx = Math.min(1, Math.max(0, ((sumX / sumA) / k - sx) / sw));
        img.src = URL.createObjectURL(b);
        aside.classList.remove('wide-art');
        aside.classList.add('trimmed');
      }, 'image/webp', .92);
    } catch (e) { done(); /* imagen no accesible (p. ej. abierta como archivo local): se deja como está */ }

  const DETAIL_FILES = { wuwa: { 'lily': 'Lily_Full_Sprite.webp', 'aug': 'aug_card3.webp', 'buling': 'buling_card3.webp', 'brant': 'card_brant3.webp', 'camellya': 'card_cam3.webp', 'canta': 'card_canta3.webp', 'carlotta': 'card_carlotta3.webp', 'changli': 'card_changli3.webp', 'keeper': 'card_keeper3.webp', 'phoebe': 'card_phoebe3.webp', 'roccia': 'card_roccia3.webp', 'xiangli-yao': 'card_xiang3.webp', 'zani': 'card_zani3.webp', 'zhezhi': 'card_zhe3.webp', 'cart': 'cart_card3.webp', 'chisa': 'chisa_card3.webp', 'cia': 'cia_card3.webp', 'denia': 'denia_card3.webp', 'encore': 'encore_card3.webp', 'gal': 'gal_card3.webp', 'hiyuki': 'hiyuki_card3.webp', 'hsin': 'hsin_card3.webp', 'iuno': 'iuno_card3.webp', 'jianxin': 'jiaxin_card3.webp', 'jihni': 'jihni_card3.webp', 'jingran': 'jingran_card3.webp', 'jiyan': 'jiyan_card3.webp', 'calcharo': 'kakarot_card3.webp', 'lingyang': 'ling_card3.webp', 'lucilla': 'Lucilla_card3.webp', 'lucy': 'lucy_card3.webp', 'lupa': 'lupa_card3.webp', 'luuk-herssen': 'Luuk Herssen_card3.webp', 'lynae': 'Lynae_card3.webp', 'math': 'math_card3.webp', 'mornye': 'Mornye_card3.webp', 'mortefi': 'mortefi_card3.webp', 'phr': 'phr_card3.webp', 'qingxiao': 'qingxiao_card3.webp', 'qiu': 'qiu_card3.webp', 'rebecca': 'rebecca_card3.webp', 'senhua': 'senhua_card3.webp', 'sigrika': 'Sigrika_card3.webp', 'suisui': 'suisui_card3.webp', 'suoming': 'suoming_card3.webp', 'verina': 'verina_card3.webp', 'yangyang-xuanling': 'yangyang-xuanling_card3.webp', 'yinlin': 'yinglin_card3.webp', 'rover-aero': 'Rover_3.webp', 'rover-electro': 'Rover_3.webp', 'rover-spectro': 'Rover_3.webp', 'rover-havoc': 'Rover_3.webp' } };
  /* ZZZ: nombres exactos de los archivos Portrait.webp proporcionados */

    'orphie-and-magus': 'Agent_Orphie_Magnusson_%2526_Magus_Portrait.webp'  /* el archivo se llama con "%26" literal; en la URL el % va como %25 */,
    'pan-yinhu': 'Agent_Pan_Yinhu_Portrait.webp',
    'phoenix': 'Agent_Phoenix_Reffaella_Portrait.webp',
    'piper': 'Agent_Piper_Wheel_Portrait.webp',

  function imgBig(gameKey, slug) {
    const f = DETAIL_FILES[gameKey] && DETAIL_FILES[gameKey][slug];
    return f ? './' + (f.includes('%') ? f : encodeURI(f)) : img(gameKey, slug);
  }
  function img(gameKey, slug) {
    const g = GAMES[gameKey];
    const file = (g.files && g.files[slug]) || (slug + g.suffix);
    return /^https:\/\//.test(file) ? file : './' + encodeURI(file);
  }

  function renderTabs() {
    $('game-tabs').innerHTML = Object.keys(GAMES).map(key => `
      <button class="game-tab" role="tab" aria-selected="${key === currentGame}" data-game="${key}">${GAMES[key].label}</button>
    `).join('');
    $('game-tabs').querySelectorAll('.game-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentGame = btn.dataset.game;
        renderTabs();
        renderGrid();
      });
    });
  }

  /* ZZZ (galería): todas las cards se recortan igual -> mismo tamaño de cabeza/torso sin importar el tamaño original de la imagen */
  window.normCard = function (img) {
    if (img.dataset.norm) { img.removeAttribute('data-pend'); return; }
    img.dataset.norm = '1';
    try {
      const w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) { img.removeAttribute('data-pend'); return; }
      const k = Math.min(1, 500 / Math.max(w, h));
      const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const cx = c.getContext('2d', { willReadFrequently: true }); cx.drawImage(img, 0, 0, cw, ch);
      const d = cx.getImageData(0, 0, cw, ch).data;
      /* filas "densas": al menos 3% del ancho con píxeles opacos (así los hilos, plumas o brillos finos no cuentan como personaje) */
      const need = Math.max(3, Math.round(cw * 0.03));
      let y0 = -1, y1 = -1;
      for (let y = 0; y < ch; y++) {
        let n = 0; for (let x = 0; x < cw; x++) if (d[(y * cw + x) * 4 + 3] > 40) n++;
        if (n >= need) { if (y0 < 0) y0 = y; y1 = y; }
      }
      if (y0 < 0) { img.removeAttribute('data-pend'); return; }
      const nf = parseFloat(img.dataset.nf) || 0.6;
      const H = y1 - y0 + 1, S = Math.round(H * nf);               // cuadro = parte superior del personaje (cabeza y torso)
      let sA = 0, sX = 0;
      for (let y = y0; y < Math.min(ch, y0 + S); y++) for (let x = 0; x < cw; x++) { const a = d[(y * cw + x) * 4 + 3]; if (a > 40) { sA += a; sX += a * x; } }
      const mx = sA ? sX / sA : cw / 2;
      const o = document.createElement('canvas'); o.width = o.height = 320;
      o.getContext('2d').drawImage(c, mx - S / 2, y0 - S * 0.04, S, S, 0, 0, 320, 320);
      o.toBlob(b => { if (b) img.src = URL.createObjectURL(b); else img.removeAttribute('data-pend'); }, 'image/webp', .9);
    } catch (e) { img.removeAttribute('data-pend'); /* imagen no accesible (p. ej. abierta como archivo local): se deja como está */ }
  };


  /* Ajuste opcional del encuadre de una tarjeta de ZZZ (object-position), p. ej.: ZZZ_CARD_POS['zhao'] = '50% 30%' */
  const ZZZ_CARD_POS = {};
  /* Tarjetas que se centran solas en la cabeza (normCard); el número es cuánto del personaje entra en el cuadro (0.75 = cabeza y torso) */
  const ZZZ_CARD_AUTO = { 'zhao': 0.75 };
  /* Zoom de una tarjeta (1 = normal): ZZZ_CARD_ZOOM['slug'] = 1.2 la agranda un 20% */
  const ZZZ_CARD_ZOOM = { 'piper': 1.25 };
  function renderGrid() {
    const q = norm($('search').value);
    const list = GAMES[currentGame].chars
      .filter(c => norm(c[1]).includes(q) || norm(c[0]).includes(q))
      .map(([slug, name, role]) => `
        <a class="card" href="#${slug}">
          <img src="${img(currentGame, slug)}" alt="${name}" loading="lazy"${currentGame === 'zzz' ? ` data-alt="${esc(imgBig('zzz', slug))}"${ZZZ_CARD_AUTO[slug] ? ` data-nf="${ZZZ_CARD_AUTO[slug]}" data-pend="1"` : ''}${ZZZ_CARD_POS[slug] || ZZZ_CARD_ZOOM[slug] ? ` style="${ZZZ_CARD_POS[slug] ? 'object-position:' + ZZZ_CARD_POS[slug] + ';' : ''}${ZZZ_CARD_ZOOM[slug] ? 'transform:scale(' + ZZZ_CARD_ZOOM[slug] + ');transform-origin:50% 25%;' : ''}"` : ''} onload="if(this.dataset.nf)normCard(this)" onerror="if(!this.dataset.fb&&this.dataset.alt){this.dataset.fb=1;this.dataset.nf='0.38';this.setAttribute('data-pend','1');this.src=this.dataset.alt}else{this.removeAttribute('data-pend')}"` : ''}>
          <span>${name}${role ? `<small>${role}</small>` : ''}${zzzMini(currentGame, slug)}${hsrMini(currentGame, slug)}${wuwaMini(currentGame, slug)}</span>
        </a>`).join('');
    $('grid').innerHTML = list;
    setTimeout(() => document.querySelectorAll('.card > img[data-pend]').forEach(i => i.removeAttribute('data-pend')), 6000);  /* seguro: nunca dejar fotos ocultas */
    $('empty').hidden = list !== '';
  }

  const pendingImg = text => "this.replaceWith(Object.assign(document.createElement('p'),{className:'pending',textContent:'" + text + "'}))";

  function renderDetail(slug) {
    const found = findChar(slug);
    if (!found) return false;
    const { game, char: c } = found;
    const el = elOf(game, slug);
    const isZzz = game === 'zzz';
    const isWw = game === 'wuwa';
    const wb = isWw ? wuwaBg(slug) : null;
    const pa = pathOf(game, slug);
    const zi = isZzz ? (ZZZ_INFO[slug] || null) : null;
    const zTag = zi ? `<img class="el-ico" src="${zzzElIcon(zi[0])}" alt="" onerror="this.remove()">${zzzElName(slug)}${c[2] ? ' · ' + c[2] : ''}<span class="path-tag"><img class="path-ico" src="${zzzSpecIcon(zi[1])}" alt="" onerror="this.remove()">${ZZZ_SPEC_LABEL[zi[1]]}</span>` : '';
    const bg = isZzz ? ZZZ_BG[slug] : isWw ? wb.bg : CHAR_BG[slug];

    if (el || ((isZzz || isWw) && bg)) {
      $('detail').innerHTML = `
        <div data-el="${el || (isWw ? 'wuwa' : 'zzz')}"${bg ? ` style="--e1:${bg[0]};--e2:${bg[1]};--e3:color-mix(in srgb, ${bg[1]} 45%, #fff)"` : ''}>
          <div class="hsr-bg${isZzz ? ' zzz' : ''}${isWw ? ' wuwa' : ''}${bg ? ' fx lay-' + bg[3] : ''}" style="${bg ? `--b1:${bg[0]};--b2:${bg[1]};--b3:${bg[2]};` : ''}--art:url('${img(game, slug)}')">${isZzz ? `${zzzFx(slug, bg)}<span class="zzz-word">${c[1]}</span>` : isWw ? wuwaFx(slug, bg, wb.el) : ''}</div>
          <a class="back" href="#">← Todos los personajes</a>
          <div class="hsr-grid">
            <aside class="hsr-id${DETAIL_FILES[game] && DETAIL_FILES[game][slug] ? ' free' : ''}${isZzz ? ' zzz-fullbody' : ''}${/^rover/.test(slug) ? ' rover-art' : ''}" data-slug="${slug}">
              <div class="portrait-stage">
                <img class="portrait" src="${imgBig(game, slug)}" alt="${c[1]}" onload="trimArt(this)"${game === 'zzz' ? ` onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='./${slug}_card.webp'}"` : ''}>
                ${el ? `<img class="el-badge" src="${elIcon(el)}" alt="${EL_LABEL[el]}" onerror="this.remove()">` : isWw ? `<img class="el-badge" src="./element_${wb.el}.webp" alt="${WUWA_LABEL[wb.el]}" title="${WUWA_LABEL[wb.el]}" onerror="this.remove()">` : zi ? `<img class="el-badge" src="${zzzElIcon(zi[0])}" alt="${zzzElName(slug)}" title="${zzzElName(slug)}" onerror="this.remove()">` : ''}${pa ? `<img class="path-badge" src="${pathIcon(pa)}" alt="${PATH_LABEL[pa]}" title="${PATH_LABEL[pa]}" onerror="this.remove()">` : zi ? `<img class="path-badge" src="${zzzSpecIcon(zi[1])}" alt="${ZZZ_SPEC_LABEL[zi[1]]}" title="${ZZZ_SPEC_LABEL[zi[1]]}" onerror="this.remove()">` : ''}
              </div>
              <h1>${c[1]}</h1>
              <span class="el-tag">${el ? `<img class="el-ico" src="${elIcon(el)}" alt="" onerror="this.remove()">${EL_LABEL[el]}${c[2] ? ' · ' + c[2] : ''}` : zi ? zTag : (c[2] || (isWw ? `<img class="el-ico" src="./element_${wb.el}.webp" alt="" onerror="this.remove()">${WUWA_LABEL[wb.el]}` : ''))}${pa ? `<span class="path-tag"><img class="path-ico" src="${pathIcon(pa)}" alt="" onerror="this.remove()">${PATH_LABEL[pa]}</span>` : ''}</span>
              <div class="dupes" id="dupes" hidden>
                <h3>Dupes recomendados</h3>
                ${EDIT ? '<textarea id="dupes-edit" class="dupes-edit" maxlength="600" placeholder="Escribe aquí los dupes recomendados..."></textarea><p class="dupes-hint">Se guarda solo al escribir.</p>' : '<p class="dupes-view" id="dupes-view"></p>'}
              </div>
            </aside>
            <section class="panel panel-main">
              <h2>Armas y sets</h2>
              <div class="panel-body" id="build-body">
                <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}" onerror="${buildErr(slug)}">
              </div>
            </section>
            <section class="panel panel-teams">
              <h2>Equipos${EDIT ? '<input type="search" id="team-search" class="team-search" placeholder="Buscar personaje..." autocomplete="off" aria-label="Buscar personaje para el equipo">' : ''}</h2>
              <div class="panel-body" id="teams-body">
                <img class="shot" src="${teamsImg(slug)}" alt="Equipos de ${c[1]}" onerror="${pendingImg('Equipos pendientes.')}">
              </div>
            </section>
          </div>
        </div>`;
      return true;
    }

    $('detail').innerHTML = `
      <a class="back" href="#">← Todos los personajes</a>
      <div class="detail">
        <div>
          <img class="portrait" src="${img(game, slug)}" alt="${c[1]}">
          <h1>${c[1]}</h1>
          <p class="sub">${c[2]}</p>
        </div>
        <div>
          <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}" onerror="${buildErr(slug)}">
        </div>
      </div>`;
    return true;
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const showDetail = slug && renderDetail(slug);
    if (showDetail) {
      // al volver a la galería, queda en la pestaña del juego del personaje
      const f = findChar(slug);
      if (f && f.game !== currentGame) { currentGame = f.game; renderTabs(); renderGrid(); }
    }
    const f2 = showDetail && findChar(slug);
    const isHsr = !!(f2 && (elOf(f2.game, slug) || (f2.game === 'zzz' && ZZZ_BG[slug]) || f2.game === 'wuwa'));
    if (f2 && $('teams-body')) initTeams(slug, f2.game);
    if (f2 && $('dupes')) initDupes(slug, f2.game);
    if (f2 && $('build-body') && (f2.game === 'hsr' || f2.game === 'zzz' || f2.game === 'wuwa')) initBuild(slug, f2.game);
    document.body.classList.toggle('hsr-open', isHsr);
    document.querySelector('main').classList.toggle('wide', isHsr);
    $('detail').hidden = !showDetail;
    $('gallery').hidden = !!showDetail;
    window.scrollTo(0, 0);
  }

  $('search').addEventListener('input', renderGrid);

  window.addEventListener('hashchange', route);
  renderTabs();
  renderGrid();
  route();

</script>

  <script>
    (function () {
      var body = document.body, btn = document.getElementById('smBtn'), menu = document.getElementById('smMenu'), bd = document.getElementById('smBackdrop');
      function set(open) { body.classList.toggle('sm-open', open); btn.setAttribute('aria-expanded', open); }
      btn.addEventListener('click', function () { set(!body.classList.contains('sm-open')); });
      bd.addEventListener('click', function () { set(false); });
      menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
      function onScroll() { body.classList.toggle('sm-scrolled', (window.scrollY || document.documentElement.scrollTop) > 8); }
      window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
    })();
  </script>
