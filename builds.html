<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds — ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #f3f4f6;
    --border: #1a1c23;
    --card: #14161d;
    --card-border: #1f222c;
    --chip: #1c1e27;
    --chip-border: #2a2d38;
    --accent: #818cf8;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --muted: #5b5f6d;
    --heading: #1a1c23;
    --border: #e4e4ea;
    --card: #ffffff;
    --card-border: #e4e4ea;
    --chip: #ffffff;
    --chip-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-right a { color: var(--muted); text-decoration: none; font-size: 14px; }
  .nav-right a.active { color: var(--accent); }

  .toggle {
    width: 36px; height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left .2s ease;
  }
  body.light .toggle::after { left: 18px; }
  .social-icons { display: flex; align-items: center; gap: 14px; }
  .icon-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    opacity: .85;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity .15s ease, transform .15s ease;
  }
  .icon-circle:hover { opacity: 1; transform: translateY(-1px); }

  main { max-width: 1200px; padding: 80px 40px 80px; }
  h1 { margin: 0 0 6px; font-size: 32px; color: var(--heading); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  /* Título igual al del inicio */
  h1.hero-title { font-size: 48px; font-weight: 800; line-height: 1.1; margin: 0; }
  h1.hero-title.accent { color: var(--accent); }
  h1.hero-title.white { color: var(--heading); }
  .hero-sub { color: var(--muted); font-size: 17px; max-width: 480px; margin: 20px 0 28px; line-height: 1.5; }

  /* ===== Pestañas de juego ===== */
  .game-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .game-tab {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .game-tab:hover { color: var(--text); }
  .game-tab[aria-selected="true"] {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ===== Buscador ===== */
  .search {
    width: 100%;
    max-width: 420px;
    margin-bottom: 28px;
    padding: 11px 16px;
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, .card:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  /* ===== Galería ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    background: var(--chip);
  }
  .card span {
    display: block;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    border-top: 1px solid var(--card-border);
  }
  .card small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }

  /* ===== Detalle ===== */
  .back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    align-items: start;
  }
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    margin-bottom: 16px;
  }
  .shot {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .pending { color: var(--muted); font-size: 15px; margin: 0; }

  /* ===== Guía de build (estilo "Complete Guide") ===== */
  .guide-top {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }
  .guide-eyebrow {
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .guide-title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--heading);
    margin: 6px 0;
  }
  .guide-subtitle {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .guide-badge {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 14px;
    border-radius: 8px;
    background: #2a230f;
    border: 1px solid #4d3f14;
    color: #e8c468;
    font-size: 12px;
    font-weight: 700;
  }
  .guide-grid {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    gap: 20px;
    align-items: start;
  }
  .guide-col { display: flex; flex-direction: column; gap: 20px; }
  .guide-portrait {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    border: 1px solid var(--card-border);
  }
  .guide-elchips {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .guide-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px;
  }
  .guide-card h3 {
    margin: 0 0 14px;
    font-size: 15px;
    color: var(--accent);
  }
  .guide-note {
    background: #10231f22;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    margin-top: 12px;
  }
  .guide-note ul { margin: 0; padding-left: 18px; }
  .guide-weapons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .guide-chipbox {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
  }
  .guide-chipbox b { display: block; font-size: 13px; margin-bottom: 4px; }
  .guide-chipbox .rk { color: var(--muted); font-size: 11px; display: block; margin-bottom: 8px; }
  .guide-chipbox .val { font-size: 12px; color: var(--accent); font-weight: 600; }
  .guide-row {
    display: grid;
    grid-auto-flow: column;
    gap: 10px;
    overflow-x: auto;
  }
  .guide-step {
    background: var(--chip);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    min-width: 72px;
  }
  .guide-step b { display: block; font-size: 13px; color: var(--text); }
  .guide-step small { color: var(--muted); font-size: 11px; }
  .guide-arrow { align-self: center; color: var(--muted); }
  .guide-s { display: flex; gap: 10px; margin-bottom: 14px; }
  .guide-s .pill {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--chip);
    border: 1px solid var(--chip-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--accent);
  }
  .guide-s b { display: block; font-size: 13px; }
  .guide-s span { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .guide-synergy-row { margin-bottom: 14px; }
  .guide-synergy-row h4 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .guide-synergy-chars { display: flex; gap: 14px; flex-wrap: wrap; }
  .guide-synchar { text-align: center; width: 60px; }
  .guide-synchar img {
    width: 52px; height: 52px;
    border-radius: 10px;
    object-fit: cover;
    object-position: top;
    border: 1px solid var(--card-border);
    margin-bottom: 4px;
  }
  .guide-synchar span { font-size: 11px; color: var(--text); }
  .guide-support-line { font-size: 12.5px; line-height: 1.7; margin-bottom: 10px; }
  .guide-support-line b { color: var(--text); }
  .guide-cond { font-size: 13px; line-height: 1.6; border-left: 2px solid var(--accent); padding-left: 12px; margin-bottom: 16px; }
  .guide-cond b { color: var(--text); }
  @media (max-width: 1000px) {
    .guide-grid { grid-template-columns: 1fr; }
  }

  [hidden] { display: none !important; }

  @media (max-width: 800px) {
    .navbar { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
    .nav-right { gap: 16px; flex-wrap: wrap; }
    main { padding: 40px 20px 60px; }
    h1.hero-title { font-size: 36px; }
    .detail { grid-template-columns: 1fr; }
    .portrait { max-width: 280px; }
  }

</style>

  function renderBuildGuide(slug, c) {
    const g = BUILD_GUIDES[slug];
    const synChar = (s) => `
      <div class="guide-synchar">
        <img src="${img('wuwa', s.slug)}" alt="${s.name}" loading="lazy">
        <span>${s.name}</span>
      </div>`;
    return `
      <a class="back" href="#">← Todos los personajes</a>
      <div class="guide-top">
        <div class="guide-eyebrow">${g.academy}</div>
        <div class="guide-title">${g.title}</div>
        <div class="guide-subtitle">${g.subtitle}</div>
        <div class="guide-badge">${g.badge}</div>
      </div>
      <div class="guide-grid">
        <div class="guide-col">
          <img class="guide-portrait" src="${g.portrait}" alt="${c[1]}">
          <div class="guide-card">
            <h3>Efectos de Cadena de Resonancia</h3>
            ${g.chain.map(x => `
              <div class="guide-s">
                <div class="pill">${x.s}</div>
                <div><b>${x.title}</b><span>${x.desc}</span></div>
              </div>`).join('')}
          </div>
          <div class="guide-card">
            <h3>Sets de Sonata y Eco Principal</h3>
            ${g.sonatas.map(s => `<div class="guide-s"><div><b>${s.name}</b><span>${s.desc}</span></div></div>`).join('')}
            <div class="guide-row" style="margin-top:4px;">
              ${g.mainEchoes.map(e => `
                <div class="guide-step" style="min-width:120px;">
                  <b>${e.name}</b><small>${e.tag}</small>
                </div>`).join('')}
            </div>
          </div>
        </div>

        <div class="guide-col">
          <div class="guide-card">
            <h3>Armas (para daño de equipo)</h3>
            <div class="guide-weapons">
              ${g.weapons.map(w => `
                <div class="guide-chipbox">
                  <b>${w.name}</b><span class="rk">${w.rank}</span>
                  <span class="val">${w.val}</span>
                </div>`).join('')}
            </div>
            <div class="guide-note"><ul>${g.weaponsNote.map(n => `<li>${n}</li>`).join('')}</ul></div>
          </div>

          <div class="guide-card">
            <h3>${g.echoSet.name}</h3>
            <div class="guide-weapons" style="grid-template-columns:repeat(5,1fr);">
              ${g.echoSet.costs.map(c2 => `
                <div class="guide-chipbox">
                  <span class="rk">${c2.cost}</span>
                  <span class="val">${c2.val}</span>
                </div>`).join('')}
            </div>
            <div class="guide-note"><ul>${g.echoSet.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>
          </div>

            <h3>Prioridad de Habilidades</h3>
            <div class="guide-row">
              ${g.skillPriority.map((s, i) => `
                ${i > 0 ? '<div class="guide-arrow">›</div>' : ''}
                <div class="guide-step"><b>${s}</b></div>`).join('')}

          </div>

          <div class="guide-card">
            <h3>Prioridad de Stats</h3>

  /* ============================================================ */
  const $ = id => document.getElementById(id);
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

  let currentGame = 'zzz';

  function findChar(slug) {
    for (const key in GAMES) {
      const c = GAMES[key].chars.find(x => x[0] === slug);
      if (c) return { game: key, char: c };
    }
    return null;
  }

  function img(gameKey, slug) {
    const g = GAMES[gameKey];
    const file = (g.files && g.files[slug]) || (slug + g.suffix);
    return './' + encodeURI(file);
  }

  function renderTabs() {
    $('game-tabs').innerHTML = Object.keys(GAMES).map(key => `
      <button class="game-tab" role="tab" aria-selected="${key === currentGame}" data-game="${key}">${GAMES[key].label}</button>
    `).join('');
    $('game-tabs').querySelectorAll('.game-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentGame = btn.dataset.game;
        renderTabs();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const q = norm($('search').value);
    const list = GAMES[currentGame].chars
      .filter(c => norm(c[1]).includes(q) || norm(c[0]).includes(q))
      .map(([slug, name, role]) => `
        <a class="card" href="#${slug}">
          <img src="${img(currentGame, slug)}" alt="${name}" loading="lazy">
          <span>${name}${role ? `<small>${role}</small>` : ''}</span>
        </a>`).join('');
    $('grid').innerHTML = list;
    $('empty').hidden = list !== '';
  }

  function renderDetail(slug) {
    const found = findChar(slug);
    if (!found) return false;
    const { game, char: c } = found;

    if (BUILD_GUIDES[slug]) {
      $('detail').innerHTML = renderBuildGuide(slug, c);
      return true;
    }

    $('detail').innerHTML = `
      <a class="back" href="#">← Todos los personajes</a>
      <div class="detail">
        <div>
          <img class="portrait" src="${img(game, slug)}" alt="${c[1]}">
          <h1>${c[1]}</h1>
          <p class="sub">${c[2]}</p>
        </div>
        <div>
          <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}"
               onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'pending',textContent:'Build pendiente.'}))">
        </div>
      </div>`;
    return true;
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const showDetail = slug && renderDetail(slug);
    if (showDetail) {
      // al volver a la galería, queda en la pestaña del juego del personaje
      const f = findChar(slug);
      if (f && f.game !== currentGame) { currentGame = f.game; renderTabs(); renderGrid(); }
    }
    $('detail').hidden = !showDetail;
    $('gallery').hidden = !!showDetail;
    window.scrollTo(0, 0);
  }

  $('search').addEventListener('input', renderGrid);

  window.addEventListener('hashchange', route);
  renderTabs();
  renderGrid();
  route();

</script>
</body>
