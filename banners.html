<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banners — ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #f3f4f6;
    --border: #1a1c23;
    --card: #14161d;
    --card-border: #1f222c;
    --chip: #1c1e27;
    --chip-border: #2a2d38;
    --accent: #818cf8;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --muted: #5b5f6d;
    --heading: #1a1c23;
    --border: #e4e4ea;
    --card: #ffffff;
    --card-border: #e4e4ea;
    --chip: #ffffff;
    --chip-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    transition: background .2s ease, color .2s ease;
  }

  /* ===== Navbar ===== */
  .navbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); }
  .logo { font-weight: 600; font-size: 15px; color: var(--text); letter-spacing: .5px; }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .social-icons { display: flex; align-items: center; gap: 14px; }
  .icon-circle { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); border: 1px solid var(--chip-border); opacity: .85; display: flex; align-items: center; justify-content: center; font-size: 14px; text-decoration: none; color: var(--text); transition: opacity .15s ease, transform .15s ease; }
  .icon-circle:hover { opacity: 1; transform: translateY(-1px); }
  .sm-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--chip); border: 1px solid var(--chip-border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; opacity: .9; transition: opacity .15s, transform .15s; }
  .sm-btn:hover { opacity: 1; transform: translateY(-1px); }
  .sm-btn svg { width: 16px; height: 16px; }

  /* ===== Sidebar menú ===== */
  :root { --sm-nav-h: 71px; --sm-w: 360px; }
  .sm-menu { position: fixed; top: var(--sm-nav-h); bottom: 0; right: 0; width: min(86vw, var(--sm-w)); z-index: 1000; display: flex; flex-direction: column; gap: 22px; padding: 22px 20px 28px; overflow-y: auto; box-sizing: border-box; background: rgba(14,15,21,.96); border-left: 1px solid #1f222c; box-shadow: 0 0 40px rgba(0,0,0,.5); transform: translateX(100%); visibility: hidden; transition: transform .25s ease, visibility .25s; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-family: system-ui, -apple-system, sans-serif; }
  body.light .sm-menu { background: rgba(255,255,255,.97); }
  body.sm-open .sm-menu { transform: translateX(0); visibility: visible; }
  .sm-backdrop { display: none; position: fixed; inset: var(--sm-nav-h) 0 0 0; z-index: 900; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  body.sm-open .sm-backdrop { display: block; opacity: 1; pointer-events: auto; }
  .sm-nav { display: flex; flex-direction: column; gap: 4px; }
  .sm-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #9ca3af; text-decoration: none; font-size: 15px; font-weight: 600; transition: background .15s, color .15s; }
  .sm-link:hover { background: rgba(129,140,248,.1); color: #e5e7eb; }
  .sm-link.active { background: rgba(129,140,248,.14); color: #818cf8; }
  .sm-ico { width: 22px; text-align: center; font-size: 16px; }

  /* ===== Contenido ===== */
  main { max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }
  .hero-title { font-size: 40px; font-weight: 800; margin: 0; line-height: 1.1; }
  .hero-title.accent { color: var(--accent); }
  .hero-title.white { color: var(--heading); }
  .hero-sub { color: var(--muted); font-size: 16px; margin: 16px 0 36px; }

  .game-block { margin-bottom: 48px; }
  .game-title { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: var(--heading); margin: 0 0 16px; }
  .game-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .banner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .banner-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .banner-kind { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--accent); }
  .banner-status { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(129,140,248,.14); color: var(--accent); display: inline-block; width: fit-content; }
  .banner-status.upcoming { background: rgba(255,170,60,.14); color: #ffaa3c; }
  .banner-icons { display: flex; flex-wrap: wrap; gap: 10px; }
  .banner-icons img { width: 88px; height: 88px; object-fit: contain; border-radius: 12px; background: var(--chip); border: 1px solid var(--chip-border); padding: 4px; }
  .banner-names { font-size: 14px; color: var(--text); line-height: 1.4; }
  .countdown { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 800; color: var(--heading); }
  .countdown-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .ends-at { font-size: 12px; color: var(--muted); }
  .empty-msg, .error-msg { color: var(--muted); font-size: 14px; }
  .error-msg { color: #f87171; }
  .updated-note { font-size: 12px; color: var(--muted); margin-top: -24px; margin-bottom: 36px; }

  @media (max-width: 800px) {
    .navbar { padding: 14px 16px; }
    main { padding: 32px 16px 60px; }
    .hero-title { font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="logo">✦ ArkanaBuilds ✦</div>
    <div class="nav-right">
      <div class="social-icons">
        <a class="icon-circle" href="https://discord.gg/HgEqZERZ97" target="_blank" rel="noopener" title="Discord">💬</a>
        <a class="icon-circle" href="https://x.com/Wnaapooo" target="_blank" rel="noopener" title="X / Twitter">𝕏</a>
        <a class="icon-circle" href="https://www.instagram.com/wna.pooo_/" target="_blank" rel="noopener" title="Instagram">📷</a>
        <a class="icon-circle" href="https://www.twitch.tv/wnapooo" target="_blank" rel="noopener" title="Twitch">🎥</a>
      </div>
      <button class="sm-btn" id="smBtn" type="button" aria-label="Abrir menú" aria-controls="smMenu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <main>
    <h1 class="hero-title accent">Arkanabuilds</h1>
    <h1 class="hero-title white">Banners</h1>
    <p class="hero-sub">Cuánto falta para que terminen los banners activos de cada juego.</p>
    <p class="updated-note" id="updatedNote"></p>

    <div class="game-block">
      <h2 class="game-title"><span class="dot"></span>Honkai: Star Rail</h2>
      <div class="banner-grid" id="hsrGrid"><p class="empty-msg">Cargando…</p></div>
    </div>

    <div class="game-block">
      <h2 class="game-title"><span class="dot"></span>Zenless Zone Zero</h2>
      <div class="banner-grid" id="zzzGrid"><p class="empty-msg">Cargando…</p></div>
    </div>
  </main>

  <aside class="sm-menu" id="smMenu" aria-label="Menú del sitio">
    <nav class="sm-nav">
      <a class="sm-link" href="/"><span class="sm-ico">🏠</span>Inicio</a>
      <a class="sm-link" href="/builds"><span class="sm-ico">⚔️</span>Builds</a>
      <a class="sm-link" href="/tier-list-zzz"><span class="sm-ico">🏆</span>Tier List</a>
      <a class="sm-link active" href="/banners"><span class="sm-ico">🎫</span>Banners</a>
    </nav>
  </aside>
  <div class="sm-backdrop" id="smBackdrop"></div>

  <script>
    (function () {
      var body = document.body, btn = document.getElementById('smBtn'), bd = document.getElementById('smBackdrop');
      var saved = null; try { saved = localStorage.getItem('arkana-theme'); } catch (e) {}
      if (saved === 'light') body.classList.add('light');
      function setMenu(open) {
        body.classList.toggle('sm-open', open);
        btn.setAttribute('aria-expanded', open);
      }
      btn.addEventListener('click', function () { setMenu(!body.classList.contains('sm-open')); });
      bd.addEventListener('click', function () { setMenu(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
    })();

    (function () {
      var countdownEls = [];

      function fmtDate(unixSeconds) {
        var d = new Date(unixSeconds * 1000);
        return d.toLocaleString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      function tick() {
        var now = Date.now() / 1000;
        countdownEls.forEach(function (el) {
          var target = parseFloat(el.getAttribute('data-end'));
          var diff = Math.max(0, target - now);
          var d = Math.floor(diff / 86400);
          var h = Math.floor((diff % 86400) / 3600);
          var m = Math.floor((diff % 3600) / 60);
          var s = Math.floor(diff % 60);
          el.textContent = d + 'd ' + h + 'h ' + m + 'm ' + s + 's';
        });
      }

      function card(kindLabel, statusLabel, isUpcoming, icons, names, targetUnix, endUnix) {
        var div = document.createElement('div');
        div.className = 'banner-card';

        var kind = document.createElement('div');
        kind.className = 'banner-kind';
        kind.textContent = kindLabel;
        div.appendChild(kind);

        var status = document.createElement('div');
        status.className = 'banner-status' + (isUpcoming ? ' upcoming' : '');
        status.textContent = statusLabel;
        div.appendChild(status);

        if (icons.length) {
          var iconsRow = document.createElement('div');
          iconsRow.className = 'banner-icons';
          icons.forEach(function (src) {
            var img = document.createElement('img');
            img.src = src;
            img.alt = '';
            img.loading = 'lazy';
            iconsRow.appendChild(img);
          });
          div.appendChild(iconsRow);
        }

        if (names.length) {
          var namesEl = document.createElement('div');
          namesEl.className = 'banner-names';
          namesEl.textContent = names.join(' · ');
          div.appendChild(namesEl);
        }

        var label = document.createElement('div');
        label.className = 'countdown-label';
        label.textContent = isUpcoming ? 'Comienza en' : 'Termina en';
        div.appendChild(label);

        var cd = document.createElement('div');
        cd.className = 'countdown';
        cd.setAttribute('data-end', targetUnix);
        div.appendChild(cd);
        countdownEls.push(cd);

        var ends = document.createElement('div');
        ends.className = 'ends-at';
        ends.textContent = (isUpcoming ? 'Inicio: ' : 'Fin: ') + fmtDate(isUpcoming ? targetUnix : endUnix);
        div.appendChild(ends);

        return div;
      }

      function renderGrid(gridEl, entries) {
        gridEl.innerHTML = '';
        if (!entries.length) {
          var p = document.createElement('p');
          p.className = 'empty-msg';
          p.textContent = 'No hay banners activos ni próximos por ahora.';
          gridEl.appendChild(p);
          return;
        }
        entries.forEach(function (e) { gridEl.appendChild(e); });
      }

      function classify(startTime, endTime) {
        var now = Date.now() / 1000;
        if (now >= startTime && now <= endTime) return 'active';
        if (now < startTime) return 'upcoming';
        return 'ended';
      }

      function buildHSR(data) {
        var grid = document.getElementById('hsrGrid');
        var cards = [];
        (data.starrail || []).forEach(function (b) {
          var st = classify(b.start_time, b.end_time);
          if (st === 'ended') return;
          var isChar = (b.characters && b.characters.length > 0);
          var fiveStars = (isChar ? b.characters : b.light_cones).filter(function (x) { return x.rarity === 5; });
          var icons = fiveStars.map(function (x) { return x.icon; });
          var names = fiveStars.map(function (x) { return x.name; });
          var kindLabel = isChar ? 'Personajes · v' + b.version : 'Lentes de Luz · v' + b.version;
          var statusLabel = st === 'active' ? 'Activo' : 'Próximamente';
          cards.push(card(kindLabel, statusLabel, st === 'upcoming', icons, names, st === 'upcoming' ? b.start_time : b.end_time, b.end_time));
        });
        renderGrid(grid, cards);
      }

      function buildZZZ(data) {
        var grid = document.getElementById('zzzGrid');
        var cards = [];
        (data.zenless || []).forEach(function (b) {
          var st = classify(b.start_time, b.end_time);
          if (st === 'ended') return;
          var isAgents = (b.agents && b.agents.length > 0);
          var fiveStars = (isAgents ? b.agents : b.w_engines).filter(function (x) { return x.rarity === 'S'; });
          var icons = fiveStars.map(function (x) { return x.icon; });
          var names = fiveStars.map(function (x) { return x.full_name || x.name; });
          var kindLabel = (isAgents ? 'Agentes' : 'W-Engines') + ' · v' + b.version;
          var statusLabel = st === 'active' ? 'Activo' : 'Próximamente';
          cards.push(card(kindLabel, statusLabel, st === 'upcoming', icons, names, st === 'upcoming' ? b.start_time : b.end_time, b.end_time));
        });
        renderGrid(grid, cards);
      }

      fetch('./banners.json', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (data) {
          buildHSR(data);
          buildZZZ(data);
          if (data.updated) {
            document.getElementById('updatedNote').textContent =
              'Datos actualizados: ' + fmtDate(Math.floor(new Date(data.updated).getTime() / 1000));
          }
          tick();
          setInterval(tick, 1000);
        })
        .catch(function (err) {
          ['hsrGrid', 'zzzGrid'].forEach(function (id) {
            document.getElementById(id).innerHTML = '<p class="error-msg">No se pudo cargar banners.json (' + err.message + ').</p>';
          });
        });
    })();
  </script>
</body>
</html>
