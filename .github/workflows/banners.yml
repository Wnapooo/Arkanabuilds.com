name: Actualizar banners

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar banners
        run: node scripts/update-banners.mjs
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain banners.json)" ]; then
            git config user.name  "banners-bot"
            git config user.email "banners-bot@users.noreply.github.com"
            git add banners.json
            git commit -m "chore: actualizar banners"
            git push
          else
            echo "Sin cambios"
          fi
