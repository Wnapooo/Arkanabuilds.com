name: Update banners

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para que el Action pueda hacer commit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run updater
        run: node scripts/update-banners.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banners.json
          git diff --staged --quiet || git commit -m "chore: update banners.json"
          git push
