<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --text-muted: #9ca3af;
    --text-faint: #8b8f99;
    --heading-white: #f3f4f6;
    --border: #1a1c23;
    --border-card: #1f222c;
    --card-bg: #14161d;
    --btn-secondary-bg: #1c1e27;
    --btn-secondary-border: #2a2d38;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
    --icon-purple: #1e1b3a;
    --icon-green: #0f2a22;
    --icon-blue: #122236;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --text-muted: #5b5f6d;
    --text-faint: #6b6f7a;
    --heading-white: #1a1c23;
    --border: #e4e4ea;
    --border-card: #e4e4ea;
    --card-bg: #ffffff;
    --btn-secondary-bg: #ffffff;
    --btn-secondary-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
    --icon-purple: #ece9fe;
    --icon-green: #e3f6ee;
    --icon-blue: #e5f0fb;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .nav-right a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
  }
  .nav-right a.active {
    color: #818cf8;
  }
  .toggle {
    width: 36px;
    height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left 0.2s ease;
  }
  body.light .toggle::after {
    left: 18px;
  }
  .social-icons {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .icon-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--btn-secondary-bg);
    border: 1px solid var(--btn-secondary-border);
    opacity: 0.85;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .icon-circle:hover {
    opacity: 1;
    transform: translateY(-1px);
  }

  /* ===== Hero ===== */
  .hero {
    padding: 80px 40px 40px;
    max-width: 1200px;
  }
  .hero h1 {
    font-size: 48px;
    font-weight: 800;
    margin: 0;
    line-height: 1.1;
  }
  .hero h1.accent { color: #818cf8; }
  .name-row { display: flex; align-items: center; gap: 14px; }
  .wave-emoji { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .hero h1.white { color: var(--heading-white); }
  .hero p {
    color: var(--text-muted);
    font-size: 17px;
    max-width: 480px;
    margin: 20px 0 28px;
    line-height: 1.5;
  }
  .hero-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 56px;
  }
  .btn {
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    display: inline-block;
  }
  .btn-primary {
    background: #6366f1;
    color: #ffffff;
  }
  .btn-secondary {
    background: var(--btn-secondary-bg);
    color: var(--text);
    border: 1px solid var(--btn-secondary-border);
  }

  /* ===== Feature cards ===== */
  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
  }
  .feature-card {
    background: var(--card-bg);
    border: 1px solid var(--border-card);
    border-radius: 12px;
    padding: 24px;
  }
  .feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 16px;
  }
  .icon-purple { background: var(--icon-purple); }
  .icon-green { background: var(--icon-green); }
  .icon-blue { background: var(--icon-blue); }
  .feature-card h3 {
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--heading-white);
  }
  .feature-card p {
    font-size: 13px;
    color: var(--text-faint);
    line-height: 1.5;
    margin: 0;
  }

  @media (max-width: 800px) {
    .features { grid-template-columns: 1fr; }
    .hero h1 { font-size: 36px; }
  }
  :root { --overlay: rgba(11,12,16,.62); }
  body.light { --overlay: rgba(247,247,250,.82); }

  /* ===== Imagen de fondo =====
     Guarda tu imagen como "fondo.jpg" en la misma carpeta que los .html
     (o cambia el nombre en url('./fondo.jpg')). La capa --overlay la oscurece
     para que el texto se siga leyendo; sube o baja el último número (0 a 1). */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: var(--overlay);
  }

  /* ===== Fondos en transición (crossfade con CSS puro) =====
     3 fondos: fondo.jpg -> fondo_sunbringer.jpg -> fondo_2.jpg -> (vuelve al primero)
     --ciclo = duración de los 3 juntos: 24s = 8s por fondo.
     Más lento: sube el número (30s = 10s por fondo). Más rápido: bájalo (15s = 5s por fondo). */
  .bg-slides { --ciclo: 24s; position: fixed; inset: 0; z-index: -2; background: var(--bg); overflow: hidden; }
  .bg-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .bg-slide.s1 { background-image: url('./fondo.jpg'); }               /* base, siempre visible debajo */
  .bg-slide.s2 { background-image: url('./fondo_sunbringer.jpg'); opacity: 0; animation: bgFade2 var(--ciclo) ease-in-out infinite; will-change: opacity; }
  .bg-slide.s3 { background-image: url('./fondo_2.jpg');          opacity: 0; animation: bgFade3 var(--ciclo) ease-in-out infinite; will-change: opacity; }

  /* 0-4s: 1.º | 4-5s: fundido al 2.º | 5-9s: 2.º | 9-10s: fundido al 3.º | 10-14s: 3.º | 14-15s: fundido al 1.º */
  @keyframes bgFade2 {
    0%, 26.67%   { opacity: 0; }
    33.33%, 66.67% { opacity: 1; }
    70%, 100%    { opacity: 0; }
  }
  @keyframes bgFade3 {
    0%, 60%      { opacity: 0; }
    66.67%, 93.33% { opacity: 1; }
    100%         { opacity: 0; }
  }

  /* ===== Adaptación a móvil ===== */
  .hero-buttons { flex-wrap: wrap; }
  @media (max-width: 800px) {
    .navbar { padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
    .nav-right { width: 100%; justify-content: space-between; gap: 12px; }
    .nav-right > a { padding: 6px 2px; }
    .social-icons { gap: 10px; }
    .icon-circle { width: 34px; height: 34px; }
    .hero { padding: 40px 20px 24px; }
    .hero h1 { font-size: 34px; word-break: break-word; }
    .hero p { font-size: 16px; margin: 16px 0 22px; }
    .hero-buttons { margin-bottom: 36px; }
    .btn { padding: 13px 20px; }
    .features { padding: 0 20px 32px; gap: 14px; }
  }
  @media (max-width: 380px) {
    .hero h1 { font-size: 30px; }
    .hero-buttons .btn { flex: 1 1 100%; text-align: center; }
  }

  /* ===== Barra superior fija + botón de menú ===== */
  :root { --nav-h: 71px; --side-w: 360px; }
  .navbar { position: sticky; top: 0; z-index: 30; height: var(--nav-h); background: transparent; border-bottom: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
  body.light .navbar { background: transparent; }
  .menu-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--btn-secondary-bg); border: 1px solid var(--btn-secondary-border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; opacity: .9; transition: opacity .15s, transform .15s; }
  .menu-btn:hover { opacity: 1; transform: translateY(-1px); }
  .menu-btn svg { width: 16px; height: 16px; }

  /* ===== Barra lateral derecha ===== */
  .sidebar { position: fixed; top: var(--nav-h); bottom: 0; right: 0; width: var(--side-w); z-index: 20; display: flex; flex-direction: column; gap: 22px; padding: 22px 20px 28px; overflow-y: auto; background: var(--card-bg); border-left: 1px solid var(--border-card); transform: translateX(100%); transition: transform .25s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  body:not(.light) .sidebar { background: rgba(14,15,21,.9); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  .sidebar-backdrop { display: none; }

  .side-nav { display: flex; flex-direction: column; gap: 4px; }
  .side-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 600; transition: background .15s, color .15s; }
  .side-link:hover { background: rgba(129,140,248,.1); color: var(--text); }
  .side-link.active { background: rgba(129,140,248,.14); color: #818cf8; }
  .side-ico { width: 22px; text-align: center; font-size: 16px; }

  .side-section { border-top: 1px solid var(--border-card); padding-top: 20px; }
  .side-section h3 { margin: 0 0 16px 4px; font-size: 14px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #818cf8; }
  .side-list { display: flex; flex-direction: column; gap: 6px; }
  .side-new { display: flex; gap: 16px; align-items: center; text-decoration: none; color: inherit; padding: 10px; border-radius: 14px; transition: background .15s; }
  .side-new:hover { background: rgba(129,140,248,.1); }
  .side-new img { width: 80px; height: 80px; object-position: top; border-radius: 14px; object-fit: cover; flex: none; background: var(--btn-secondary-bg); }
  .side-new b { display: block; font-size: 18px; margin-bottom: 4px; color: var(--heading-white); }
  .side-new small { color: var(--text-faint); font-size: 14px; line-height: 1.4; display: block; }
  .side-badge { display: inline-block; margin-bottom: 8px; padding: 3px 10px; border-radius: 999px; background: #ff5a2a22; color: #ff8a5c; font-size: 11px; font-weight: 700; letter-spacing: .5px; }

  /* Escritorio: la barra empuja el contenido hacia la izquierda */
  .hero, .features { transition: margin-right .25s ease; }
  @media (min-width: 1100px) {
    body.sidebar-open .hero, body.sidebar-open .features { margin-right: var(--side-w); }
  }
  /* Móvil / tablet: la barra se abre encima del contenido */
  @media (max-width: 1099px) {
    .sidebar { width: min(86vw, 360px); box-shadow: 0 0 40px rgba(0,0,0,.5); }
    .sidebar-backdrop { display: block; position: fixed; inset: var(--nav-h) 0 0 0; z-index: 15; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    body.sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 800px) {
    :root { --nav-h: 63px; }
    .navbar { flex-wrap: nowrap; padding: 14px 16px; }
    .nav-right { width: auto; gap: 12px; }
  }
</style>
</head>

    (function () {
      var body = document.body, btn = document.getElementById('menuBtn'), bd = document.getElementById('sidebarBackdrop');

      function set(open, save) {

        btn.setAttribute('aria-expanded', open);
