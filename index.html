<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --text-muted: #9ca3af;
    --text-faint: #8b8f99;
    --heading-white: #f3f4f6;
    --border: #1a1c23;
    --border-card: #1f222c;
    --card-bg: #14161d;
    --btn-secondary-bg: #1c1e27;
    --btn-secondary-border: #2a2d38;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
    --icon-purple: #1e1b3a;
    --icon-green: #0f2a22;
    --icon-blue: #122236;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --text-muted: #5b5f6d;
    --text-faint: #6b6f7a;
    --heading-white: #1a1c23;
    --border: #e4e4ea;
    --border-card: #e4e4ea;
    --card-bg: #ffffff;
    --btn-secondary-bg: #ffffff;
    --btn-secondary-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
    --icon-purple: #ece9fe;
    --icon-green: #e3f6ee;
    --icon-blue: #e5f0fb;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .nav-right a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
  }
  .nav-right a.active {
    color: #818cf8;
  }
  .toggle {
    width: 36px;
    height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left 0.2s ease;
  }
  body.light .toggle::after {
    left: 18px;
  }
  .social-icons {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .icon-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--btn-secondary-bg);
    border: 1px solid var(--btn-secondary-border);
    opacity: 0.85;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .icon-circle:hover {
    opacity: 1;
    transform: translateY(-1px);
  }

  /* ===== Hero ===== */
  .hero {
    padding: 80px 40px 40px;
    max-width: 1200px;
  }
  .hero h1 {
    font-size: 48px;
    font-weight: 800;
    margin: 0;
    line-height: 1.1;
  }
  .hero h1.accent { color: #818cf8; }
  .hero h1.white { color: var(--heading-white); }
  .hero p {
    color: var(--text-muted);
    font-size: 17px;
    max-width: 480px;
    margin: 20px 0 28px;
    line-height: 1.5;
  }
  .hero-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 56px;
  }
  .btn {
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    display: inline-block;
  }
  .btn-primary {
    background: #6366f1;
    color: #ffffff;
  }
  .btn-secondary {
    background: var(--btn-secondary-bg);
    color: var(--text);
    border: 1px solid var(--btn-secondary-border);
  }

  /* ===== Feature cards ===== */
  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
  }
  .feature-card {
    background: var(--card-bg);
    border: 1px solid var(--border-card);
    border-radius: 12px;
    padding: 24px;
  }
  .feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 16px;
  }
  .icon-purple { background: var(--icon-purple); }
  .icon-green { background: var(--icon-green); }
  .icon-blue { background: var(--icon-blue); }
  .feature-card h3 {
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--heading-white);
  }
  .feature-card p {
    font-size: 13px;
    color: var(--text-faint);
    line-height: 1.5;
    margin: 0;
  }

  @media (max-width: 800px) {
    .features { grid-template-columns: 1fr; }
    .hero h1 { font-size: 36px; }
  }
  :root { --overlay: rgba(11,12,16,.62); }
  body.light { --overlay: rgba(247,247,250,.82); }

  /* ===== Imagen de fondo =====
     Guarda tu imagen como "fondo.jpg" en la misma carpeta que los .html
     (o cambia el nombre en url('./fondo.jpg')). La capa --overlay la oscurece
     para que el texto se siga leyendo; sube o baja el último número (0 a 1). */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(var(--overlay), var(--overlay)),
      url('./fondo.jpg') center / cover no-repeat;
  }

  /* ===== Hero en 2 columnas + carrusel ===== */
  .hero {
    max-width: 1400px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
    gap: 56px;
    align-items: center;
    min-height: calc(100vh - 80px);
    padding-top: 40px;
  }
  .hero-buttons { margin-bottom: 0; }

  .showcase {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border-card);
    background: rgba(20, 22, 29, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 22px 26px 44px;
    color: inherit;
    text-decoration: none;
    opacity: 0;
    transform: translateX(28px) scale(0.99);
    pointer-events: none;
    transition: opacity .8s ease, transform .8s ease;
  }
  .slide.active {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  .slide-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .slide-head h2 {
    margin: 0;
    font-size: 20px;
    color: var(--heading-white);
  }
  .slide-head span {
    font-size: 13px;
    color: #818cf8;
  }

  /* Slide 1: tarjetas de builds */
  .cards {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .mini-card {
    position: relative;
    min-height: 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border-card);
  }
  .mini-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  .mini-card b {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 10px 8px;
    font-size: 13px;
    text-align: center;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
  }

  /* Slide 2: mini tier list */
  .tiers {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
  }
  .tier-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border-card);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .tier-tag {
    flex: 0 0 56px;
    text-align: center;
    font-weight: 800;
    font-size: 15px;
    padding: 8px 0;
    border-radius: 8px;
    color: #111;
  }
  .t0  { background: #f87171; }
  .t05 { background: #fb923c; }
  .t1  { background: #facc15; }
  .tier-icons { display: flex; flex-wrap: wrap; gap: 8px; }
  .tier-icons img {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--btn-secondary-bg);
    border: 1px solid var(--border-card);
  }

  .dots {
    position: absolute;
    left: 0; right: 0; bottom: 14px;
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 2;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 999px;
    border: none;
    padding: 0;
    cursor: pointer;
    background: #4b5060;
    transition: width .25s ease, background .25s ease;
  }
  .dot.active { width: 22px; background: #818cf8; }

  @media (max-width: 1000px) {
    .hero { grid-template-columns: 1fr; gap: 36px; min-height: 0; }
  }
  @media (max-width: 560px) {
    .hero { padding: 40px 20px; }
    .slide { padding: 16px 16px 40px; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    .cards .mini-card:nth-child(n+3) { display: none; }
    .showcase { aspect-ratio: 4 / 5; }
    .tier-icons img { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: none; }
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="logo">✦ ArkanaBuilds ✦</div>
    <div class="nav-right">
      <a href="./index.html" class="active">Inicio</a>
      <a href="./builds.html">Builds</a>
      <a href="./tier-list-zzz-local.html">Tier List</a>
      <div class="social-icons">
        <a class="icon-circle" href="https://discord.gg/HgEqZERZ97" target="_blank" rel="noopener" title="Discord">💬</a>
        <a class="icon-circle" href="https://x.com/Wnaapooo" target="_blank" rel="noopener" title="X / Twitter">𝕏</a>
        <a class="icon-circle" href="https://www.instagram.com/wna.pooo_/" target="_blank" rel="noopener" title="Instagram">📷</a>
        <a class="icon-circle" href="https://www.twitch.tv/wnapooo" target="_blank" rel="noopener" title="Twitch">🎥</a>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-text">
      <h1 class="accent">Arkanabuilds</h1>
      <h1 class="white">David weko </h1>
      <p>Tier lists avanzadas y Guías optimizadas.</p>
      <div class="hero-buttons">
        <a href="./builds.html" class="btn btn-primary">Ver Personajes</a>
        <a href="./tier-list-zzz-local.html" class="btn btn-secondary">Ver Tier List</a>
      </div>
    </div>

    <div class="showcase" id="showcase">
      <a class="slide active" href="./builds.html">
        <div class="slide-head"><h2>Builds</h2><span>Ver todas →</span></div>
        <div class="cards">
          <div class="mini-card"><img src="./aha_card.webp" alt="Aha"><b>Aha</b></div>
          <div class="mini-card"><img src="./firefly_card.webp" alt="Firefly"><b>Firefly</b></div>
          <div class="mini-card"><img src="./castorice_card.webp" alt="Castorice"><b>Castorice</b></div>

        </div>
      </a>
      <a class="slide" href="./tier-list-hsr.html">
        <div class="slide-head"><h2>Tier List</h2><span>Ver completa →</span></div>
        <div class="tiers">
          <div class="tier-row"><div class="tier-tag t0">T0</div><div class="tier-icons"><img src="./archer_icon.webp" alt="archer" onerror="this.style.visibility='hidden'"><img src="./ashveil_icon.webp" alt="ashveil" onerror="this.style.visibility='hidden'"><img src="./castorice_icon.webp" alt="castorice" onerror="this.style.visibility='hidden'"><img src="./firefly_icon.webp" alt="firefly" onerror="this.style.visibility='hidden'"><img src="./himeko-nova_icon.webp" alt="himeko-nova" onerror="this.style.visibility='hidden'"><img src="./evanescia_icon.webp" alt="evanescia" onerror="this.style.visibility='hidden'"></div></div>
          <div class="tier-row"><div class="tier-tag t05">T0.5</div><div class="tier-icons"><img src="./acheron_icon.webp" alt="acheron" onerror="this.style.visibility='hidden'"><img src="./hysilens_icon.webp" alt="hysilens" onerror="this.style.visibility='hidden'"><img src="./saber_icon.webp" alt="saber" onerror="this.style.visibility='hidden'"><img src="./kafka_icon.webp" alt="kafka" onerror="this.style.visibility='hidden'"><img src="./black-swan_icon.webp" alt="black-swan" onerror="this.style.visibility='hidden'"></div></div>
          <div class="tier-row"><div class="tier-tag t1">T1</div><div class="tier-icons"><img src="./anaxa_icon.webp" alt="anaxa" onerror="this.style.visibility='hidden'"><img src="./phainon_icon.webp" alt="phainon" onerror="this.style.visibility='hidden'"><img src="./cerydra_icon.webp" alt="cerydra" onerror="this.style.visibility='hidden'"><img src="./sunday_icon.webp" alt="sunday" onerror="this.style.visibility='hidden'"><img src="./lingsha_icon.webp" alt="lingsha" onerror="this.style.visibility='hidden'"></div></div>
        </div>
      </a>
      <div class="dots" id="dots"></div>
    </div>
  </div>


  <script>
    (function () {
      var box = document.getElementById('showcase');
      var slides = box.querySelectorAll('.slide');
      var dotsBox = document.getElementById('dots');
      var i = 0, timer;
      slides.forEach(function (_, k) {
        var d = document.createElement('button');
        d.className = 'dot' + (k === 0 ? ' active' : '');
        d.setAttribute('aria-label', 'Ir a la diapositiva ' + (k + 1));
        d.addEventListener('click', function () { show(k); restart(); });
        dotsBox.appendChild(d);
      });
      var dots = dotsBox.children;
      function show(n) {
        slides[i].classList.remove('active'); dots[i].classList.remove('active');
        i = n % slides.length;
        slides[i].classList.add('active'); dots[i].classList.add('active');
      }
      function start() { timer = setInterval(function () { show(i + 1); }, 4500); }
      function restart() { clearInterval(timer); start(); }
      box.addEventListener('mouseenter', function () { clearInterval(timer); });
      box.addEventListener('mouseleave', start);
      start();
    })();
  </script>
