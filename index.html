<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ArkanaBuilds</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --text-muted: #9ca3af;
    --text-faint: #8b8f99;
    --heading-white: #f3f4f6;
    --border: #1a1c23;
    --border-card: #1f222c;
    --card-bg: #14161d;
    --btn-secondary-bg: #1c1e27;
    --btn-secondary-border: #2a2d38;
    --toggle-bg: #23252f;
    --toggle-knob: #6b7280;
    --icon-purple: #1e1b3a;
    --icon-green: #0f2a22;
    --icon-blue: #122236;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --text-muted: #5b5f6d;
    --text-faint: #6b6f7a;
    --heading-white: #1a1c23;
    --border: #e4e4ea;
    --border-card: #e4e4ea;
    --card-bg: #ffffff;
    --btn-secondary-bg: #ffffff;
    --btn-secondary-border: #d9d9e1;
    --toggle-bg: #d9d9e1;
    --toggle-knob: #6366f1;
    --icon-purple: #ece9fe;
    --icon-green: #e3f6ee;
    --icon-blue: #e5f0fb;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .nav-right a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
  }
  .nav-right a.active {
    color: #818cf8;
  }
  .toggle {
    width: 36px;
    height: 20px;
    background: var(--toggle-bg);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: left 0.2s ease;
  }
  body.light .toggle::after {
    left: 18px;
  }
  .social-icons {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .icon-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--btn-secondary-bg);
    border: 1px solid var(--btn-secondary-border);
    opacity: 0.85;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .icon-circle:hover {
    opacity: 1;
    transform: translateY(-1px);
  }

  /* ===== Hero ===== */
  .hero {
    padding: 80px 40px 40px;
    max-width: 1200px;
  }
  .hero h1 {
    font-size: 48px;
    font-weight: 800;
    margin: 0;
    line-height: 1.1;
  }
  .hero h1.accent { color: #818cf8; }
  .hero h1.white { color: var(--heading-white); }
  .hero p {
    color: var(--text-muted);
    font-size: 17px;
    max-width: 480px;
    margin: 20px 0 28px;
    line-height: 1.5;
  }
  .hero-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 56px;
  }
  .btn {
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    display: inline-block;
  }
  .btn-primary {
    background: #6366f1;
    color: #ffffff;
  }
  .btn-secondary {
    background: var(--btn-secondary-bg);
    color: var(--text);
    border: 1px solid var(--btn-secondary-border);
  }

  /* ===== Feature cards ===== */
  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
  }
  .feature-card {
    background: var(--card-bg);
    border: 1px solid var(--border-card);
    border-radius: 12px;
    padding: 24px;
  }
  .feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 16px;
  }
  .icon-purple { background: var(--icon-purple); }
  .icon-green { background: var(--icon-green); }
  .icon-blue { background: var(--icon-blue); }
  .feature-card h3 {
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--heading-white);
  }
  .feature-card p {
    font-size: 13px;
    color: var(--text-faint);
    line-height: 1.5;
    margin: 0;
  }

  @media (max-width: 800px) {
    .features { grid-template-columns: 1fr; }
    .hero h1 { font-size: 36px; }
  }
  :root { --overlay: rgba(11,12,16,.62); }
  body.light { --overlay: rgba(247,247,250,.82); }

  /* ===== Imagen de fondo =====
     Guarda tu imagen como "fondo.jpg" en la misma carpeta que los .html
     (o cambia el nombre en url('./fondo.jpg')). La capa --overlay la oscurece
     para que el texto se siga leyendo; sube o baja el último número (0 a 1). */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(var(--overlay), var(--overlay)),
      url('./fondo.jpg') center / cover no-repeat;
  }

  /* ===== Hero en 2 columnas + carrusel ===== */
  .hero {
    max-width: none;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
    gap: 56px;
    align-items: center;
    min-height: calc(100vh - 80px);
    padding-top: 24px;
    padding-bottom: 24px;
  }
  .hero-buttons { margin-bottom: 0; }

  .sp-card {
    background: rgba(20, 22, 29, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border-card);
    border-radius: 14px;
    padding: 14px;
    overflow: hidden;
    min-width: 0;
  }
  .sp-card.wide { grid-column: 1 / -1; }
  .sp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--heading-white);
  }
  .sp-head a { font-size: 12px; font-weight: 500; color: #818cf8; text-decoration: none; }
  .sp-card iframe { width: 100%; border: 0; border-radius: 10px; display: block; background: #0b0c10; }
  .sp-box { height: clamp(150px, 20vh, 260px); overflow-y: auto; border-radius: 10px; }
  .sp-fallback a { color: #818cf8; text-decoration: none; font-weight: 600; }
  .sp-fallback { color: var(--text-muted); font-size: 13px; padding: 24px 8px; text-align: center; }

  @media (min-width: 1001px) {
    .hero-text { padding-bottom: 140px; }
  }


  /* ===== Layout del panel: Twitch grande arriba, barra de X abajo ===== */
  .hero { grid-template-columns: 1fr; padding-top: 24px; padding-bottom: 24px; }
  @media (max-width: 1000px) {
    .hero { padding-top: 24px; }
  }

  @media (max-width: 1000px) {
    .hero { grid-template-columns: 1fr; gap: 36px; min-height: 0; }
  }
  @media (max-width: 560px) {
    .hero { padding: 40px 20px; }
  }
</style>
</head>

  <div class="navbar">

      <div class="social-icons">
        <a class="icon-circle" href="https://discord.gg/HgEqZERZ97" target="_blank" rel="noopener" title="Discord">💬</a>
        <a class="icon-circle" href="https://x.com/Wnaapooo" target="_blank" rel="noopener" title="X / Twitter">𝕏</a>
        <a class="icon-circle" href="https://www.instagram.com/wna.pooo_/" target="_blank" rel="noopener" title="Instagram">📷</a>
        <a class="icon-circle" href="https://www.twitch.tv/wnapooo" target="_blank" rel="noopener" title="Twitch">🎥</a>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-text">
      <h1 class="accent">Arkanabuilds</h1>
      <h1 class="white">David weko </h1>
      <p>Tier lists avanzadas y Guías optimizadas.</p>
      <div class="hero-buttons">
        <a href="./builds.html" class="btn btn-primary">Ver Personajes</a>
        <a href="./tier-list-zzz-local.html" class="btn btn-secondary">Ver Tier List</a>
      </div>
    </div>
  </div>
</body>
</html>
