<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds — ArkanaBuilds</title>
<style>
  :root {
    --bg: #0b0c10;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #f3f4f6;
    --border: #1a1c23;
    --card: #14161d;
    --card-border: #1f222c;
    --chip: #1c1e27;
    --chip-border: #2a2d38;
    --accent: #818cf8;
  }
  body.light {
    --bg: #f7f7fa;
    --text: #1f2230;
    --muted: #5b5f6d;
    --heading: #1a1c23;
    --border: #e4e4ea;
    --card: #ffffff;
    --card-border: #e4e4ea;
    --chip: #ffffff;
    --chip-border: #d9d9e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== Navbar ===== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; }
  .nav-right { display: flex; gap: 28px; }
  .nav-right a { color: var(--muted); text-decoration: none; font-size: 14px; }
  .nav-right a.active { color: var(--accent); }

  main { max-width: 1200px; margin: 0 auto; padding: 40px 40px 80px; }
  h1 { margin: 0 0 6px; font-size: 32px; color: var(--heading); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  /* ===== Buscador ===== */
  .search {
    width: 100%;
    max-width: 420px;
    margin-bottom: 28px;
    padding: 11px 16px;
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--chip-border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, .card:focus-visible, .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { color: var(--muted); font-size: 15px; margin: 0 0 20px; }

  /* ===== Galería ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    background: var(--chip);
  }
  .card span {
    display: block;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    border-top: 1px solid var(--card-border);
  }
  .card small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }

  /* ===== Detalle ===== */
  .back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    align-items: start;
  }
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    margin-bottom: 16px;
  }
  .shot {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .pending { color: var(--muted); font-size: 15px; margin: 0; }

  [hidden] { display: none !important; }

  @media (max-width: 800px) {
    .navbar { padding: 16px 20px; }
    main { padding: 28px 20px 60px; }
    .detail { grid-template-columns: 1fr; }
    .portrait { max-width: 280px; }
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="logo">✦ ArkanaBuilds ✦</div>
    <div class="nav-right">
      <a href="./index.html">Inicio</a>
      <a href="./builds.html" class="active">Builds</a>
      <a href="./tier-list-zzz-local.html">Tier List</a>
    </div>
  </div>

  <main>
    <!-- Vista 1: galería -->
    <section id="gallery">
      <h1>Builds</h1>
      <p class="sub">Elige un personaje para ver su build.</p>
      <input type="search" id="search" class="search" placeholder="Buscar personaje..." autocomplete="off" aria-label="Buscar personaje">
      <p class="empty" id="empty" hidden>No se encontró ningún personaje.</p>
      <div class="grid" id="grid"></div>
    </section>

    <!-- Vista 2: build del personaje -->
    <section id="detail" hidden></section>
  </main>

<script>
  /* ============================================================
     1) LISTA DE PERSONAJES
     slug = nombre de la imagen sin "_card.webp"
     ============================================================ */
  const CHARS = [
    // Crit DPS
    ['claret','Claret','Crit DPS'], ['sigrid','Sigrid','Crit DPS'], ['ye-shunguang','Ye Shunguang','Crit DPS'],
    ['banyue','Banyu','Crit DPS'], ['billy-starlight','Billy Starlight','Crit DPS'], ['cissia','Cissia','Crit DPS'],
    ['pyrois','Pyloris','Crit DPS'], ['seed','Seed','Crit DPS'], ['yidhari','Yidhari','Crit DPS'], ['yixuan','Yixuan','Crit DPS'],
    ['anby-demara-soldier-0','Anby Demara','Crit DPS'], ['evelyn','Evelyn','Crit DPS'], ['harumasa','Harumasa','Crit DPS'],
    ['nekomata','Nekomata','Crit DPS'], ['orphie-and-magus','Orphie and Magus','Crit DPS'], ['soldier-11','Soldier 11','Crit DPS'],
    ['ellen','Ellen','Crit DPS'], ['hugo','Hugo','Crit DPS'], ['manato','Manato','Crit DPS'], ['zhu-yuan','Zhu Yuan','Crit DPS'],
    // Anomaly DPS
    ['phoenix','Phoenix','Anomaly DPS'], ['remielle','Remielle','Anomaly DPS'], ['velina','Velina','Anomaly DPS'],
    ['alice','Alice','Anomaly DPS'], ['aria','Aria','Anomaly DPS'], ['burnice','Burnice','Anomaly DPS'],
    ['miyabi','Miyabi','Anomaly DPS'], ['promeia','Promeia','Anomaly DPS'],
    ['grace-howard','Grace Howard','Anomaly DPS'], ['jane-doe','Jane Doe','Anomaly DPS'], ['piper','Piper','Anomaly DPS'],
    ['vivian','Vivian','Anomaly DPS'], ['yanagi','Yanagi','Anomaly DPS'],
    // Support
    ['dialyn','Dialyn','Support'], ['lucia','Lucia','Support'], ['nangong-yu','Nangong Yu','Support'], ['norma','Norma','Support'],
    ['roxy','Roxy','Support'], ['sunna','Sunna','Support'], ['ukinami-yuzuha','Ukinami Yuzuha','Support'],
    ['astra-yao','Astra Yao','Support'], ['koleda','Koleda','Support'], ['nicole-demara','Nicole Demara','Support'],
    ['rina','Rina','Support'], ['trigger','Trigger','Support'], ['zhao','Zhao','Support'],
    ['ju-fufu','Ju Fufu','Support'], ['lighter','Lighter','Support'], ['lycaon','Lycaon','Support'],
    ['pan-yinhu','Pan Yinhu','Support'], ['qingyi','Qingyi','Support']
  ];

  /* ============================================================
     2) SCREENSHOT DE LA BUILD
     Guarda la captura de cada personaje en la carpeta "builds"
     con el nombre del slug, por ejemplo: builds/claret.png
     ============================================================ */
  const buildImg = slug => `./builds/${slug}.png`;

  /* ============================================================ */
  const $ = id => document.getElementById(id);
  const img = slug => `./${slug}_card.webp`;
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

  function renderGrid() {
    const q = norm($('search').value);
    const list = CHARS
      .filter(c => norm(c[1]).includes(q) || norm(c[0]).includes(q))
      .map(([slug, name, role]) => `
        <a class="card" href="#${slug}">
          <img src="${img(slug)}" alt="${name}" loading="lazy">
          <span>${name}<small>${role}</small></span>
        </a>`).join('');
    $('grid').innerHTML = list;
    $('empty').hidden = list !== '';
  }

  function renderDetail(slug) {
    const c = CHARS.find(x => x[0] === slug);
    if (!c) return false;
    $('detail').innerHTML = `
      <a class="back" href="#">← Todos los personajes</a>
      <div class="detail">
        <div>
          <img class="portrait" src="${img(slug)}" alt="${c[1]}">
          <h1>${c[1]}</h1>
          <p class="sub">${c[2]}</p>
        </div>
        <div>
          <img class="shot" src="${buildImg(slug)}" alt="Build de ${c[1]}"
               onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'pending',textContent:'Build pendiente.'}))">
        </div>
      </div>`;
    return true;
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const showDetail = slug && renderDetail(slug);
    $('detail').hidden = !showDetail;
    $('gallery').hidden = !!showDetail;
    window.scrollTo(0, 0);
  }

  $('search').addEventListener('input', renderGrid);

  window.addEventListener('hashchange', route);
  renderGrid();
  route();

  try { if (localStorage.getItem('arkana-theme') === 'light') document.body.classList.add('light'); } catch (e) {}
</script>
</body>
</html>
