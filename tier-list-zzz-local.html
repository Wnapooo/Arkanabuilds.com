<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tier List — Zenless Zone Zero</title>
<style>
body {
  margin: 0;
  background: #0f1015;
}
table.tier-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-family: system-ui, -apple-system, sans-serif;
  background: transparent;
}
table.tier-table th {
  padding: 16px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: #11131b;
  border-bottom: 1px solid #1f222f;
  text-transform: uppercase;
}
table.tier-table td {
  padding: 20px 10px;
  vertical-align: top;
  border-right: 1px solid #1f222f;
  border-bottom: 1px solid #1f222f;
}
table.tier-table td:last-child {
  border-right: none;
}

.tier-label-cell {
  width: 50px;
  font-weight: 800;
  font-size: 16px;
  text-align: center;
  vertical-align: middle !important;
  border-right: 1px solid #1f222f;
}
.t0-label { background: #2a1111 !important; color: #ff4d4d; }
.t05-label { background: #22132b !important; color: #c084fc; }
.t1-label { background: #111b2a !important; color: #60a5fa; }

/* Contenedor vertical de los elementos */
.column-grid {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* Grupo flexible horizontal para el balance visual */
.row-flex {
  display: flex;
  gap: 16px;
}

/* El cuadro con personaje */
.char-box {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.char-box .char-img-wrap {
  width: 130px;
  height: 110px;
  background: #1c1e28;
  border-radius: 8px;
  overflow: hidden;
}
.char-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}
.char-box span {
  margin-top: 8px;
  color: #e0e0e8;
  font-size: 13px;
  text-align: center;
}

/* El cuadro en blanco estilo botón */
.empty-box {
  width: 130px;
  height: 110px;
  background: #1c1e28;
  border: 1px solid #2d3142;
  border-radius: 8px;
}
</style>
</head>
