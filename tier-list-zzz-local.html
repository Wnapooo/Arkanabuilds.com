<style>
body {
  margin: 0;
  background: #0f1015;
}
table.tier-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-family: system-ui, -apple-system, sans-serif;
  background: transparent;
}
table.tier-table th {
  padding: 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: #11131b;
  border-bottom: 1px solid #1f222f;
  text-transform: uppercase;
}
table.tier-table td {
  padding: 14px 12px;
  vertical-align: middle;
  border-right: 1px solid #1f222f;
  border-bottom: 1px solid #1f222f;
}
table.tier-table td:last-child {
  border-right: none;
}

.tier-label-cell {
  width: 50px;
  font-weight: 800;
  font-size: 15px;
  text-align: center;
  vertical-align: middle !important;
  border-right: 1px solid #1f222f;
}
.t0-label { background: #2a1111 !important; color: #ff4d4d; }
.t05-label { background: #22132b !important; color: #c084fc; }
.t1-label { background: #111b2a !important; color: #60a5fa; }
.t15-label { background: #0e1f2e !important; color: #38bdf8; }
.t2-label { background: #10231f !important; color: #2dd4bf; }
.t3-label { background: #13231a !important; color: #4ade80; }

/* Fila de iconos que se envuelve automáticamente */
.icon-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* Icono chico del personaje */
.char-icon {
  width: 72px;
  height: 72px;
  border-radius: 10px;
  overflow: hidden;
  background: #1c1e28;
  border: 1px solid #2d3142;
  flex-shrink: 0;
}
.char-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

/* Icono vacío para la columna T0 */
.empty-icon {
  width: 72px;
  height: 72px;
  border-radius: 10px;
  background: #1c1e28;
  border: 1px solid #2d3142;
}

/* ===== Navbar ===== */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid #1a1c23;
  font-family: system-ui, -apple-system, sans-serif;
}
.logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; color: #e5e7eb; }
.nav-right { display: flex; align-items: center; gap: 28px; }
.nav-right > a { color: #9ca3af; text-decoration: none; font-size: 14px; }
.nav-right > a.active { color: #818cf8; }
.social-icons { display: flex; align-items: center; gap: 14px; }
.icon-circle {
  width: 30px; height: 30px; border-radius: 50%;
  background: #1c1e27; border: 1px solid #2a2d38; opacity: .85;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; text-decoration: none; color: #e5e7eb;
  transition: opacity .15s ease, transform .15s ease;
}
.icon-circle:hover { opacity: 1; transform: translateY(-1px); }
@media (max-width: 800px) {
  .navbar { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
  .nav-right { gap: 16px; flex-wrap: wrap; }
}

/* ===== Barra lateral ===== */
.layout { display: flex; align-items: flex-start; }
.tier-main { flex: 1; min-width: 0; }
.sidebar {
  width: 220px; flex-shrink: 0; padding: 20px 14px;
  border-right: 1px solid #1a1c23; position: sticky; top: 0;
  font-family: system-ui, -apple-system, sans-serif;
}
.sidebar h2 { margin: 0 0 12px; padding: 0 10px; font-size: 13px; font-weight: 600; color: #8b8f99; }
.sidebar a {
  display: block; padding: 10px; margin-bottom: 4px; border-radius: 8px;
  color: #9ca3af; text-decoration: none; font-size: 14px;
}
.sidebar a:hover { background: #1c1e27; color: #e5e7eb; }
.sidebar a.active { background: #1e1b3a; color: #a5b4fc; }
@media (max-width: 800px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%; position: static; border-right: none; border-bottom: 1px solid #1a1c23;
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
  }
  .sidebar h2 { display: none; }
  .sidebar a { white-space: nowrap; margin-bottom: 0; }
}

/* ===== Modo editor (arrastrar y soltar) ===== */
.tier-main { transition: opacity .2s ease; }
html.loading .tier-main { opacity: 0; }
.icon-row { min-height: 72px; }
body.editing a.char-icon { cursor: grab; }
a.char-icon.dragging { opacity: .35; border-color: #818cf8; cursor: grabbing; }
.char-icon img { -webkit-user-drag: none; user-select: none; }
td.drop-active, .pool.drop-active { background: rgba(129,140,248,.06); }
.toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  padding: 10px 16px 0; font-family: system-ui, -apple-system, sans-serif;
}
.toolbar .hint { margin-right: auto; font-size: 12px; color: #a5b4fc; }
.toolbar button {
  background: #1c1e27; color: #cbd5e1; border: 1px solid #2a2d38; border-radius: 8px;
  padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: border-color .15s ease, color .15s ease;
}
.toolbar button:hover { border-color: #818cf8; color: #fff; }
#toast {
  position: fixed; bottom: 20px; right: 20px; background: #1e1b3a; color: #a5b4fc;
  border: 1px solid #3730a3; padding: 8px 14px; border-radius: 8px; font-size: 13px;
  font-family: system-ui, -apple-system, sans-serif; opacity: 0; transform: translateY(6px);
  transition: opacity .2s ease, transform .2s ease; pointer-events: none;
}
#toast.show { opacity: 1; transform: none; }

/* ===== Buscador y "Sin clasificar" (modo editor) ===== */
.pool[hidden] { display: none; }
.pool { padding: 0 16px 40px; font-family: system-ui, -apple-system, sans-serif; }
.divider { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #a5b4fc; border-top: 1px solid #1f222f; margin-top: 8px; }
.divider .pool-hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: #8b8f99; font-size: 12px; }
.divider button { margin-left: auto; background: #1c1e27; color: #cbd5e1; border: 1px solid #2a2d38; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
.divider button:hover { border-color: #818cf8; color: #fff; }
.pool .icon-row { padding: 6px; border: 1px dashed #2d3142; border-radius: 12px; min-height: 90px; }
.tl-search { position: relative; flex: 0 1 300px; }
.tl-search input { width: 100%; background: #14161d; color: #e5e7eb; border: 1px solid #2a2d38; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; }
.tl-search input:focus { outline: none; border-color: #818cf8; }
.tl-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20; max-height: 380px; overflow-y: auto; background: #14161d; border: 1px solid #2a2d38; border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.55); padding: 4px; }
.tl-results[hidden] { display: none; }
.tl-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: #e5e7eb; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.tl-opt:hover { background: #1e1b3a; }
.tl-opt img { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; object-position: top; background: #1c1e28; flex: none; }
.tl-opt small { display: block; color: #8b8f99; font-size: 11px; }
.tl-opt em { margin-left: auto; font-style: normal; font-size: 11px; color: #6b7280; }
.tl-opt.placed { opacity: .55; }
.tl-empty { padding: 12px; color: #8b8f99; font-size: 13px; }
a.char-icon.flash { outline: 2px solid #818cf8; outline-offset: 2px; animation: tlflash 1.4s ease; }
@keyframes tlflash { 0%,60% { box-shadow: 0 0 0 6px rgba(129,140,248,.45); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (max-width: 800px) { .tl-search { flex: 1 1 100%; order: 3; } }

/* ===== Adaptación a móvil ===== */
body.editing a.char-icon { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
@media (max-width: 800px) {
  .navbar { padding: 14px 16px; }
  .nav-right { width: 100%; justify-content: space-between; gap: 12px; }
  .nav-right > a { padding: 6px 2px; }
  .social-icons { gap: 10px; }
  .icon-circle { width: 34px; height: 34px; }

  /* Cada fila de tier se apila: etiqueta arriba, luego cada categoría debajo */
  table.tier-table, table.tier-table tbody, table.tier-table tr, table.tier-table td { display: block; width: 100%; }
  table.tier-table colgroup, table.tier-table thead { display: none; }
  table.tier-table tr { border-bottom: 1px solid #1f222f; }
  table.tier-table td { border-right: none; border-bottom: none; padding: 10px 14px; }
  table.tier-table td.tier-label-cell {
    width: 100%; padding: 8px 14px; text-align: left; font-size: 14px;
    border-right: none; border-bottom: 1px solid #1f222f;
  }
  table.tier-table td[data-label]::before {
    content: attr(data-label); display: block; margin-bottom: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--lbl, #8b8f99);
  }
  /* Categorías sin personajes se ocultan (en modo editor siguen visibles para soltar íconos) */
  body:not(.editing) table.tier-table td:has(> .icon-row:empty) { display: none; }

  .char-icon, .empty-icon { width: 58px; height: 58px; border-radius: 8px; }
  .icon-row { min-height: 58px; gap: 7px; }
  .divider { padding: 10px 14px; }
  .pool { padding: 12px 14px 24px; }

  .toolbar { flex-wrap: wrap; padding: 10px 14px 0; }
  .toolbar .hint { flex-basis: 100%; }
  .toolbar button { padding: 9px 14px; }
  #toast { left: 14px; right: 14px; bottom: 14px; text-align: center; }
}
</style>
<script>document.documentElement.classList.add('loading')</script>

          <div class="icon-row">
            <div class="empty-icon"></div>
          </div>
        </td>
        <!-- SUPPORT -->
        <td>
          <div class="icon-row">
            <div class="empty-icon"></div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- ================= SIN CLASIFICAR (se llena desde el buscador del modo editor) ================= -->
  <section class="pool" id="pool" hidden>
    <div class="divider">Sin clasificar <span class="pool-hint">Arrastra cada personaje a su tier</span><button type="button" id="btn-clear-pool">Vaciar</button></div>
    <div class="icon-row" id="pool-row"></div>
  </section>

    </main>
  </div>

<script>
/* Copia los títulos de columna (DPS, SOPORTE...) a cada celda para el diseño móvil */
(function () {
  var heads = Array.prototype.map.call(document.querySelectorAll('table.tier-table thead th'), function (th) {
    return { t: th.textContent.trim(), c: th.style.color || '' };
  });
  document.querySelectorAll('table.tier-table tr').forEach(function (tr) {
    Array.prototype.forEach.call(tr.children, function (td, i) {
      if (i === 0 || !heads[i] || !heads[i].t) return;
      td.setAttribute('data-label', heads[i].t);
      if (heads[i].c) td.style.setProperty('--lbl', heads[i].c);
    });
  });
})();
</script>
<div id="toast"></div>
<script>
(function () {
  var PAGE = document.body.getAttribute('data-page') || 'wuwa';
  var API = '/api/layout?page=' + encodeURIComponent(PAGE);
  var EDIT = /[?&]edit(=|&|$)/.test(location.search);
  var KEYSTORE = 'tierlist-admin-key';
  var SAFE = /^\.\/[\w\-.\/#]+$/;
  var rows = Array.prototype.slice.call(document.querySelectorAll('table.tier-table .icon-row'));
  var dragged = null, saveTimer = null;

  function serialize() {
    return rows.map(function (r) {
      return Array.prototype.map.call(r.querySelectorAll('a.char-icon'), function (a) {
        var img = a.querySelector('img');
        return { h: a.getAttribute('href'), t: a.getAttribute('title') || (img && img.getAttribute('alt')) || a.textContent.trim() || '', s: img ? img.getAttribute('src') : (a.getAttribute('data-src') || '') };
      });
    });
  }
  function hash(str) { var h = 5381; for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return String(h); }
  // Hash del conjunto de personajes (no depende de en qué celda estén)
  var BASE = (function () {
    var items = [];
    serialize().forEach(function (r) { r.forEach(function (i) { items.push(i.h + '|' + i.s); }); });
    items.sort(); return hash(items.join('\n'));
  })();

  function build(it) {
    var a = document.createElement('a');
    a.className = 'char-icon'; a.href = it.h; a.title = it.t;
    var img = document.createElement('img');
    img.src = it.s; img.alt = it.t; img.loading = 'lazy'; img.draggable = false;
    img.onerror = function () {
      if (!this.dataset.fb && /^\.\/[\w\-]+\.webp$/.test(it.s)) { this.dataset.fb = 1; this.src = it.s.replace('.webp', '_card.webp'); return; }
      a.setAttribute('data-src', it.s); this.replaceWith(this.alt);
    };
    a.appendChild(img);
    return a;
  }
  function applyLayout(d) {
    if (!d || d.base !== BASE || !Array.isArray(d.layout) || d.layout.length !== rows.length) return false;
    var ok = d.layout.every(function (row) {
      return Array.isArray(row) && row.every(function (it) {
        return it && typeof it.h === 'string' && SAFE.test(it.h) && typeof it.s === 'string' && SAFE.test(it.s) && typeof it.t === 'string';
      });
    });
    if (!ok) return false;
    rows.forEach(function (r, i) {
      r.innerHTML = '';
      d.layout[i].forEach(function (it) { r.appendChild(build(it)); });
    });
    return true;
  }
  function syncPool() {
    var p = document.getElementById('pool'), r = document.getElementById('pool-row');
    if (p && r) p.hidden = !(document.body.classList.contains('editing') || r.querySelector('a.char-icon'));
  }
  function toast(msg, ms) {
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 1800);
  }

  var finished = false;
  function finish() { if (finished) return; finished = true; document.documentElement.classList.remove('loading'); }
  setTimeout(finish, 2500);

  var stale = false;
  fetch(API, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && !applyLayout(d)) stale = true; })
    .catch(function () {})
    .then(function () {
      finish();
      if (EDIT) initEditor();
      syncPool();
    });

  /* ---------- Modo editor ---------- */
  function getKey(force) {
    var k = localStorage.getItem(KEYSTORE);
    if (!k || force) {
      k = prompt('Clave de administrador:');
      if (k) localStorage.setItem(KEYSTORE, k); else k = null;
    }
    return k;
  }
  function doSave(retry) {
    var key = getKey(retry);
    if (!key) { toast('Sin clave: no se guardó'); return; }
    fetch(API, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ base: BASE, layout: serialize() })
    }).then(function (r) {
      if (r.status === 401) {
        localStorage.removeItem(KEYSTORE);
        if (!retry) return doSave(true);
        toast('Clave incorrecta'); return;
      }
      if (r.ok) { toast('Guardado para todos ✓'); return; }
      lastSent = null;
      return r.text().then(function (t) {
        var m = ''; try { m = JSON.parse(t).error || ''; } catch (e) { m = String(t).slice(0, 120); }
        toast('Error al guardar (' + r.status + ')' + (m ? ': ' + m : ''), 8000);
      });
    }).catch(function () { lastSent = null; toast('Error de red'); });
  }
  var lastSent = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var cur = JSON.stringify(serialize());
      if (cur === lastSent) return;
      lastSent = cur;       lastSent = cur; doSave(false);
    }, 1200);
  }
  /* "Sin clasificar" es una zona de trabajo: se guarda solo en este navegador, no en el servidor */
  var POOLKEY = 'tierlist-pool:' + PAGE;
  function savePool() {
    var r = document.getElementById('pool-row'); if (!r) return;
    var items = Array.prototype.map.call(r.querySelectorAll('a.char-icon'), function (a) {
      var img = a.querySelector('img');
      return { h: a.getAttribute('href'), t: a.getAttribute('title') || '', s: img ? img.getAttribute('src') : (a.getAttribute('data-src') || '') };
    });
    try { localStorage.setItem(POOLKEY, JSON.stringify(items)); } catch (e) {}
  }
  function loadPool() {
    var r = document.getElementById('pool-row'), items = [];
    try { items = JSON.parse(localStorage.getItem(POOLKEY) || '[]'); } catch (e) {}
    if (!r || !Array.isArray(items)) return;
    items.forEach(function (it) {
      if (!it || !SAFE.test(it.h || '') || !SAFE.test(it.s || '')) return;
      if (document.querySelector('a.char-icon[href="' + it.h + '"]')) return;
      var a = build({ h: it.h, t: String(it.t || ''), s: it.s });
      a.setAttribute('draggable', 'true'); r.appendChild(a);
    });
  }

  function place(row, x, y) {
    Array.prototype.forEach.call(row.querySelectorAll('.empty-icon'), function (n) { n.remove(); });
    var kids = Array.prototype.filter.call(row.children, function (c) { return c !== dragged && c.classList.contains('char-icon'); });
    var ref = null;
    if (kids.length) {
      var best = null, bd = Infinity, before = true;
      kids.forEach(function (c) {
        var b = c.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
        var d = Math.pow(x - cx, 2) + Math.pow((y - cy) * 2, 2);
        if (d < bd) { bd = d; best = c; before = x < cx; }
      });
      ref = before ? best : best.nextSibling;
    }
    if (dragged.parentNode === row && dragged.nextSibling === ref) return;
    row.insertBefore(dragged, ref);
  }

  function initEditor() {
    document.body.classList.add('editing');
    lastSent = JSON.stringify(serialize());
    loadPool();
    var bar = document.createElement('div');
    bar.className = 'toolbar';
    bar.innerHTML = '<span class="hint">Modo editor: lo que muevas se publica para todos.' +
      (stale ? ' (El orden guardado era de una versión anterior; se publicará de nuevo al mover algo.)' : '') +
      '</span><button type="button" id="btn-reset">↺ Restablecer</button><button type="button" id="btn-exit">Salir del editor</button>';
    var main = document.querySelector('.tier-main');
    main.insertBefore(bar, main.firstChild);

    function makeDraggable() {
      document.querySelectorAll('a.char-icon').forEach(function (a) {
        a.setAttribute('draggable', 'true');
        var img = a.querySelector('img'); if (img) img.draggable = false;
      });
    }
    makeDraggable();

    document.addEventListener('dragstart', function (e) {
      var a = e.target.closest && e.target.closest('a.char-icon');
      if (!a) return;
      dragged = a;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', a.title);
      setTimeout(function () { a.classList.add('dragging'); }, 0);
    });
    document.addEventListener('dragover', function (e) {
      if (!dragged) return;
      var zone = e.target.closest && e.target.closest('td, .pool');
      var row = zone && zone.querySelector('.icon-row');
      document.querySelectorAll('.drop-active').forEach(function (z) { if (z !== zone) z.classList.remove('drop-active'); });
      if (!row) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      zone.classList.add('drop-active');
      place(row, e.clientX, e.clientY);
    });
    document.addEventListener('drop', function (e) { if (dragged) e.preventDefault(); });
    document.addEventListener('dragend', function () {
      if (!dragged) return;
      dragged.classList.remove('dragging'); dragged = null;
      document.querySelectorAll('.drop-active').forEach(function (z) { z.classList.remove('drop-active'); });
      syncPool(); savePool(); save();
    });

    /* ---------- Soporte táctil: mantén pulsado un ícono ~0.35 s y arrástralo ---------- */
    var tTimer = null, tActive = false, tStart = null, tBefore = '', tBlockClick = false;
    function clearZones() {
      document.querySelectorAll('.drop-active').forEach(function (z) { z.classList.remove('drop-active'); });
    }
    document.addEventListener('touchstart', function (e) {
      var a = e.target.closest && e.target.closest('a.char-icon');
      if (!a || e.touches.length !== 1) return;
      var t = e.touches[0];
      tStart = { x: t.clientX, y: t.clientY };
      clearTimeout(tTimer);
      tTimer = setTimeout(function () {
        tActive = true; dragged = a; tBefore = JSON.stringify(serialize());
        a.classList.add('dragging');
        if (navigator.vibrate) navigator.vibrate(15);
      }, 350);
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      var t = e.touches[0];
      if (!tActive) {
        // Si el dedo se mueve antes de tiempo, es un scroll normal: cancelar el arrastre
        if (tStart && Math.abs(t.clientX - tStart.x) + Math.abs(t.clientY - tStart.y) > 10) { clearTimeout(tTimer); tStart = null; }
        return;
      }
      e.preventDefault();
      var el = document.elementFromPoint(t.clientX, t.clientY);
      var zone = el && el.closest && el.closest('td, .pool');
      var row = zone && zone.querySelector('.icon-row');
      clearZones();
      if (row) { zone.classList.add('drop-active'); place(row, t.clientX, t.clientY); }
      if (t.clientY < 80) window.scrollBy(0, -14); else if (t.clientY > window.innerHeight - 80) window.scrollBy(0, 14);
    }, { passive: false });
    function tEnd() {
      clearTimeout(tTimer); tStart = null;
      if (!tActive) return;
      tActive = false; tBlockClick = true;
      setTimeout(function () { tBlockClick = false; }, 400);
      if (dragged) { dragged.classList.remove('dragging'); dragged = null; }
      clearZones();
      savePool();
      if (JSON.stringify(serialize()) !== tBefore) save();
    }
    document.addEventListener('touchend', tEnd);
    document.addEventListener('touchcancel', tEnd);
    document.addEventListener('click', function (e) {
      if (tBlockClick) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    document.addEventListener('contextmenu', function (e) {
      if ('ontouchstart' in window && e.target.closest && e.target.closest('a.char-icon')) e.preventDefault();
    });

    document.getElementById('btn-reset').addEventListener('click', function () {
      if (!confirm('¿Volver al orden original del archivo para todos los visitantes?')) return;
      var key = getKey(false); if (!key) return;
      fetch(API, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + key } }).then(function (r) {
        if (r.status === 401) { localStorage.removeItem(KEYSTORE); toast('Clave incorrecta'); return; }
        location.reload();
      }).catch(function () { toast('Error de red'); });
    });
    document.getElementById('btn-exit').addEventListener('click', function () {
      location.href = location.pathname;
    });

    /* ---------- Buscador de personajes + "Sin clasificar" ---------- */
    var CAT = [
    ['claret','Claret','Crit DPS'],
    ['sigrid','Sigrid','Crit DPS'],
    ['ye-shunguang','Ye Shunguang','Crit DPS'],
    ['banyue','Banyu','Crit DPS'],
    ['billy-starlight','Billy Starlight','Crit DPS'],
    ['cissia','Cissia','Crit DPS'],
    ['pyrois','Pyrois','Crit DPS'],
    ['seed','Seed','Crit DPS'],
    ['yidhari','Yidhari','Crit DPS'],
    ['yixuan','Yixuan','Crit DPS'],
    ['anby-demara-soldier-0','Soldier 0','Crit DPS'],
    ['evelyn','Evelyn','Crit DPS'],
    ['harumasa','Harumasa','Crit DPS'],
    ['nekomata','Nekomata','Crit DPS'],
    ['orphie-and-magus','Orphie and Magus','Crit DPS'],
    ['soldier-11','Soldier 11','Crit DPS'],
    ['ellen','Ellen','Crit DPS'],
    ['hugo','Hugo','Crit DPS'],
    ['manato','Manato','Crit DPS'],
    ['zhu-yuan','Zhu Yuan','Crit DPS'],
    ['sunbringer','Sunbringer','Crit DPS'],
    ['phoenix','Phoenix','Anomaly DPS'],
    ['remielle','Remielle','Anomaly DPS'],
    ['velina','Velina','Anomaly DPS'],
    ['alice','Alice','Anomaly DPS'],
    ['aria','Aria','Anomaly DPS'],
    ['burnice','Burnice','Anomaly DPS'],
    ['miyabi','Miyabi','Anomaly DPS'],
    ['promeia','Promeia','Anomaly DPS'],
    ['grace-howard','Grace Howard','Anomaly DPS'],
    ['jane-doe','Jane Doe','Anomaly DPS'],
    ['piper','Piper','Anomaly DPS'],
    ['vivian','Vivian','Anomaly DPS'],
    ['yanagi','Yanagi','Anomaly DPS'],
    ['kafka-zzz','Kafka','Anomaly DPS'],
    ['dialyn','Dialyn','Support'],
    ['lucia','Lucia','Support'],
    ['nangong-yu','Nangong Yu','Support'],
    ['norma','Norma','Support'],
    ['roxy','Roxy','Support'],
    ['sunna','Sunna','Support'],
    ['ukinami-yuzuha','Ukinami Yuzuha','Support'],
    ['astra-yao','Astra Yao','Support'],
    ['koleda','Koleda','Support'],
    ['nicole-demara','Nicole Demara','Support'],
    ['rina','Rina','Support'],
    ['trigger','Trigger','Support'],
    ['zhao','Zhao','Support'],
    ['ju-fufu','Ju Fufu','Support'],
    ['lighter','Lighter','Support'],
    ['lycaon','Lycaon','Support'],
    ['pan-yinhu','Pan Yinhu','Support'],
    ['qingyi','Qingyi','Support'],
    ['robin-zzz','Robin','Support']
  ];
    var wrap = document.createElement('div');
    wrap.className = 'tl-search';
    wrap.innerHTML = '<input type="search" id="tl-q" placeholder="Buscar personaje (' + CAT.length + ')..." autocomplete="off"><div class="tl-results" id="tl-res" hidden></div>';
    bar.insertBefore(wrap, document.getElementById('btn-reset'));
    var q = wrap.querySelector('input'), res = wrap.querySelector('.tl-results'), poolRow = document.getElementById('pool-row');
    function norm(t) { return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
    function linkOf(slug) { return document.querySelector('a.char-icon[href="./builds.html#' + slug + '"]'); }
    function renderRes() {
      var t = norm(q.value), list = CAT.filter(function (c) { return !t || norm(c[1]).indexOf(t) > -1 || c[0].indexOf(t) > -1; });
      res.innerHTML = '';
      if (!list.length) { res.innerHTML = '<div class="tl-empty">Sin resultados</div>'; return; }
      list.forEach(function (c) {
        var a = linkOf(c[0]), inPool = a && poolRow.contains(a);
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'tl-opt' + (a ? ' placed' : ''); b.setAttribute('data-s', c[0]);
        var im = document.createElement('img'); im.src = './' + c[0] + '.webp'; im.alt = ''; im.loading = 'lazy';
        im.onerror = function () { if (!this.dataset.fb) { this.dataset.fb = 1; this.src = './' + c[0] + '_card.webp'; } else this.style.visibility = 'hidden'; };
        var tx = document.createElement('span'); tx.textContent = c[1];
        var sm = document.createElement('small'); sm.textContent = c[2]; tx.appendChild(sm);
        b.appendChild(im); b.appendChild(tx);
        if (a) { var em = document.createElement('em'); em.textContent = inPool ? 'sin clasificar' : 'ya en tier list'; b.appendChild(em); }
        res.appendChild(b);
      });
    }
    function pick(slug) {
      var c = CAT.filter(function (x) { return x[0] === slug; })[0]; if (!c) return;
      var a = linkOf(slug);
      if (!a) {
        a = build({ h: './builds.html#' + slug, t: c[1], s: './' + slug + '.webp' });
        a.setAttribute('draggable', 'true');
        poolRow.appendChild(a); syncPool(); savePool();
        toast(c[1] + ' → Sin clasificar');
      }
      a.scrollIntoView({ behavior: 'smooth', block: 'center' });
      a.classList.remove('flash'); void a.offsetWidth; a.classList.add('flash');
      setTimeout(function () { a.classList.remove('flash'); }, 1500);
      renderRes();
    }
    q.addEventListener('focus', function () { res.hidden = false; renderRes(); });
    q.addEventListener('input', function () { res.hidden = false; renderRes(); });
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { res.hidden = true; q.blur(); }
      if (e.key === 'Enter') { var f = res.querySelector('.tl-opt:not(.placed)') || res.querySelector('.tl-opt'); if (f) pick(f.getAttribute('data-s')); }
    });
    res.addEventListener('mousedown', function (e) { e.preventDefault(); });
    res.addEventListener('click', function (e) { var o = e.target.closest('.tl-opt'); if (o) pick(o.getAttribute('data-s')); });
    document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) res.hidden = true; });
    document.getElementById('btn-clear-pool').addEventListener('click', function () {
      if (!poolRow.querySelector('a.char-icon')) return;
      if (!confirm('¿Quitar todos los personajes de "Sin clasificar"?')) return;
      poolRow.innerHTML = ''; savePool(); toast('Sin clasificar vaciado');
    });
  }
})();
</script>
