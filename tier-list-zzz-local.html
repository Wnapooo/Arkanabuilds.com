<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tier List — Zenless Zone Zero</title>
<style>
body {
  margin: 0;
  background: #0f1015;
}
table.tier-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-family: system-ui, -apple-system, sans-serif;
  background: transparent;
}
table.tier-table th {
  padding: 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: #11131b;
  border-bottom: 1px solid #1f222f;
  text-transform: uppercase;
}
table.tier-table td {
  padding: 14px 12px;
  vertical-align: middle;
  border-right: 1px solid #1f222f;
  border-bottom: 1px solid #1f222f;
}
table.tier-table td:last-child {
  border-right: none;
}

.tier-label-cell {
  width: 50px;
  font-weight: 800;
  font-size: 15px;
  text-align: center;
  vertical-align: middle !important;
  border-right: 1px solid #1f222f;
}
.t0-label { background: #2a1111 !important; color: #ff4d4d; }
.t05-label { background: #22132b !important; color: #c084fc; }
.t1-label { background: #111b2a !important; color: #60a5fa; }
.t15-label { background: #0e1f2e !important; color: #38bdf8; }

/* Fila de iconos que se envuelve automáticamente */
.icon-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* Icono chico del personaje */
.char-icon {
  width: 52px;
  height: 52px;
  border-radius: 8px;
  overflow: hidden;
  background: #1c1e28;
  border: 1px solid #2d3142;
  flex-shrink: 0;
}
.char-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

/* Icono vacío para la columna T0 */
.empty-icon {
  width: 52px;
  height: 52px;
  border-radius: 8px;
  background: #1c1e28;
  border: 1px solid #2d3142;
}
</style>
</head>
