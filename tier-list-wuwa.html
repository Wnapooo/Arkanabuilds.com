<style>
body {
  margin: 0;
  background: #0f1015;
}
table.tier-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-family: system-ui, -apple-system, sans-serif;
  background: transparent;
}
table.tier-table th {
  padding: 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: #11131b;
  border-bottom: 1px solid #1f222f;
  text-transform: uppercase;
}
table.tier-table td {
  padding: 14px 12px;
  vertical-align: middle;
  border-right: 1px solid #1f222f;
  border-bottom: 1px solid #1f222f;
}
table.tier-table td:last-child {
  border-right: none;
}

.tier-label-cell {
  width: 50px;
  font-weight: 800;
  font-size: 15px;
  text-align: center;
  vertical-align: middle !important;
  border-right: 1px solid #1f222f;
}
.t0-label { background: #2a1111 !important; color: #ff4d4d; }
.t05-label { background: #22132b !important; color: #c084fc; }
.t1-label { background: #111b2a !important; color: #60a5fa; }
.t15-label { background: #0e1f2e !important; color: #38bdf8; }
.t3-label { background: #13231a !important; color: #4ade80; }
.t2-label { background: #10231f !important; color: #2dd4bf; }

.divider { display:flex; align-items:center; gap:14px; padding:10px 16px; font-family: system-ui, -apple-system, sans-serif; font-size:13px; font-weight:800; letter-spacing:1px; color:#818cf8; }
.divider::before, .divider::after { content:""; flex:1; height:1px; background:#2a2d38; }
.pool { padding: 14px 16px 24px; }

/* Fila de iconos que se envuelve automáticamente */
.icon-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* Icono chico del personaje */
.char-icon {
  width: 68px;
  height: 68px;
  border-radius: 8px;
  overflow: hidden;
  background: #1c1e28;
  border: 1px solid #2d3142;
  flex-shrink: 0;
}
.char-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

a.char-icon { display: block; transition: transform .15s ease, border-color .15s ease; }
a.char-icon:hover { transform: translateY(-2px); border-color: #818cf8; }

/* Icono vacío para la columna T0 */
.empty-icon {
  width: 68px;
  height: 68px;
  border-radius: 8px;
  background: #1c1e28;
  border: 1px solid #2d3142;
}

/* ===== Navbar ===== */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid #1a1c23;
  font-family: system-ui, -apple-system, sans-serif;
}
.logo { font-weight: 600; font-size: 15px; letter-spacing: .5px; color: #e5e7eb; }
.nav-right { display: flex; align-items: center; gap: 28px; }
.nav-right > a { color: #9ca3af; text-decoration: none; font-size: 14px; }
.nav-right > a.active { color: #818cf8; }
.social-icons { display: flex; align-items: center; gap: 14px; }
.icon-circle {
  width: 30px; height: 30px; border-radius: 50%;
  background: #1c1e27; border: 1px solid #2a2d38; opacity: .85;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; text-decoration: none; color: #e5e7eb;
  transition: opacity .15s ease, transform .15s ease;
}
.icon-circle:hover { opacity: 1; transform: translateY(-1px); }
@media (max-width: 800px) {
  .navbar { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
  .nav-right { gap: 16px; flex-wrap: wrap; }
}

/* ===== Barra lateral ===== */
.layout { display: flex; align-items: flex-start; }
.tier-main { flex: 1; min-width: 0; }
.sidebar {
  width: 220px; flex-shrink: 0; padding: 20px 14px;
  border-right: 1px solid #1a1c23; position: sticky; top: 0;
  font-family: system-ui, -apple-system, sans-serif;
}
.sidebar h2 { margin: 0 0 12px; padding: 0 10px; font-size: 13px; font-weight: 600; color: #8b8f99; }
.sidebar a {
  display: block; padding: 10px; margin-bottom: 4px; border-radius: 8px;
  color: #9ca3af; text-decoration: none; font-size: 14px;
}
.sidebar a:hover { background: #1c1e27; color: #e5e7eb; }
.sidebar a.active { background: #1e1b3a; color: #a5b4fc; }
@media (max-width: 800px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%; position: static; border-right: none; border-bottom: 1px solid #1a1c23;
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
  }
  .sidebar h2 { display: none; }
  .sidebar a { white-space: nowrap; margin-bottom: 0; }
}

/* ===== Modo editor (arrastrar y soltar) ===== */
.tier-main { transition: opacity .2s ease; }
html.loading .tier-main { opacity: 0; }
.icon-row { min-height: 68px; }
body.editing a.char-icon { cursor: grab; }
a.char-icon.dragging { opacity: .35; border-color: #818cf8; cursor: grabbing; }
.char-icon img { -webkit-user-drag: none; user-select: none; }
td.drop-active, .pool.drop-active { background: rgba(129,140,248,.06); }
.toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  padding: 10px 16px 0; font-family: system-ui, -apple-system, sans-serif;
}
.toolbar .hint { margin-right: auto; font-size: 12px; color: #a5b4fc; }
.toolbar button {
  background: #1c1e27; color: #cbd5e1; border: 1px solid #2a2d38; border-radius: 8px;
  padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: border-color .15s ease, color .15s ease;
}
.toolbar button:hover { border-color: #818cf8; color: #fff; }
.toolbar input { background: #1c1e27; color: #e5e7eb; border: 1px solid #2a2d38; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; min-width: 180px; }
.toolbar input:focus { outline: none; border-color: #818cf8; }
#trash { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 24px); width: min(420px, 82vw); padding: 18px 16px; text-align: center;
  border: 2px dashed #ef4444; border-radius: 12px; background: rgba(42,17,17,.94); color: #fca5a5; font: 600 14px system-ui, -apple-system, sans-serif;
  opacity: 0; pointer-events: none; transition: opacity .15s ease, transform .15s ease, background .15s ease; z-index: 60; }
body.drag-active #trash { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
#trash.over { background: #7f1d1d; color: #fff; border-color: #fca5a5; }
#toast {
  position: fixed; bottom: 20px; right: 20px; background: #1e1b3a; color: #a5b4fc;
  border: 1px solid #3730a3; padding: 8px 14px; border-radius: 8px; font-size: 13px;
  font-family: system-ui, -apple-system, sans-serif; opacity: 0; transform: translateY(6px);
  transition: opacity .2s ease, transform .2s ease; pointer-events: none;
}
#toast.show { opacity: 1; transform: none; }

/* ===== Adaptación a móvil ===== */
body.editing a.char-icon { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
@media (max-width: 800px) {
  .navbar { padding: 14px 16px; }
  .nav-right { width: 100%; justify-content: space-between; gap: 12px; }
  .nav-right > a { padding: 6px 2px; }
  .social-icons { gap: 10px; }
  .icon-circle { width: 34px; height: 34px; }

  /* Cada fila de tier se apila: etiqueta arriba, luego cada categoría debajo */
  table.tier-table, table.tier-table tbody, table.tier-table tr, table.tier-table td { display: block; width: 100%; }
  table.tier-table colgroup, table.tier-table thead { display: none; }
  table.tier-table tr { border-bottom: 1px solid #1f222f; }
  table.tier-table td { border-right: none; border-bottom: none; padding: 10px 14px; }
  table.tier-table td.tier-label-cell {
    width: 100%; padding: 8px 14px; text-align: left; font-size: 14px;
    border-right: none; border-bottom: 1px solid #1f222f;
  }
  table.tier-table td[data-label]::before {
    content: attr(data-label); display: block; margin-bottom: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--lbl, #8b8f99);
  }
  /* Categorías sin personajes se ocultan (en modo editor siguen visibles para soltar íconos) */
  body:not(.editing) table.tier-table td:has(> .icon-row:empty) { display: none; }

  .char-icon, .empty-icon { width: 58px; height: 58px; border-radius: 8px; }
  .icon-row { min-height: 58px; gap: 7px; }
  .divider { padding: 10px 14px; }
  .pool { padding: 12px 14px 24px; }

  .toolbar { flex-wrap: wrap; padding: 10px 14px 0; }
  .toolbar .hint { flex-basis: 100%; }
  .toolbar button { padding: 9px 14px; }
  #toast { left: 14px; right: 14px; bottom: 14px; text-align: center; }
}
</style>

<script>
/* Copia los títulos de columna (DPS, SOPORTE...) a cada celda para el diseño móvil */
(function () {
  var heads = Array.prototype.map.call(document.querySelectorAll('table.tier-table thead th'), function (th) {
    return { t: th.textContent.trim(), c: th.style.color || '' };
  });
  document.querySelectorAll('table.tier-table tr').forEach(function (tr) {
    Array.prototype.forEach.call(tr.children, function (td, i) {
      if (i === 0 || !heads[i] || !heads[i].t) return;
      td.setAttribute('data-label', heads[i].t);
      if (heads[i].c) td.style.setProperty('--lbl', heads[i].c);
    });
  });
})();
</script>
<div id="toast"></div>
<script>
(function () {
  var PAGE = document.body.getAttribute('data-page') || 'wuwa';
  var API = '/api/layout?page=' + encodeURIComponent(PAGE);
  var EDIT = /[?&]edit(=|&|$)/.test(location.search);
  var KEYSTORE = 'tierlist-admin-key';
  var SAFE = /^\.\/[\w\-.\/#]+$/;
  var SAFE_SRC = /^(\.\/[\w\-.\/#]+|https:\/\/cdn\.prydwen\.gg\/images\/ww\/characters\/[\w\-.]+)$/;
  var CDN = 'https://cdn.prydwen.gg/images/ww/characters/';
  /* El servidor solo acepta rutas locales (./...): los iconos del CDN se guardan como ./prydwen/<archivo> y se convierten al cargar */
  function enc(s) { return s.indexOf(CDN) === 0 ? './prydwen/' + s.slice(CDN.length) : s; }
  function dec(s) { return s.indexOf('./prydwen/') === 0 ? CDN + s.slice(10) : s; }
  var rows = Array.prototype.slice.call(document.querySelectorAll('.icon-row'));
  var dragged = null, saveTimer = null;

  function serialize() {
    return rows.map(function (r) {
      return Array.prototype.map.call(r.querySelectorAll('a.char-icon'), function (a) {
        var img = a.querySelector('img');
        return { h: a.getAttribute('href'), t: a.getAttribute('title') || '', s: enc(img ? img.getAttribute('src') : (a.getAttribute('data-src') || '')) };
      });
    });
  }
  function hash(str) { var h = 5381; for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return String(h); }
  // Hash del conjunto de personajes (no depende de en qué celda estén)
  var BASE = (function () {
    var items = [];
    serialize().forEach(function (r) { r.forEach(function (i) { items.push(i.h + '|' + i.s); }); });
    items.sort(); return hash(items.join('\n'));
  })();

  function build(it) {
    var a = document.createElement('a');
    a.className = 'char-icon'; a.href = it.h; a.title = it.t;
    var img = document.createElement('img');
    img.referrerPolicy = 'no-referrer'; img.src = dec(it.s); img.alt = it.t; img.loading = 'lazy'; img.draggable = false;
    a.appendChild(img);
    return a;
  }
  function applyLayout(d) {
    if (!d || d.base !== BASE || !Array.isArray(d.layout) || d.layout.length !== rows.length) return false;
    var ok = d.layout.every(function (row) {
      return Array.isArray(row) && row.every(function (it) {
        return it && typeof it.h === 'string' && SAFE.test(it.h) && typeof it.s === 'string' && SAFE_SRC.test(it.s) && typeof it.t === 'string';
      });
    });
    if (!ok) return false;
    rows.forEach(function (r, i) {
      r.innerHTML = '';
      d.layout[i].forEach(function (it) { r.appendChild(build(it)); });
    });
    return true;
  }
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  var finished = false;
  function finish() { if (finished) return; finished = true; document.documentElement.classList.remove('loading'); }
  setTimeout(finish, 2500);

  var stale = false;
  fetch(API, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && !applyLayout(d)) stale = true; })
    .catch(function () {})
    .then(function () {
      finish();
      if (EDIT) initEditor();
    });

  /* ---------- Modo editor ---------- */
  function getKey(force) {
    var k = localStorage.getItem(KEYSTORE);
    if (!k || force) {
      k = prompt('Clave de administrador:');
      if (k) localStorage.setItem(KEYSTORE, k); else k = null;
    }
    return k;
  }
  function doSave(retry) {
    var key = getKey(retry);
    if (!key) { toast('Sin clave: no se guardó'); return; }
    fetch(API, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ base: BASE, layout: serialize() })
    }).then(function (r) {
      if (r.status === 401) {
        localStorage.removeItem(KEYSTORE);
        if (!retry) return doSave(true);
        toast('Clave incorrecta'); return;
      }
      toast(r.ok ? 'Guardado para todos ✓' : 'Error al guardar (' + r.status + ')');
    }).catch(function () { toast('Error de red'); });
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { doSave(false); }, 300); }

  function place(row, x, y) {
    var kids = Array.prototype.filter.call(row.children, function (c) { return c !== dragged; });
    var ref = null;
    if (kids.length) {
      var best = null, bd = Infinity, before = true;
      kids.forEach(function (c) {
        var b = c.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
        var d = Math.pow(x - cx, 2) + Math.pow((y - cy) * 2, 2);
        if (d < bd) { bd = d; best = c; before = x < cx; }
      });
      ref = before ? best : best.nextSibling;
    }
    if (dragged.parentNode === row && dragged.nextSibling === ref) return;
    row.insertBefore(dragged, ref);
  }

  var CATALOG = [
    { t: 'Rover (Aero)', h: './builds.html#rover-aero', s: './rover_card.webp' },
    { t: 'Chixia', h: './builds.html#chixia', s: CDN + 'chixia_icon.webp' },
    { t: 'Baizhi', h: './builds.html#baizhi', s: CDN + 'baizhi_icon.webp' },
    { t: 'Danjin', h: './builds.html#danjin', s: CDN + 'danjin_icon.webp' },
    { t: 'Taoqi', h: './builds.html#taoqi', s: CDN + 'taoqi_icon.webp' },
    { t: 'Yuanwu', h: './builds.html#yuanwu', s: CDN + 'yuanwu_icon.webp' },
    { t: 'Aalto', h: './builds.html#aalto', s: CDN + 'aalto_icon.webp' }
  ];
  function addHtml() {
    var present = {};
    Array.prototype.forEach.call(document.querySelectorAll('a.char-icon'), function (a) { present[(a.title || '').toLowerCase()] = 1; });
    var opts = CATALOG.filter(function (c) { return !present[c.t.toLowerCase()]; })
      .map(function (c) { return '<option value="' + c.t + '">'; }).join('');
    return '<input id="add-name" list="add-list" placeholder="Agregar personaje…" autocomplete="off"><datalist id="add-list">' + opts + '</datalist>' +
      '<button type="button" id="btn-add">+ Agregar</button>';
  }

  function initEditor() {
    document.body.classList.add('editing');
    var bar = document.createElement('div');
    bar.className = 'toolbar';
    bar.innerHTML = '<span class="hint">Modo editor: lo que muevas se publica para todos.' +
      (stale ? ' (El orden guardado era de una versión anterior; se publicará de nuevo al mover algo.)' : '') +
      '</span>' + addHtml() + '<button type="button" id="btn-reset">↺ Restablecer</button><button type="button" id="btn-exit">Salir del editor</button>';
    var main = document.querySelector('.tier-main');
    main.insertBefore(bar, main.firstChild);

    function makeDraggable() {
      document.querySelectorAll('a.char-icon').forEach(function (a) {
        a.setAttribute('draggable', 'true');
        var img = a.querySelector('img'); if (img) img.draggable = false;
      });
    }
    makeDraggable();

    /* ---------- Cuadro para quitar un icono: arrástralo hasta aquí ---------- */
    var trashEl = document.createElement('div');
    trashEl.id = 'trash'; trashEl.textContent = '🗑️ Suelta aquí para quitar';
    document.body.appendChild(trashEl);
    function endDragUi() { document.body.classList.remove('drag-active'); trashEl.classList.remove('over'); }
    function removeDragged() {
      var nm = dragged.title;
      dragged.remove(); dragged = null; endDragUi();
      document.querySelectorAll('.drop-active').forEach(function (z) { z.classList.remove('drop-active'); });
      save(); toast('Quitado: ' + nm);
    }

    /* ---------- Buscador: escribe un nombre y se agrega a "Sin clasificar" ---------- */
    document.getElementById('btn-add').addEventListener('click', addByName);
    document.getElementById('add-name').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addByName(); } });
    function slugOf(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
    function addByName() {
      var inp = document.getElementById('add-name'), name = inp.value.trim();
      if (!name) return;
      var low = name.toLowerCase();
      var exists = Array.prototype.some.call(document.querySelectorAll('a.char-icon'), function (a) { return (a.title || '').toLowerCase() === low; });
      if (exists) { toast('Ya está en la lista'); return; }
      var item = null;
      CATALOG.forEach(function (c) { if (c.t.toLowerCase() === low) item = c; });
      if (!item) {
        var src = prompt('No tengo el icono de "' + name + '". Pega la URL del icono (cdn.prydwen.gg) o una ruta como ./archivo.webp:');
        if (!src) return;
        item = { t: name, h: './builds.html#' + slugOf(name), s: src.trim() };
      }
      if (!SAFE.test(item.h) || !SAFE_SRC.test(item.s)) { toast('Icono o ruta no válidos'); return; }
      document.querySelector('.pool .icon-row').appendChild(build(item));
      makeDraggable(); inp.value = ''; save(); toast('Agregado a Sin clasificar');
    }

    document.addEventListener('dragstart', function (e) {
      var a = e.target.closest && e.target.closest('a.char-icon');
      if (!a) return;
      dragged = a; document.body.classList.add('drag-active');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', a.title);
      setTimeout(function () { a.classList.add('dragging'); }, 0);
    });
    document.addEventListener('dragover', function (e) {
      if (!dragged) return;
      var overTrash = !!(e.target.closest && e.target.closest('#trash'));
      trashEl.classList.toggle('over', overTrash);
      if (overTrash) {
        e.preventDefault(); e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.drop-active').forEach(function (z) { z.classList.remove('drop-active'); });
        return;
      }
      var zone = e.target.closest && e.target.closest('td, .pool');
      var row = zone && zone.querySelector('.icon-row');
      document.querySelectorAll('.drop-active').forEach(function (z) { if (z !== zone) z.classList.remove('drop-active'); });
      if (!row) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      zone.classList.add('drop-active');
      place(row, e.clientX, e.clientY);
    });
    document.addEventListener('drop', function (e) {
      if (!dragged) return;
      e.preventDefault();
      if (e.target.closest && e.target.closest('#trash')) removeDragged();
    });
    document.addEventListener('dragend', function () {
      endDragUi();
      if (!dragged) return;
      dragged.classList.remove('dragging'); dragged = null;
      document.querySelectorAll('.drop-active').forEach(function (z) { z.classList.remove('drop-active'); });
      save();
    });

    /* ---------- Soporte táctil: mantén pulsado un ícono ~0.35 s y arrástralo ---------- */
    var tTimer = null, tActive = false, tStart = null, tBefore = '', tBlockClick = false, touchTrash = false;
    function clearZones() {
      document.querySelectorAll('.drop-active').forEach(function (z) { z.classList.remove('drop-active'); });
    }
    document.addEventListener('touchstart', function (e) {
      var a = e.target.closest && e.target.closest('a.char-icon');
      if (!a || e.touches.length !== 1) return;
      var t = e.touches[0];
      tStart = { x: t.clientX, y: t.clientY };
      clearTimeout(tTimer);
      tTimer = setTimeout(function () {
        tActive = true; dragged = a; tBefore = JSON.stringify(serialize());
        a.classList.add('dragging'); document.body.classList.add('drag-active');
        if (navigator.vibrate) navigator.vibrate(15);
      }, 350);
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      var t = e.touches[0];
      if (!tActive) {
        // Si el dedo se mueve antes de tiempo, es un scroll normal: cancelar el arrastre
        if (tStart && Math.abs(t.clientX - tStart.x) + Math.abs(t.clientY - tStart.y) > 10) { clearTimeout(tTimer); tStart = null; }
        return;
      }
      e.preventDefault();
      var el = document.elementFromPoint(t.clientX, t.clientY);
      var zone = el && el.closest && el.closest('td, .pool');
      var row = zone && zone.querySelector('.icon-row');
      var onTrash = !!(el && el.closest && el.closest('#trash'));
      touchTrash = onTrash; trashEl.classList.toggle('over', onTrash);
      clearZones();
      if (row && !onTrash) { zone.classList.add('drop-active'); place(row, t.clientX, t.clientY); }
      if (onTrash) return;
      if (t.clientY < 80) window.scrollBy(0, -14); else if (t.clientY > window.innerHeight - 80) window.scrollBy(0, 14);
    }, { passive: false });
    function tEnd() {
      clearTimeout(tTimer); tStart = null;
      if (!tActive) return;
      tActive = false; tBlockClick = true;
      setTimeout(function () { tBlockClick = false; }, 400);
      endDragUi();
      if (touchTrash && dragged) { var nm = dragged.title; dragged.remove(); toast('Quitado: ' + nm); }
      touchTrash = false;
      if (dragged) { dragged.classList.remove('dragging'); dragged = null; }
      clearZones();
      if (JSON.stringify(serialize()) !== tBefore) save();
    }
    document.addEventListener('touchend', tEnd);
    document.addEventListener('touchcancel', tEnd);
    document.addEventListener('click', function (e) {
      if (tBlockClick) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    document.addEventListener('contextmenu', function (e) {
      if ('ontouchstart' in window && e.target.closest && e.target.closest('a.char-icon')) e.preventDefault();
    });

    document.getElementById('btn-reset').addEventListener('click', function () {
      if (!confirm('¿Volver al orden original del archivo para todos los visitantes?')) return;
      var key = getKey(false); if (!key) return;
      fetch(API, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + key } }).then(function (r) {
        if (r.status === 401) { localStorage.removeItem(KEYSTORE); toast('Clave incorrecta'); return; }
        location.reload();
      }).catch(function () { toast('Error de red'); });
    });
    document.getElementById('btn-exit').addEventListener('click', function () {
      location.href = location.pathname;
    });
  }
})();
</script>

  <script>
    (function () {
      var body = document.body, btn = document.getElementById('smBtn'), menu = document.getElementById('smMenu'), bd = document.getElementById('smBackdrop');
      function set(open) { body.classList.toggle('sm-open', open); btn.setAttribute('aria-expanded', open); }
      btn.addEventListener('click', function () { set(!body.classList.contains('sm-open')); });
      bd.addEventListener('click', function () { set(false); });
      menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
      function onScroll() { body.classList.toggle('sm-scrolled', (window.scrollY || document.documentElement.scrollTop) > 8); }
      window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
    })();
